{q:'Kenaikan harga bahan baku yang terjadi di pasar termasuk …',o:['Strength','Weakness','Opportunity','Threat'],a:3,e:'Perubahan biaya dari luar usaha merupakan ancaman eksternal.'},
{q:'Tujuan utama menentukan target pasar ialah …',o:['Menjual ke semua orang tanpa perbedaan','Menyesuaikan produk dan pemasaran dengan kelompok pembeli utama','Menghapus kebutuhan promosi','Menghindari umpan balik konsumen'],a:1,e:'Target pasar mengarahkan produk, harga, saluran, dan komunikasi.'},
{q:'Contoh tujuan usaha yang SMART adalah …',o:['Ingin laris suatu hari','Harus menjadi nomor satu','Menjual lebih banyak tanpa batas waktu','Menjual 60 bungkus per minggu dalam 2 bulan'],a:3,e:'Tujuan ini memiliki hasil terukur dan batas waktu; kelayakannya tetap perlu dicek.'},
{q:'Mengapa perlu riset pasar sebelum memperbesar produksi?',o:['Agar tidak perlu mencatat biaya','Supaya produk tidak punya pesaing','Untuk memeriksa kebutuhan dan mengurangi keputusan berdasarkan dugaan','Agar penjualan selalu pasti'],a:2,e:'Riset memberi informasi untuk menguji asumsi usaha.'},
{q:'Menawarkan keripik yang sama ke wilayah baru adalah …',o:['Pengembangan pasar','Pengembangan produk','Diversifikasi','Penutupan usaha'],a:0,e:'Produk lama ditawarkan kepada kelompok atau wilayah pelanggan baru.'}
];
const state={idx:0,swot:{},quiz:{},speaker:false};
const $=(s)=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderSwot(){const el=$('#swotExercise');if(!el)return;el.innerHTML=swotItems.map((q,i)=>{let selected=state.swot[i];return `<div class="question"><b>${i+1}. ${q.t}</b><div class="swot-choices">${['S','W','O','T'].map(c=>`<button data-swot-item="${i}" data-swot-choice="${c}" class="${selected===c?(c===q.a?'pick':'wrong'):''}" aria-label="Soal ${i+1}, jawaban ${c}">${c}</button>`).join('')}</div>${selected?`<p class="q-result">${selected===q.a?'✅ Tepat.':'❌ Belum tepat. Jawaban: '+q.a+'.'} ${q.why}</p>`:''}</div>`}).join('');let correct=swotItems.filter((q,i)=>state.swot[i]===q.a).length;let answered=Object.keys(state.swot).length;$('#swotScore').textContent=`${correct} / ${swotItems.length}`;$('#swotDetail').textContent=answered===swotItems.length?'Latihan selesai. Coba perbaiki jawaban yang belum tepat.':`${answered} dari ${swotItems.length} situasi sudah dijawab.`}
function renderQuiz(){const el=$('#quizList');if(!el)return;el.innerHTML=questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b><div class="options">${q.o.map((o,j)=>{let chosen=state.quiz[i]===j;return `<button data-quizitem="${i}" data-quizchoice="${j}" class="${chosen?'answered '+(j===q.a?'correct':'incorrect'):''}">${String.fromCharCode(65+j)}. ${o}</button>`}).join('')}</div>${state.quiz[i]!==undefined?`<p class="q-result">${state.quiz[i]===q.a?'✅ Benar.':'❌ Jawaban benar: '+String.fromCharCode(65+q.a)+'.'} ${q.e}</p>`:''}</div>`).join('');const answered=Object.keys(state.quiz).length;const correct=questions.filter((q,i)=>state.quiz[i]===q.a).length;$('#quizScore').textContent=`${correct} / ${questions.length}`;$('#quizResult').textContent=answered===questions.length?`Nilai ${Math.round(correct/questions.length*100)} / 100. ${correct>=6?'Bagus, lanjutkan proyek pengembangan usaha.':'Pelajari lagi materi yang belum dikuasai.'}`:`${answered} dari ${questions.length} pertanyaan telah dijawab.`}
function readPlan(){try{return JSON.parse(localStorage.getItem('pkk12_plan_bab1')||'{}')}catch{return {}}}
function fillPlan(){const data=readPlan();document.querySelectorAll('[data-plan]').forEach(el=>{el.value=data[el.dataset.plan]||''})}
function savePlan(){const o={};document.querySelectorAll('[data-plan]').forEach(el=>o[el.dataset.plan]=el.value);try{localStorage.setItem('pkk12_plan_bab1',JSON.stringify(o))}catch{}return o}
function planText(o){return `RENCANA PENGEMBANGAN USAHA — PKK XII, BAB 1\nNama usaha: ${o.name||'-'}\nProduk/jasa: ${o.product||'-'}\nTarget pasar: ${o.target||'-'}\nTujuan SMART: ${o.goal||'-'}\nS — Kekuatan: ${o.s||'-'}\nW — Kelemahan: ${o.w||'-'}\nO — Peluang: ${o.o||'-'}\nT — Ancaman: ${o.t||'-'}\nStrategi & langkah awal: ${o.action||'-'}`}
function stopSpeech(){if('speechSynthesis'in window){speechSynthesis.cancel()}state.speaker=false;$('#audioBtn').textContent='🔊';$('#audioBtn').title='Bacakan ringkasan slide'}
function speak(){if(!('speechSynthesis'in window)){alert('Browser ini belum mendukung pembacaan suara.');return}if(state.speaker){stopSpeech();return}stopSpeech();const msg=new SpeechSynthesisUtterance(slides[state.idx].narration);msg.lang='id-ID';msg.rate=.94;msg.pitch=1;msg.onend=()=>{state.speaker=false;$('#audioBtn').textContent='🔊'};msg.onerror=()=>{state.speaker=false;$('#audioBtn').textContent='🔊'};speechSynthesis.speak(msg);state.speaker=true;$('#audioBtn').textContent='⏹'}
function navigate(i){if(i<0||i>=slides.length)return;stopSpeech();state.idx=i;const slide=slides[i];$('#content').innerHTML=slide.render();$('#topTitle').textContent=slide.name;$('#counter').textContent=`${i+1} / ${slides.length}`;$('#footerTitle').textContent=slide.section;$('#progress').style.width=`${(i+1)/slides.length*100}%`;$('#prevBtn').disabled=i===0;$('#nextBtn').textContent=i===slides.length-1?'Kembali ke Awal ↺':'Selanjutnya ❯';$('#deck').scrollTop=0;$('#dots').innerHTML=Array.from({length:Math.min(12,slides.length)},(_,j)=>`<span class="dot ${Math.floor(i/2)===j?'active':''}"></span>`).join('');if(i===13)renderSwot();if(i===21)renderQuiz();if(i===20)fillPlan();window.location.hash=`slide-${i+1}`;closeIndex()}
function openIndex(){const idx=$('#indexGrid');idx.innerHTML=slides.map((s,i)=>`<button class="${i===state.idx?'selected':''}" data-goto="${i}"><small>${String(i+1).padStart(2,'0')} · ${s.section}</small>${s.name}</button>`).join('');$('#indexPanel').classList.add('open')}
function closeIndex(){$('#indexPanel').classList.remove('open')}
function feedback(selector,message,bad=false){const el=$(selector);if(el){el.className=`feedback ${bad?'bad':''}`;el.innerHTML=message}}
const revealData={lokal:'Contoh: singkong setempat diolah menjadi keripik dengan kemasan lebih praktis dan variasi rasa.',digital:'Contoh: jasa foto produk dan pengelolaan katalog digital untuk pedagang kecil.',pelayanan:'Contoh: layanan antar pesanan kantin untuk siswa atau guru pada jam yang disepakati.'};
const personaData={siswa:['Persona: Rani, pelajar SMK','Kebutuhan: camilan murah, mudah dibawa dan dapat dipesan saat istirahat.','Pendekatan: ukuran kecil, harga jelas, promosi di lingkungan sekolah.'],pegawai:['Persona: Dimas, pegawai','Kebutuhan: pemesanan cepat, jadwal pengiriman jelas, pembayaran praktis.','Pendekatan: paket bundling dan sistem pre-order.'],keluarga:['Persona: Ibu Maya, pembeli untuk keluarga','Kebutuhan: kemasan bersih, informasi produk jelas, ukuran ekonomis.','Pendekatan: paket keluarga dan komunikasi kualitas produk.']};
const strategyData={penetrasi:['Penetrasi pasar','Contoh: program paket hemat untuk pelanggan yang sudah ada.','Risiko: diskon berlebihan menurunkan laba. Pantau margin.'],produk:['Pengembangan produk','Contoh: rasa keripik baru untuk pelanggan sekolah.','Risiko: stok bahan dan uji rasa memerlukan biaya tambahan.'],pasar:['Pengembangan pasar','Contoh: keripik yang sama ditawarkan ke tetangga sekolah atau lewat katalog daring.','Risiko: biaya pengiriman serta kebiasaan konsumen berbeda.'],diversifikasi:['Diversifikasi','Contoh: produsen keripik membuka usaha minuman untuk pelanggan kantor.','Risiko: produk dan pasar sama-sama baru sehingga ketidakpastian lebih tinggi.']};
function handleClick(event){const b=event.target.closest('button');if(!b)return;const d=b.dataset;
if(d.goto!==undefined){navigate(Number(d.goto));return}
if(d.warmup){const ok=d.warmup==='b';document.querySelectorAll('[data-warmup]').forEach(x=>x.classList.toggle('chosen',x===b));feedback('#warmupFeedback',ok?'✅ Tepat. Mulai dengan memahami penyebab dan kebutuhan pelanggan. Data dapat menjadi dasar perbaikan.':'💡 Diskusikan lagi. Sebelum mengambil keputusan besar, cari penyebab melalui umpan balik pelanggan.',!ok);return}
if(d.reveal){feedback('#revealTarget',revealData[d.reveal]);return}
if(d.swotItem!==undefined){state.swot[Number(d.swotItem)]=d.swotChoice;renderSwot();return}
if(d.resetSwot){state.swot={};renderSwot();return}
if(d.persona){const [h,need,approach]=personaData[d.persona];document.querySelectorAll('[data-persona]').forEach(x=>x.classList.toggle('chosen',x===b));$('#personaDetail').innerHTML=`<h3>${h}</h3><p>${need}</p><p class="mb0"><b>Contoh pendekatan:</b> ${approach.replace('Pendekatan: ','')}</p>`;return}
if(d.strategy){const [head,ex,risk]=strategyData[d.strategy];document.querySelectorAll('[data-strategy]').forEach(x=>x.classList.toggle('chosen',x===b));feedback('#strategyFeedback',`<b>${head}</b><br>${ex}<br><span class="muted">${risk}</span>`);return}
if(d.case){let ok=d.case==='b';document.querySelectorAll('[data-case]').forEach(x=>x.classList.toggle('chosen',x===b));feedback('#caseFeedback',ok?'✅ Masuk akal. Penawaran paket dan pre-order dapat diuji pada kapasitas yang tersedia. Tetap hitung biaya dan laba.':'❌ Pilihan ini memiliki risiko besar atau tidak menyelesaikan masalah. Coba strategi yang dapat diuji tanpa melampaui kapasitas.',!ok);return}
if(d.quizitem!==undefined){state.quiz[Number(d.quizitem)]=Number(d.quizchoice);renderQuiz();return}
if(d.resetquiz){state.quiz={};renderQuiz();return}
if(d.copyplan){const text=planText(savePlan());const out=$('#planFeedback');const ok=()=>feedback('#planFeedback','✅ Rencana berhasil disalin. Tempelkan pada catatan atau dokumen tugas.');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(()=>fallbackCopy(text,out))}else{fallbackCopy(text,out)}return}
if(d.exampleplan){const example={name:'Kriuk Kita',product:'Keripik singkong kemasan',target:'Siswa dan guru yang suka camilan praktis',goal:'Menaikkan penjualan dari 40 menjadi 60 bungkus per minggu dalam 2 bulan',s:'Rasa khas, kemasan rapi',w:'Alat terbatas, promosi belum rutin',o:'Bazar sekolah, layanan pesan online',t:'Harga minyak naik, pesaing baru',action:'Uji paket hemat dan pre-order selama 2 minggu, catat penjualan dan laba'};document.querySelectorAll('[data-plan]').forEach(el=>el.value=example[el.dataset.plan]||'');savePlan();feedback('#planFeedback','Contoh berhasil dimasukkan. Silakan ubah sesuai ide usaha sendiri.');return}
if(d.clearplan){document.querySelectorAll('[data-plan]').forEach(el=>el.value='');savePlan();feedback('#planFeedback','Isian telah dikosongkan.');return}
}
function fallbackCopy(text,out){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();if(ok)feedback('#planFeedback','✅ Rencana disalin.');else feedback('#planFeedback',`Browser memblokir penyalinan otomatis. Pilih teks berikut lalu salin:<textarea style="width:100%;min-height:150px">${esc(text)}</textarea>`,true)}
$('#content').addEventListener('click',handleClick);$('#indexGrid').addEventListener('click',handleClick);$('#content').addEventListener('input',e=>{if(e.target.matches('[data-plan]'))savePlan()});$('#prevBtn').onclick=()=>navigate(state.idx-1);$('#nextBtn').onclick=()=>navigate(state.idx===slides.length-1?0:state.idx+1);$('#homeBtn').onclick=()=>navigate(0);$('#menuBtn').onclick=openIndex;$('#closeIndex').onclick=closeIndex;$('#indexPanel').addEventListener('click',e=>{if(e.target.id==='indexPanel')closeIndex()});$('#audioBtn').onclick=speak;
$('#fullBtn').onclick=()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen()}catch{}};
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||$('#indexPanel').classList.contains('open')){if(e.key==='Escape')closeIndex();return}if(e.key==='ArrowRight')navigate(state.idx+1);if(e.key==='ArrowLeft')navigate(state.idx-1);if(e.key==='Escape')stopSpeech()});
window.addEventListener('hashchange',()=>{let m=location.hash.match(/^#slide-(\d+)$/);if(m&&Number(m[1])-1!==state.idx)navigate(Number(m[1])-1)});
const start=(location.hash.match(/^#slide-(\d+)$/)||[])[1];navigate(start?Math.min(slides.length-1,Math.max(0,Number(start)-1)):0);
</script></body></html>
