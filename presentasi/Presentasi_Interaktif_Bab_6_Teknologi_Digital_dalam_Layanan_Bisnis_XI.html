<script id="slide-data" type="application/json">[{"title":"Teknologi Digital dalam Layanan Bisnis","tag":"BAB 6 • MANAJEMEN LAYANAN BISNIS","body":"<div class=\"cover-intro\"><span class=\"eyebrow\">KELAS XI SMK • FASE F<\/span><h2>Kantor Cerdas, Pelayanan Profesional<\/h2><p>Belajar menggunakan aplikasi perkantoran, mengelola file dan cloud, berkomunikasi secara digital, melindungi data, serta menyelesaikan masalah pelanggan melalui simulasi nyata.<\/p><div class=\"hero-pills\"><span>54 slide<\/span><span>6 simulasi praktik<\/span><span>15 soal kuis<\/span><span>2 LKPD<\/span><\/div><\/div>","visual":"office","mode":"cover","section":"Pendahuluan"},{"title":"Tujuan Pembelajaran","tag":"KOMPETENSI YANG DICAPAI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Memahami konsep<\/h3><p>Menjelaskan peran teknologi digital dalam proses layanan bisnis.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Mengoperasikan aplikasi<\/h3><p>Menggunakan pengolah kata, spreadsheet, presentasi dan komunikasi digital.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Mengelola informasi<\/h3><p>Menerapkan penyimpanan, penamaan, berbagi dan kolaborasi dokumen.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Menjaga keamanan<\/h3><p>Mengidentifikasi ancaman digital dan menerapkan langkah perlindungan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Melakukan simulasi<\/h3><p>Menyelesaikan tugas layanan pelanggan secara digital.<\/p><\/article><\/div><aside class=\"note\"><strong>Indikator keberhasilan<\/strong><p>Siswa mampu menghasilkan dokumen dan rekap sederhana, menyusun email profesional, menentukan akses file yang tepat, dan mengenali pesan berisiko.<\/p><\/aside>","visual":"team","mode":"normal","section":"Pendahuluan"},{"title":"Peta Materi Bab 6","tag":"ALUR BELAJAR","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Fondasi teknologi<\/h3><p>Digitalisasi kantor, perangkat kerja, dan alur proses.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Aplikasi kantor<\/h3><p>Dokumen, spreadsheet, dan presentasi.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Komunikasi & kolaborasi<\/h3><p>Email, kalender, rapat online dan pengelolaan file.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Layanan pelanggan<\/h3><p>Sistem tiket, basis data dan standar pelayanan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Keamanan & evaluasi<\/h3><p>Perlindungan informasi, simulasi, dan proyek siswa.<\/p><\/div><\/div><\/div>","visual":"cloud","mode":"normal","section":"Pendahuluan"},{"title":"Apa Itu Teknologi Digital?","tag":"KONSEP DASAR","body":"<p class=\"lead\">Teknologi digital adalah penggunaan perangkat, aplikasi, dan jaringan untuk mengolah, menyimpan, mengirim, serta memanfaatkan informasi dalam bentuk data digital.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Input<\/h3><p>Data diterima melalui keyboard, formulir, scanner, atau aplikasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Proses<\/h3><p>Komputer dan aplikasi mengolah data menjadi informasi yang diperlukan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Output<\/h3><p>Hasil berupa laporan, email, tanda terima, atau tampilan status layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Penyimpanan<\/h3><p>Data disimpan di perangkat atau cloud dengan pengaturan keamanan.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh di kantor<\/strong><p>Data pesanan masuk dari formulir → dicatat ke spreadsheet → diverifikasi → dikirimkan konfirmasi melalui email.<\/p><\/aside>","visual":"office","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Mengapa Kantor Beralih ke Digital?","tag":"MANFAAT DAN BATASAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Lebih cepat<\/h3><p>Data dapat dihitung, ditelusuri, dan dikirim dalam hitungan detik.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Lebih akurat<\/h3><p>Validasi dan rumus membantu mengurangi kesalahan manual.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Lebih mudah kolaborasi<\/h3><p>Anggota tim dapat bekerja pada dokumen bersama.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Mudah dipantau<\/h3><p>Riwayat pekerjaan dan laporan dapat ditinjau.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Tetap ada risiko<\/h3><p>Ketergantungan internet, kesalahan akses, ancaman siber dan gangguan perangkat.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip utama<\/strong><p>Digital bukan berarti tanpa pemeriksaan. Hasil otomatis harus tetap diverifikasi sebelum dikirim kepada pelanggan.<\/p><\/aside>","visual":"office","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Ekosistem Kantor Digital","tag":"PERANGKAT, APLIKASI, MANUSIA","body":"<div class=\"diagram-tiles\"><div>🖥️<b>Perangkat<\/b><small>Komputer, scanner, printer<\/small><\/div><div>🧩<b>Aplikasi<\/b><small>Dokumen, data, CRM<\/small><\/div><div>🌐<b>Jaringan<\/b><small>Internet, Wi-Fi, cloud<\/small><\/div><div>👥<b>SDM<\/b><small>Admin, CS, pimpinan<\/small><\/div><div>🔒<b>Keamanan<\/b><small>Akses, backup, MFA<\/small><\/div><\/div><aside class=\"note\"><strong>Hubungan antar unsur<\/strong><p>Teknologi efektif bila ditunjang prosedur kerja, kompetensi pengguna, dan pembagian tanggung jawab yang jelas.<\/p><\/aside>","visual":"cloud","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Perangkat Keras Perkantoran","tag":"HARDWARE","body":"<div class=\"table-wrap\"><table><thead><tr><th>Perangkat<\/th><th>Fungsi<\/th><th>Contoh penggunaan<\/th><\/tr><\/thead><tbody><tr><td>Komputer / laptop<\/td><td>Memproses data dan menjalankan aplikasi<\/td><td>Menyusun laporan<\/td><\/tr><tr><td>Scanner<\/td><td>Mengubah dokumen kertas menjadi berkas digital<\/td><td>Memindai surat<\/td><\/tr><tr><td>Printer<\/td><td>Mencetak dokumen<\/td><td>Cetak daftar hadir<\/td><\/tr><tr><td>Router / modem<\/td><td>Menghubungkan perangkat ke jaringan<\/td><td>Akses aplikasi daring<\/td><\/tr><tr><td>Penyimpanan eksternal<\/td><td>Media salinan data tambahan<\/td><td>Backup berkas sesuai SOP<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Perhatian<\/strong><p>Penggunaan flashdisk dan perangkat eksternal harus mengikuti kebijakan keamanan perusahaan.<\/p><\/aside>","visual":"devices","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Perangkat Lunak Perkantoran","tag":"SOFTWARE","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Pengolah kata<\/h3><p>Menulis surat, laporan, proposal dan formulir.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Pengolah angka<\/h3><p>Menghitung transaksi, rekap dan menganalisis data.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Presentasi<\/h3><p>Menyampaikan laporan secara visual.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Komunikasi<\/h3><p>Email, obrolan tim, rapat online.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Sistem bisnis<\/h3><p>CRM, aplikasi tiket, dan arsip digital.<\/p><\/article><\/div><p class=\"small\">Contoh aplikasi yang sering digunakan: Microsoft Word, Excel, PowerPoint; Google Docs, Sheets, Slides; dan platform komunikasi perusahaan.<\/p>","visual":"docs","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Input, Proses, Output dan Penyimpanan","tag":"ALUR INFORMASI","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Input<\/h3><p>Petugas menerima data pelanggan melalui formulir online.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Proses<\/h3><p>Data diverifikasi dan diolah menggunakan aplikasi.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Output<\/h3><p>Sistem menghasilkan nomor tiket dan konfirmasi.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Penyimpanan<\/h3><p>Riwayat layanan tersimpan dengan kontrol akses.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Tindak lanjut<\/h3><p>Petugas memantau status sampai permintaan selesai.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Diskusi<\/strong><p>Apa dampaknya jika data pelanggan salah dimasukkan pada tahap input?<\/p><\/aside>","visual":"crm","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Digitalisasi Proses Administrasi","tag":"CONTOH ALUR KERJA","body":"<div class=\"compare\"><div><h3>Proses manual<\/h3><ul class=\"rich-list\"><li>Formulir kertas diterima.<\/li><li>Data dicatat ulang.<\/li><li>Laporan dihitung manual.<\/li><li>Dokumen dipindah secara fisik.<\/li><\/ul><\/div><div><h3>Proses digital<\/h3><ul class=\"rich-list\"><li>Formulir elektronik diterima.<\/li><li>Validasi data otomatis.<\/li><li>Laporan dihitung dengan rumus.<\/li><li>Status dipantau lewat sistem.<\/li><\/ul><\/div><\/div><aside class=\"note\"><strong>Ingat<\/strong><p>Digitalisasi yang baik memperbaiki alur kerja, bukan hanya mengganti kertas menjadi file PDF.<\/p><\/aside>","visual":"office","mode":"normal","section":"01 • Fondasi Teknologi"},{"title":"Pengolah Kata untuk Layanan Bisnis","tag":"WORD PROCESSING","body":"<p class=\"lead\">Aplikasi pengolah kata dipakai untuk membuat dokumen resmi yang akurat, rapi, mudah diperbarui dan mudah dibaca.<\/p><ul class=\"rich-list\"><li><b>Contoh:<\/b> surat penawaran, surat undangan, berita acara, notula, SOP, laporan.<\/li><li>Gunakan judul, paragraf, margin, dan penomoran yang konsisten.<\/li><li>Periksa ejaan, tanggal, pihak tujuan, tanda tangan, dan lampiran.<\/li><li>Simpan dengan nama file yang jelas dan format sesuai kebutuhan.<\/li><\/ul><div class=\"mock-paper\"><span class=\"paper-head\">PT NUSANTARA DIGITAL<\/span><span class=\"paper-line\"><\/span><span class=\"paper-line short\"><\/span><span class=\"paper-line\"><\/span><span class=\"paper-line\"><\/span><span class=\"paper-sign\">Hormat kami, ______<\/span><\/div>","visual":"docs","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Struktur Dokumen Profesional","tag":"STANDAR KUALITAS","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Identitas dokumen<\/h3><p>Kop, nomor, tanggal, pihak tujuan dan perihal.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Isi yang jelas<\/h3><p>Tujuan dokumen disampaikan singkat, benar, dan runtut.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Konsistensi<\/h3><p>Font, judul, spasi, tabel dan istilah sesuai standar.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Validasi<\/h3><p>Periksa angka, nama, lampiran, dan persetujuan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Pengendalian versi<\/h3><p>Gunakan versi final yang telah disetujui untuk distribusi.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh penamaan<\/strong><p>2026-11-16_Surat-Penawaran_PT-Nusantara_v01.docx<\/p><\/aside>","visual":"docs","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Praktik: Menyusun Surat Bisnis","tag":"SIMULASI DOKUMEN","body":"<p class=\"lead\">Isi unsur surat berikut, lalu tekan <b>Periksa Dokumen<\/b> untuk melihat ketepatannya. Data bersifat simulasi dan tidak dikirim ke mana pun.<\/p><div id=\"sim-document\"><\/div>","visual":"docs","mode":"docsim","section":"02 • Aplikasi Perkantoran"},{"title":"Aplikasi Pengolah Angka","tag":"SPREADSHEET","body":"<p class=\"lead\">Spreadsheet adalah lembar kerja berbasis baris, kolom dan sel yang digunakan untuk mengolah data dan melakukan perhitungan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Baris & kolom<\/h3><p>Baris bernomor, kolom berhuruf; perpotongannya disebut sel.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Rumus<\/h3><p>Rumus diawali tanda =, misalnya =B2*C2.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Fungsi<\/h3><p>SUM menjumlahkan, AVERAGE menghitung rata-rata.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Sort dan filter<\/h3><p>Mempermudah pengurutan dan pencarian data.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Visualisasi<\/h3><p>Grafik membantu membaca tren secara cepat.<\/p><\/article><\/div>","visual":"sheet","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Dasar Rumus dalam Spreadsheet","tag":"RUMUS SEDERHANA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Kebutuhan<\/th><th>Contoh rumus<\/th><th>Hasil<\/th><\/tr><\/thead><tbody><tr><td>Mengalikan jumlah dan harga<\/td><td>=B2*C2<\/td><td>Subtotal<\/td><\/tr><tr><td>Menjumlahkan subtotal<\/td><td>=SUM(D2:D6)<\/td><td>Total<\/td><\/tr><tr><td>Menghitung rata-rata<\/td><td>=AVERAGE(D2:D6)<\/td><td>Rata-rata<\/td><\/tr><tr><td>Menghitung jumlah data angka<\/td><td>=COUNT(D2:D6)<\/td><td>Banyak sel berisi angka<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Kesalahan umum<\/strong><p>Perhatikan jenis data: angka harus ditulis sebagai angka, bukan teks yang mengandung karakter lain.<\/p><\/aside>","visual":"sheet","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Praktik: Rekap Pesanan Digital","tag":"SIMULASI SPREADSHEET","body":"<p class=\"lead\">Ubah jumlah dan harga barang. Sistem akan menghitung subtotal dan total secara otomatis seperti pengolah angka.<\/p><div id=\"sim-sheet\"><\/div>","visual":"sheet","mode":"sheetsim","section":"02 • Aplikasi Perkantoran"},{"title":"Aplikasi Presentasi","tag":"PENYAJIAN INFORMASI","body":"<p class=\"lead\">Presentasi digunakan untuk menjelaskan informasi bisnis secara terstruktur, misalnya ringkasan laporan, rencana proyek, dan evaluasi layanan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Satu gagasan utama<\/h3><p>Jangan memasukkan seluruh laporan ke satu slide.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Visual relevan<\/h3><p>Gunakan grafik, gambar, dan diagram untuk memperjelas informasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Keterbacaan<\/h3><p>Pastikan font, ukuran dan kontras terbaca dari jauh.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Alur<\/h3><p>Mulai dari masalah, data, solusi, lalu kesimpulan.<\/p><\/article><\/div>","visual":"slides","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Prinsip Desain Slide Profesional","tag":"KOMUNIKASI VISUAL","body":"<div class=\"compare\"><div><h3>Kurang efektif<\/h3><ul class=\"rich-list\"><li>Seluruh paragraf dipadatkan.<\/li><li>Warna terlalu banyak.<\/li><li>Judul tidak menonjol.<\/li><li>Grafik tanpa sumber atau keterangan.<\/li><\/ul><\/div><div><h3>Lebih efektif<\/h3><ul class=\"rich-list\"><li>Poin dipilih berdasarkan tujuan.<\/li><li>Palet warna konsisten.<\/li><li>Judul dan angka kunci menonjol.<\/li><li>Grafik diberi label yang jelas.<\/li><\/ul><\/div><\/div><aside class=\"note\"><strong>Latihan cepat<\/strong><p>Buat satu slide yang menampilkan jumlah keluhan pelanggan dalam satu minggu, lengkap dengan kesimpulan.<\/p><\/aside>","visual":"slides","mode":"normal","section":"02 • Aplikasi Perkantoran"},{"title":"Komunikasi Bisnis Digital","tag":"MEDIA & ETIKA","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Email<\/h3><p>Komunikasi resmi dengan jejak dokumentasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Aplikasi percakapan<\/h3><p>Koordinasi cepat, sesuai aturan perusahaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Rapat video<\/h3><p>Diskusi jarak jauh dan koordinasi tim.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Portal pelanggan<\/h3><p>Sarana permintaan, pengaduan dan pemberitahuan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Kalender bersama<\/h3><p>Menjadwalkan kegiatan dan tenggat.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Pilih saluran berdasarkan urgensi, kerahasiaan, penerima dan kebutuhan dokumentasi.<\/p><\/aside>","visual":"team","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Anatomi Email Profesional","tag":"SUBJEK, ISI, LAMPIRAN","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Penerima<\/h3><p>Pastikan alamat email dan hak penerima tepat.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Subjek<\/h3><p>Tulis singkat, spesifik dan menggambarkan tujuan.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Salam<\/h3><p>Gunakan pembuka yang sopan sesuai hubungan kerja.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Isi<\/h3><p>Jelaskan maksud, informasi penting, dan tindak lanjut.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Penutup<\/h3><p>Sertakan ucapan terima kasih dan identitas pengirim.<\/p><\/div><\/div><div class=\"step\"><b>06<\/b><div><h3>Pemeriksaan akhir<\/h3><p>Verifikasi lampiran, tautan, angka dan penerima sebelum mengirim.<\/p><\/div><\/div><\/div>","visual":"mail","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Etika Email dan Pesan Kerja","tag":"NETIKET","body":"<ul class=\"rich-list\"><li>Gunakan bahasa profesional dan hindari huruf kapital penuh yang dapat terkesan membentak.<\/li><li>Balas sesuai standar waktu layanan yang berlaku.<\/li><li>Gunakan CC untuk pihak yang perlu mengetahui dan BCC hanya jika memang sesuai kebijakan.<\/li><li>Jangan membagikan data sensitif ke grup atau penerima yang tidak berwenang.<\/li><li>Hindari membuka tautan atau lampiran mencurigakan.<\/li><li>Pisahkan komunikasi kerja dengan obrolan pribadi bila kebijakan kantor mengharuskannya.<\/li><\/ul><aside class=\"note\"><strong>Contoh subjek yang baik<\/strong><p>Permohonan Konfirmasi Jadwal Rapat – 20 November 2026<\/p><\/aside>","visual":"mail","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Praktik: Tulis Email Pelanggan","tag":"SIMULASI KOMUNIKASI","body":"<p class=\"lead\">Buat draf email balasan atas permintaan informasi pelanggan. Pemeriksa akan menilai unsur komunikasi dasar; pesan <b>tidak benar-benar dikirim<\/b>.<\/p><div id=\"sim-email\"><\/div>","visual":"mail","mode":"emailsim","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Kalender Digital dan Tugas Bersama","tag":"PENGELOLAAN WAKTU","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Jadwal<\/h3><p>Buat agenda berisi waktu, lokasi/tautan, peserta, dan tujuan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Pengingat<\/h3><p>Atur pengingat tenggat dokumen atau rapat.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pembagian tugas<\/h3><p>Tetapkan penanggung jawab dan tenggat yang jelas.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Status pekerjaan<\/h3><p>Pantau tugas: belum mulai, proses, selesai.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Pengendalian konflik<\/h3><p>Cek bentrok jadwal sebelum mengirim undangan.<\/p><\/article><\/div><aside class=\"note\"><strong>Simulasi<\/strong><p>Rapat evaluasi layanan: Kamis, 19 November 2026 pukul 09.00–10.00 WIB, agenda evaluasi pengaduan pelanggan.<\/p><\/aside>","visual":"calendar","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Etika Rapat Online","tag":"PRAKTIK RAPAT DARING","body":"<div class=\"compare\"><div><h3>Sebelum rapat<\/h3><ul class=\"rich-list\"><li>Periksa kamera, mikrofon dan jaringan.<\/li><li>Buka agenda serta dokumen rapat.<\/li><li>Gunakan nama akun yang profesional.<\/li><\/ul><\/div><div><h3>Saat dan setelah rapat<\/h3><ul class=\"rich-list\"><li>Bergiliran berbicara dan nonaktifkan mikrofon saat tidak digunakan.<\/li><li>Jangan merekam tanpa izin atau dasar yang sesuai.<\/li><li>Bagikan notula dan tindak lanjut kepada pihak yang berwenang.<\/li><\/ul><\/div><\/div>","visual":"team","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Manajemen File Digital","tag":"PENYIMPANAN TERATUR","body":"<p class=\"lead\">File perlu disimpan dalam struktur folder yang logis agar mudah ditemukan, digunakan, dan dipertanggungjawabkan.<\/p><div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Klasifikasi<\/h3><p>Kelompokkan berdasarkan jenis kegiatan atau unit kerja.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Nama file<\/h3><p>Gunakan tanggal, topik, pihak dan versi jika relevan.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Lokasi<\/h3><p>Simpan dalam folder resmi, bukan tersebar di perangkat pribadi.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Kontrol akses<\/h3><p>Tentukan siapa boleh melihat, memberi komentar, atau mengedit.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Pemeliharaan<\/h3><p>Lakukan pemeriksaan, backup, dan pengendalian versi.<\/p><\/div><\/div><\/div>","visual":"files","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Aturan Penamaan File","tag":"FILE NAMING","body":"<div class=\"compare\"><div><h3>Hindari<\/h3><ul class=\"rich-list\"><li>dokumenbaru(5)FINALfix.docx<\/li><li>IMG_001234.jpg tanpa konteks<\/li><li>laporan terbaru banget.xlsx<\/li><\/ul><\/div><div><h3>Disarankan<\/h3><ul class=\"rich-list\"><li>2026-11-16_Laporan-Layanan_v01.xlsx<\/li><li>2026-11-16_Surat-Penawaran_PT-Mitra.pdf<\/li><li>2026-11_Notula-Rapat-Tim_v02.docx<\/li><\/ul><\/div><\/div><aside class=\"note\"><strong>Rumus sederhana<\/strong><p>Tanggal + jenis dokumen + topik/pihak + versi. Sesuaikan dengan SOP organisasi.<\/p><\/aside>","visual":"files","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Praktik: Pilih Folder Penyimpanan","tag":"SIMULASI PENGELOLAAN FILE","body":"<p class=\"lead\">Ada enam dokumen baru. Tentukan folder penyimpanan yang paling tepat untuk setiap dokumen.<\/p><div id=\"sim-files\"><\/div>","visual":"files","mode":"filesim","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Cloud Computing","tag":"KOMPUTASI BERBASIS ONLINE","body":"<p class=\"lead\">Cloud computing memungkinkan penyimpanan dan penggunaan layanan komputasi melalui jaringan, tanpa seluruh aplikasi dan data harus berada di satu komputer lokal.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Kelebihan<\/h3><p>Bisa mengakses dokumen dengan izin, memudahkan kerja bersama dan sinkronisasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Tantangan<\/h3><p>Koneksi internet, ketersediaan layanan, kesalahan konfigurasi, serta kontrol akses.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Contoh<\/h3><p>Penyimpanan dokumen bersama, kalender, email kerja dan aplikasi bisnis berbasis web.<\/p><\/article><\/div><aside class=\"note\"><strong>Perlu diingat<\/strong><p>Cloud bukan berarti data selalu aman secara otomatis. Pengguna tetap harus mengatur izin dan melindungi akun.<\/p><\/aside>","visual":"cloud","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Hak Akses dan Berbagi Dokumen","tag":"VIEWER, COMMENTER, EDITOR","body":"<div class=\"table-wrap\"><table><thead><tr><th>Peran<\/th><th>Kewenangan umum<\/th><th>Contoh penerapan<\/th><\/tr><\/thead><tbody><tr><td>Viewer / Pembaca<\/td><td>Melihat dokumen<\/td><td>Pimpinan membaca laporan<\/td><\/tr><tr><td>Commenter / Komentator<\/td><td>Melihat dan menambahkan komentar<\/td><td>Guru mengoreksi draf<\/td><\/tr><tr><td>Editor / Penyunting<\/td><td>Mengubah isi dokumen<\/td><td>Staf pembuat laporan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Praktik terbaik<\/strong><p>Berikan hak akses paling terbatas yang tetap memungkinkan seseorang menjalankan tugasnya. Nama peran dapat berbeda antar aplikasi.<\/p><\/aside>","visual":"cloud","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Kolaborasi dan Riwayat Versi","tag":"KERJA TIM DIGITAL","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Buat dokumen bersama<\/h3><p>Tentukan pemilik, tujuan dan struktur dokumen.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Bagi akses<\/h3><p>Undang anggota tim sesuai perannya.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Kolaborasi<\/h3><p>Gunakan komentar dan saran, bukan mengubah sembarang bagian.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Periksa versi<\/h3><p>Gunakan riwayat perubahan apabila tersedia.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Persetujuan final<\/h3><p>Pastikan pihak berwenang menyetujui dokumen sebelum distribusi.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Kasus<\/strong><p>Dua pegawai mengedit laporan yang sama. Bagaimana mencegah versi ganda dan kehilangan perubahan?<\/p><\/aside>","visual":"team","mode":"normal","section":"03 • Komunikasi dan Kolaborasi"},{"title":"Data Pelanggan dan CRM","tag":"CUSTOMER RELATIONSHIP MANAGEMENT","body":"<p class=\"lead\">CRM adalah pendekatan dan sistem untuk mengelola hubungan dengan pelanggan, termasuk catatan interaksi, permintaan, dan tindak lanjut.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Identitas terbatas<\/h3><p>Catat data yang diperlukan untuk keperluan layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Riwayat interaksi<\/h3><p>Catat kapan pelanggan menghubungi dan apa kebutuhannya.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Status<\/h3><p>Tampilkan apakah permintaan baru, diproses atau selesai.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Tindak lanjut<\/h3><p>Tetapkan petugas yang bertanggung jawab.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Analisis<\/h3><p>Gunakan data agregat untuk perbaikan pelayanan.<\/p><\/article><\/div>","visual":"crm","mode":"normal","section":"04 • Sistem Layanan Digital"},{"title":"Alur Sistem Tiket Pelanggan","tag":"TICKET MANAGEMENT","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Tiket dibuat<\/h3><p>Permintaan masuk dan mendapat nomor referensi.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Klasifikasi<\/h3><p>Tentukan kategori, urgensi dan kelengkapan informasi.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Penugasan<\/h3><p>Tiket diberikan kepada petugas yang tepat.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Penanganan<\/h3><p>Petugas menyelesaikan atau meneruskan sesuai kewenangan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Konfirmasi<\/h3><p>Pelanggan diinformasikan tentang hasil dan langkah berikutnya.<\/p><\/div><\/div><div class=\"step\"><b>06<\/b><div><h3>Penutupan<\/h3><p>Tiket ditutup setelah verifikasi sesuai prosedur.<\/p><\/div><\/div><\/div>","visual":"crm","mode":"normal","section":"04 • Sistem Layanan Digital"},{"title":"Praktik: Tangani Tiket Layanan","tag":"SIMULASI CRM","body":"<p class=\"lead\">Pelanggan mengeluhkan keterlambatan dokumen. Lakukan penanganan secara berurutan sampai tiket ditutup.<\/p><div id=\"sim-ticket\"><\/div>","visual":"crm","mode":"ticketsim","section":"04 • Sistem Layanan Digital"},{"title":"Indikator Kualitas Layanan Digital","tag":"PENGUKURAN KINERJA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Indikator<\/th><th>Makna<\/th><th>Contoh pengamatan<\/th><\/tr><\/thead><tbody><tr><td>Waktu respons pertama<\/td><td>Lama hingga respons awal diberikan<\/td><td>Dari tiket dibuat ke balasan pertama<\/td><\/tr><tr><td>Waktu penyelesaian<\/td><td>Lama hingga masalah diselesaikan<\/td><td>Dari tiket dibuat ke status selesai<\/td><\/tr><tr><td>Tingkat penyelesaian<\/td><td>Bagian tiket yang selesai<\/td><td>Jumlah selesai ÷ total tiket<\/td><\/tr><tr><td>Kepuasan pelanggan<\/td><td>Penilaian pelanggan setelah layanan<\/td><td>Survei 1–5 atau komentar<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Akurasi<\/strong><p>Indikator perlu definisi konsisten. Cepat bukan berarti baik apabila solusi tidak menyelesaikan masalah.<\/p><\/aside>","visual":"crm","mode":"normal","section":"04 • Sistem Layanan Digital"},{"title":"Keamanan Informasi Perkantoran","tag":"PRINSIP CIA","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Confidentiality • Kerahasiaan<\/h3><p>Data hanya dapat diakses pihak berwenang.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Integrity • Integritas<\/h3><p>Data akurat dan terlindungi dari perubahan yang tidak sah.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Availability • Ketersediaan<\/h3><p>Informasi dapat diakses saat dibutuhkan oleh pihak berwenang.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Daftar gaji pegawai harus rahasia, angkanya tidak boleh diubah sembarangan, dan dapat dibuka saat proses penggajian yang sah.<\/p><\/aside>","visual":"security","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"Privasi dan Data Pelanggan","tag":"PERLINDUNGAN INFORMASI","body":"<ul class=\"rich-list\"><li>Kumpulkan data yang benar-benar diperlukan untuk tujuan layanan yang jelas.<\/li><li>Jangan menyebarkan nomor kontak, alamat, atau dokumen pribadi tanpa dasar dan wewenang.<\/li><li>Gunakan kanal resmi dan pengaturan akses terbatas.<\/li><li>Periksa penerima sebelum mengirim lampiran sensitif.<\/li><li>Ikuti kebijakan penyimpanan, retensi dan penghapusan data organisasi.<\/li><li>Segera laporkan dugaan kebocoran atau salah kirim sesuai SOP.<\/li><\/ul><aside class=\"note\"><strong>Contoh risiko<\/strong><p>Membagikan foto KTP pelanggan melalui grup umum kantor adalah tindakan yang berisiko dan tidak sesuai prinsip pembatasan akses.<\/p><\/aside>","visual":"security","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"Kata Sandi dan MFA","tag":"PERLINDUNGAN AKUN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Kata sandi unik<\/h3><p>Gunakan kata sandi yang panjang dan berbeda untuk tiap akun.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Pengelola kata sandi<\/h3><p>Gunakan pengelola kata sandi tepercaya apabila diperbolehkan organisasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>MFA<\/h3><p>Tambahkan faktor verifikasi kedua ketika tersedia.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Perangkat aman<\/h3><p>Kunci layar dan keluarkan akun dari perangkat bersama.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Laporkan<\/h3><p>Segera informasikan akses mencurigakan kepada petugas TI.<\/p><\/article><\/div><aside class=\"note\"><strong>Jangan dilakukan<\/strong><p>Jangan pernah mengirim kode OTP atau tautan pemulihan akun kepada pihak yang mengaku sebagai petugas, tanpa verifikasi kanal resmi.<\/p><\/aside>","visual":"security","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"Phishing dan Rekayasa Sosial","tag":"KENALI TANDA BAHAYA","body":"<p class=\"lead\">Phishing adalah upaya menipu pengguna agar menyerahkan informasi, membuka tautan berbahaya, atau melakukan tindakan tidak aman.<\/p><ul class=\"rich-list\"><li>Pengirim atau domain mirip tetapi berbeda dengan alamat resmi.<\/li><li>Pesan mendesak: “akun akan diblokir dalam 10 menit”.<\/li><li>Meminta kata sandi, OTP, atau data sensitif.<\/li><li>Tautan mengarah ke alamat tak dikenal.<\/li><li>Lampiran atau permintaan tidak sesuai kebiasaan kerja.<\/li><\/ul><aside class=\"note\"><strong>Respons aman<\/strong><p>Jangan klik. Verifikasi melalui kanal resmi yang sudah diketahui, bukan nomor atau tautan dari pesan itu. Laporkan jika mencurigakan.<\/p><\/aside>","visual":"security","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"Praktik: Detektif Keamanan Digital","tag":"SIMULASI ANTI-PHISHING","body":"<p class=\"lead\">Baca pesan yang muncul, tentukan tindakan paling aman, lalu pelajari pembahasannya.<\/p><div id=\"sim-phish\"><\/div>","visual":"security","mode":"phishsim","section":"05 • Keamanan & Etika Digital"},{"title":"Pencadangan dan Pemulihan Data","tag":"BACKUP & RECOVERY","body":"<p class=\"lead\">Backup adalah pembuatan salinan data untuk membantu pemulihan saat file rusak, terhapus, terinfeksi, atau perangkat bermasalah.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Jadwalkan<\/h3><p>Lakukan backup secara berkala berdasarkan tingkat pentingnya data.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Pisahkan<\/h3><p>Hindari menyimpan satu-satunya salinan di perangkat yang sama.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Batasi akses<\/h3><p>Lindungi backup dari perubahan yang tidak sah.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Uji pemulihan<\/h3><p>Pastikan file benar-benar dapat dipulihkan.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip 3-2-1<\/strong><p>Sebagai salah satu strategi: 3 salinan data, 2 jenis media berbeda, 1 salinan terpisah/off-site. Sesuaikan dengan kebijakan organisasi.<\/p><\/aside>","visual":"backup","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"SOP Saat Terjadi Insiden Digital","tag":"LANGKAH AWAL","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Jangan panik<\/h3><p>Berhenti melakukan tindakan yang dapat memperburuk keadaan.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Amankan sesuai SOP<\/h3><p>Jika diminta petugas TI, putuskan perangkat dari jaringan untuk membatasi dampak.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Laporkan segera<\/h3><p>Hubungi atasan atau tim TI melalui kanal resmi.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Catat fakta<\/h3><p>Waktu, sistem, pesan kesalahan, dan aktivitas terkait.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Ikuti pemulihan<\/h3><p>Jangan menghapus bukti atau mencoba memperbaiki sendiri di luar kewenangan.<\/p><\/div><\/div><div class=\"step\"><b>06<\/b><div><h3>Evaluasi<\/h3><p>Perbarui prosedur dan edukasi setelah insiden ditangani.<\/p><\/div><\/div><\/div>","visual":"security","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"Etika Pemanfaatan AI di Kantor","tag":"TEKNOLOGI BANTUAN, BUKAN PENGGANTI PERTIMBANGAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Manfaat<\/h3><p>Menyusun kerangka surat, ringkasan draf, dan ide pengelompokan data.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Risiko<\/h3><p>Jawaban keliru, informasi tidak lengkap, bias, atau data rahasia terekspos.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Penerapan aman<\/h3><p>Periksa hasil, lindungi informasi rahasia, dan ikuti ketentuan perusahaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Tanggung jawab<\/h3><p>Keputusan akhir dan keakuratan dokumen tetap menjadi tanggung jawab petugas.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Boleh menggunakan AI untuk membuat draf umum surat pemberitahuan, tetapi jangan memasukkan data pribadi pelanggan tanpa izin dan perlindungan sesuai kebijakan.<\/p><\/aside>","visual":"ai","mode":"normal","section":"05 • Keamanan & Etika Digital"},{"title":"SOP Pelayanan Bisnis Berbasis Digital","tag":"STANDAR KERJA","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Terima<\/h3><p>Catat permintaan melalui saluran resmi.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Verifikasi<\/h3><p>Periksa data yang diperlukan dan kewenangan pemohon.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Proses<\/h3><p>Gunakan aplikasi dan template yang sesuai.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Tinjau<\/h3><p>Pastikan isi, data, lampiran dan akses sudah benar.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Kirim<\/h3><p>Kirim respons melalui kanal yang ditetapkan.<\/p><\/div><\/div><div class=\"step\"><b>06<\/b><div><h3>Arsipkan & evaluasi<\/h3><p>Simpan bukti pekerjaan dengan aman dan tinjau kualitas layanan.<\/p><\/div><\/div><\/div>","visual":"crm","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"Produktivitas dan Otomatisasi","tag":"BEKERJA CERDAS","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Template<\/h3><p>Gunakan format surat yang konsisten.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Validasi data<\/h3><p>Batasi pilihan dan periksa isian untuk mengurangi kesalahan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Rumus & filter<\/h3><p>Percepat rekap laporan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Pengingat<\/h3><p>Kurangi risiko tenggat terlewat.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Otomatisasi terkontrol<\/h3><p>Proses rutin dapat diotomatisasi setelah risikonya dipahami.<\/p><\/article><\/div><aside class=\"note\"><strong>Batas otomatisasi<\/strong><p>Pemberian akses data, pengiriman dokumen sensitif, dan perubahan data penting dapat tetap memerlukan pemeriksaan manusia.<\/p><\/aside>","visual":"sheet","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"Studi Kasus: PT Nusantara Digital","tag":"ANALISIS MASALAH","body":"<p class=\"lead\">PT Nusantara Digital menerima 120 permintaan layanan dalam seminggu. Sebagian catatan hanya tersimpan di pesan pribadi staf, ada file bernama “final2”, dan beberapa pelanggan tidak memperoleh tindak lanjut.<\/p><ul class=\"rich-list\"><li><b>Masalah 1:<\/b> tidak ada pusat pencatatan tiket.<\/li><li><b>Masalah 2:<\/b> file tidak memakai standar penamaan dan folder.<\/li><li><b>Masalah 3:<\/b> pembagian tugas serta hak akses tidak jelas.<\/li><li><b>Masalah 4:<\/b> tidak tersedia indikator pemantauan status.<\/li><\/ul><aside class=\"note\"><strong>Pertanyaan diskusi<\/strong><p>Susun tiga tindakan prioritas untuk memperbaiki pelayanan tanpa mengabaikan keamanan informasi.<\/p><\/aside>","visual":"office","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"Pembahasan Studi Kasus","tag":"SOLUSI YANG DISARANKAN","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Sentralisasi layanan<\/h3><p>Gunakan formulir atau sistem tiket resmi.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Standarkan file<\/h3><p>Terapkan folder dan pola penamaan yang jelas.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Tentukan tanggung jawab<\/h3><p>Tetapkan penanggung jawab dan batas waktu setiap tiket.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Amankan data<\/h3><p>Batasi hak akses dan lakukan backup.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Tinjau indikator<\/h3><p>Pantau keterlambatan, tingkat penyelesaian, dan umpan balik pelanggan.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Indikator sederhana<\/strong><p>Dari 120 tiket, 96 selesai → tingkat penyelesaian = 96 ÷ 120 × 100% = 80%.<\/p><\/aside>","visual":"crm","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"LKPD 1: Administrasi Kantor Digital","tag":"PRAKTIK KELOMPOK • 2 JP","body":"<div class=\"task-box\"><h3>Tugas proyek<\/h3><div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Bentuk tim<\/h3><p>4–5 siswa; pilih admin, operator data, petugas layanan dan pemeriksa.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Susun dokumen<\/h3><p>Buat surat konfirmasi penerimaan permintaan pelanggan.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Rekap data<\/h3><p>Buat spreadsheet minimal 5 transaksi/permintaan.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Arsipkan<\/h3><p>Atur folder, nama file, dan izin yang sesuai.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Presentasi<\/h3><p>Jelaskan hasil serta langkah pemeriksaan data.<\/p><\/div><\/div><\/div><h3>Produk yang dikumpulkan<\/h3><ul class=\"rich-list\"><li>1 surat bisnis<\/li><li>1 spreadsheet berisi rumus<\/li><li>1 struktur folder dan SOP singkat<\/li><li>Laporan refleksi kerja tim<\/li><\/ul><\/div>","visual":"docs","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"LKPD 2: Audit Keamanan Digital","tag":"PRAKTIK KELOMPOK • 1–2 JP","body":"<div class=\"task-box\"><h3>Instruksi<\/h3><div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Amati<\/h3><p>Identifikasi risiko pada kasus email palsu dan file pelanggan.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Kelompokkan<\/h3><p>Tentukan ancaman pada kerahasiaan, integritas atau ketersediaan.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Perbaiki<\/h3><p>Tulis minimal 5 tindakan pencegahan.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Buat poster<\/h3><p>Buat poster singkat “5 Kebiasaan Aman di Kantor Digital”.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Presentasi<\/h3><p>Sampaikan alasan di balik setiap pilihan.<\/p><\/div><\/div><\/div><h3>Rubrik ringkas<\/h3><div class=\"table-wrap\"><table><thead><tr><th>Aspek<\/th><th>Bobot<\/th><\/tr><\/thead><tbody><tr><td>Ketepatan identifikasi masalah<\/td><td>30%<\/td><\/tr><tr><td>Solusi dan keamanan data<\/td><td>35%<\/td><\/tr><tr><td>Kerja sama serta praktik<\/td><td>20%<\/td><\/tr><tr><td>Penyajian hasil<\/td><td>15%<\/td><\/tr><\/tbody><\/table><\/div><\/div>","visual":"security","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"Evaluasi Formatif – Bagian 1","tag":"KUIS INTERAKTIF • SOAL 1–8","body":"<p class=\"lead\">Jawab seluruh soal. Pilihan tersimpan selama halaman tetap terbuka. Periksa skor pada slide hasil.<\/p><div id=\"quiz-part-a\"><\/div>","visual":"quiz","mode":"quiza","section":"06 • Praktik Terpadu"},{"title":"Evaluasi Formatif – Bagian 2","tag":"KUIS INTERAKTIF • SOAL 9–15","body":"<p class=\"lead\">Lanjutkan kuis untuk mengukur pemahaman tentang kolaborasi, keamanan, dan layanan digital.<\/p><div id=\"quiz-part-b\"><\/div>","visual":"quiz","mode":"quizb","section":"06 • Praktik Terpadu"},{"title":"Hasil Kuis dan Pembahasan","tag":"EVALUASI AKHIR","body":"<div id=\"quiz-result\"><\/div>","visual":"quiz","mode":"quizresult","section":"06 • Praktik Terpadu"},{"title":"Refleksi Pembelajaran","tag":"CEK DIRI","body":"<p class=\"lead\">Pilih tingkat penguasaanmu, lalu diskusikan bersama guru bagian mana yang masih perlu latihan.<\/p><div id=\"sim-reflect\"><\/div>","visual":"team","mode":"reflect","section":"06 • Praktik Terpadu"},{"title":"Rangkuman Bab 6","tag":"INTI PEMBELAJARAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Teknologi<\/h3><p>Mempercepat pengolahan informasi apabila proses dan SDM siap.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Aplikasi kantor<\/h3><p>Dokumen, spreadsheet dan presentasi membantu pekerjaan nyata.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Kolaborasi<\/h3><p>Email, kalender, cloud, dan hak akses mendukung kerja tim.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Layanan digital<\/h3><p>CRM dan tiket membuat tindak lanjut dapat dipantau.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Keamanan<\/h3><p>Kerahasiaan, integritas, ketersediaan, MFA, backup, dan kehati-hatian terhadap phishing sangat penting.<\/p><\/article><\/div><aside class=\"note\"><strong>Pesan utama<\/strong><p>Teknologi yang baik menghasilkan layanan yang lebih cepat, tepat, aman, dan bertanggung jawab.<\/p><\/aside>","visual":"cloud","mode":"normal","section":"06 • Praktik Terpadu"},{"title":"Selesai – Terus Berlatih!","tag":"PENUTUP & SUMBER BELAJAR","body":"<div class=\"finish\"><div class=\"finish-icon\">✓<\/div><h2>Siap Menjadi Staf Kantor Digital?<\/h2><p>Praktikkan pengetahuanmu melalui pengelolaan dokumen, komunikasi profesional, pencatatan tiket, dan keamanan data.<\/p><div class=\"source-list\"><b>Acuan materi:<\/b><a href=\"https://bpmpbabel.kemendikdasmen.go.id/PPID/wp-content/uploads/2025/07/KepKaBSKAP-046_2025-ttg-CP.pdf\" target=\"_blank\" rel=\"noopener\">Capaian Pembelajaran Fase F Manajemen Perkantoran (BSKAP, 2025)<\/a><a href=\"https://www.cisa.gov/secure-our-world\" target=\"_blank\" rel=\"noopener\">CISA – Secure Our World (panduan keamanan akun dan phishing)<\/a><\/div><p class=\"fineprint\">Contoh nama perusahaan, pelanggan, alamat email, dan data latihan dalam presentasi ini adalah fiktif.<\/p><\/div>","visual":"office","mode":"finish","section":"06 • Praktik Terpadu"}]</script>

function slideRender(){

$('#slideCount').textContent=`${current+1} / ${slides.length}`;$('#progressFill').style.width=((current+1)/slides.length*100)+'%';$('#railFill').style.width=((current+1)/slides.length*100)+'%';$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===slides.length-1;$('#stage').scrollTop=0;

}

function renderPhish(){let a=state.phishAnswers,idx=Object.keys(a).length,n=Object.values(a).filter(Boolean).length;if(idx===phishCases.length){$('#sim-phish').innerHTML=`<div class="workbench"><h3>Hasil Detektif Digital</h3><div class="score-big">${n*20}/100</div><p>Benar ${n} dari 5 situasi. Biasakan verifikasi sebelum mengklik, mengirim data, atau memberi akses.</p><button class="action-btn alt" data-act="phish-reset">Ulangi Simulasi</button></div>`;return}let q=phishCases[idx];$('#sim-phish').innerHTML=`<div class="workbench"><div class="progress-dots">${phishCases.map((_,i)=>`<span class="${i<idx?'done':''}"></span>`).join('')}<b style="font-size:12px;margin-left:8px">Situasi ${idx+1} / 5</b></div><h3 style="margin-top:16px">${safe(q.q)}</h3><div class="choice-list">${q.opts.map((v,i)=>`<button class="choice" data-act="phish-pick" data-val="${i}"><strong>${String.fromCharCode(65+i)}</strong>${safe(v)}</button>`).join('')}</div></div>`}
const questions=[
['Fungsi utama aplikasi pengolah kata adalah ...',['Mengatur suhu ruangan','Membuat dan menyunting dokumen','Menghubungkan kabel jaringan','Mencetak foto otomatis tanpa file'],1,'Pengolah kata digunakan untuk menyusun, mengedit dan memformat dokumen.'],
['Dalam spreadsheet, sel C3 berarti ...',['Kolom C baris 3','Kolom 3 baris C','Halaman C nomor 3','Dokumen 3 bagian C'],0,'Alamat sel menggabungkan huruf kolom dan nomor baris.'],
['Rumus untuk mengalikan sel B2 dan C2 adalah ...',['=B2+C2','=B2*C2','=B2/C2','=SUM(B2:C2)'],1,'Simbol * berarti perkalian pada spreadsheet.'],
['Sebelum mengirim email bisnis, petugas perlu ...',['Membagikan sandi akun','Memeriksa alamat penerima dan lampiran','Menghapus subjek email','Mengirim tanpa membaca ulang'],1,'Pemeriksaan penerima dan lampiran mencegah kesalahan komunikasi dan kebocoran.'],
['Contoh manfaat kalender digital adalah ...',['Menghapus semua dokumen','Mengatur rapat dan pengingat tugas','Mengganti perangkat keras','Mengamankan password tanpa MFA'],1,'Kalender digital membantu mengelola jadwal dan tenggat.'],
['Nama file yang lebih jelas adalah ...',['finalfinalfix.docx','dokumen(9).docx','2026-11-16_Laporan-Layanan_v01.docx','baru.docx'],2,'Tanggal, isi, dan versi memudahkan pencarian dan pengendalian.'],
['Hak akses “Viewer” umumnya mengizinkan pengguna ...',['Melihat dokumen','Menghapus semua anggota','Mengubah semua isi','Memindahkan kepemilikan sesuka hati'],0,'Viewer atau pembaca diberi akses melihat, bukan mengedit.'],
['Tujuan CRM dalam layanan bisnis adalah ...',['Menghapus riwayat pelanggan','Mengelola interaksi dan tindak lanjut pelanggan','Mengganti seluruh pegawai','Mematikan jaringan kantor'],1,'CRM membantu perusahaan memahami dan menindaklanjuti kebutuhan pelanggan.'],
['Langkah awal saat tiket layanan masuk adalah ...',['Mencatat dan memverifikasi permintaan','Menutup tiket','Menyalahkan pelanggan','Mengirim data ke grup umum'],0,'Tiket harus dicatat sehingga dapat ditelusuri.'],
['MFA bermanfaat karena ...',['Membuat kata sandi boleh dibagikan','Menambah lapisan verifikasi saat login','Mencegah semua jenis kerusakan perangkat','Menghapus kebutuhan pembaruan aplikasi'],1,'Multi-factor authentication menambah verifikasi selain kata sandi.'],
['Contoh phishing adalah ...',['Email yang meminta OTP melalui tautan tak dikenal','Undangan rapat resmi yang sudah diverifikasi','Notula yang tersimpan sesuai SOP','Pencadangan rutin'],0,'Permintaan OTP melalui tautan mencurigakan merupakan tanda bahaya.'],
['Tindakan tepat sebelum berbagi data pelanggan adalah ...',['Memberi akses publik','Memastikan dasar, izin, dan penerima berwenang','Menyebarkan ke akun pribadi','Menggandakan ke grup umum'],1,'Akses data harus dibatasi sesuai kebutuhan dan otorisasi.'],
['Tujuan backup adalah ...',['Menghilangkan semua kesalahan manusia','Membantu pemulihan apabila data hilang atau rusak','Mengganti SOP','Menambah risiko akses publik'],1,'Salinan cadangan mendukung pemulihan jika data bermasalah.'],
['Jika menerima pesan login yang mendesak dan mencurigakan, sebaiknya ...',['Klik segera','Verifikasi melalui kanal resmi tanpa membuka tautan pesan','Kirim password untuk memastikan','Teruskan ke pelanggan'],1,'Verifikasi independen mengurangi risiko rekayasa sosial.'],
['Saat menggunakan AI untuk menyusun dokumen kantor, pegawai harus ...',['Memercayai seluruh hasil tanpa pemeriksaan','Memasukkan semua data rahasia','Memeriksa hasil dan mengikuti kebijakan kerahasiaan','Mengabaikan kesalahan fakta'],2,'AI bersifat alat bantu dan hasilnya perlu verifikasi manusia.']
];
function renderQuiz(){let start=slides[current].mode==='quiza'?0:8,end=start?15:8;let area=start?'#quiz-part-b':'#quiz-part-a';$(area).innerHTML=questions.slice(start,end).map((q,offset)=>{let i=start+offset;return `<div class="q-card"><h3>${i+1}. ${safe(q[0])}</h3>${q[1].map((a,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" data-question="${i}" value="${j}" ${state.quizAnswers[i]===j?'checked':''}><span>${String.fromCharCode(65+j)}. ${safe(a)}</span></label>`).join('')}${state.quizChecked?`<div class="answer-note"><b>${state.quizAnswers[i]===q[2]?'Benar':'Jawaban benar: '+String.fromCharCode(65+q[2])}</b><div>${safe(q[3])}</div></div>`:''}</div>`}).join('')+`<div class="action-row"><button class="action-btn" data-act="go-result">Lihat Hasil Kuis →</button></div>`}
function renderResult(){let answered=Object.keys(state.quizAnswers).length,score=questions.reduce((s,q,i)=>s+(state.quizAnswers[i]===q[2]?1:0),0);$('#quiz-result').innerHTML=`<div class="workbench"><div class="score-big">${Math.round(score/15*100)} / 100</div><h3>Benar ${score} dari 15 soal • Terjawab ${answered} dari 15</h3><p>${answered<15?'Masih ada soal yang belum dijawab. Lengkapi untuk memperoleh hasil maksimal.':score>=12?'Penguasaan materi baik. Terus latih melalui praktik.':'Pelajari kembali materi dan pembahasan soal yang belum tepat.'}</p><div class="action-row"><button class="action-btn" data-act="quiz-check">${state.quizChecked?'Sembunyikan Pembahasan':'Tampilkan Pembahasan'}</button><button class="action-btn alt" data-act="quiz-reset">Ulangi Kuis</button><button class="action-btn alt" data-act="quiz-first">Kembali ke Soal 1</button></div></div>${state.quizChecked?`<div class="q-card"><h3>Rekap Jawaban</h3>${questions.map((q,i)=>`<p><b>${i+1}. ${state.quizAnswers[i]===q[2]?'✓ Benar':'✕ '+(state.quizAnswers[i]===undefined?'Belum dijawab':'Belum tepat')}</b> — ${safe(q[3])}</p>`).join('')}</div>`:''}`}
const reflectTopics=['Aplikasi pengolah kata','Spreadsheet dan perhitungan','Email dan kolaborasi','Manajemen file dan CRM','Keamanan informasi'];
function renderReflect(){let opts=['Bisa mandiri','Perlu latihan','Butuh bantuan'];$('#sim-reflect').innerHTML=`<div class="workbench"><div class="reflect-grid">${reflectTopics.map((topic,i)=>`<div class="reflect-row"><h3>${i+1}. ${topic}</h3><div class="reflect-options">${opts.map(v=>`<button class="${state.reflect[i]===v?'selected':''}" data-act="reflect-pick" data-id="${i}" data-val="${v}">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="feedback">${Object.keys(state.reflect).length} dari 5 kompetensi sudah direfleksikan. Catat materi yang masih membutuhkan latihan.</div></div>`}
function showTempModal(title,body){$('#menuOverlay').classList.add('open');$('#menuOverlay .modal-head b').textContent=title;$('#menuOverlay #sections').style.display='none';$('#slideIndex').innerHTML=body;$('#slideIndex').style.display='block'}
function resetTempModal(){if($('#sections').style.display==='none'){$('#sections').style.display='flex';$('#slideIndex').style.display='grid';$('#menuOverlay .modal-head b').textContent='Daftar Materi & Slide';paintMenu()}}
// global controls
window.addEventListener('click',e=>{let el=e.target.closest('[data-act], [data-slide], [data-section]');if(!el)return;
if(el.dataset.slide!==undefined){closeMenu();resetTempModal();go(+el.dataset.slide);return}
if(el.dataset.section!==undefined){menuSection=el.dataset.section;paintMenu();return}
const act=el.dataset.act;switch(act){
case 'prev':go(current-1);break;case 'next':go(current+1);break;case 'home':go(0);break;case 'menu':resetTempModal();openMenu();break;case 'close-menu':closeMenu();resetTempModal();break;case 'speak':speak();break;case 'full':full();break;
case 'doc-check':state.doc.checked=true;renderDoc();break;
case 'doc-example':state.doc={to:'Yth. Manajer PT Mitra',subject:'Konfirmasi Permintaan Informasi Layanan',body:'Terima kasih telah menghubungi PT Nusantara Digital. Permintaan informasi Bapak/Ibu telah kami terima dan sedang kami proses. Kami akan memberikan pembaruan melalui email resmi setelah data selesai diverifikasi.',sign:'Siti Rahma – Staf Administrasi',checked:false};renderDoc();break;
case 'doc-preview':openPreview();break;
case 'sheet-reset':state.sheet=[{name:'Buku agenda',qty:2,price:15000},{name:'Map arsip',qty:3,price:12000},{name:'Tinta printer',qty:1,price:48000},{name:'Kertas A4',qty:5,price:10000}];renderSheet();break;
case 'email-check':state.email.checked=true;renderEmail();break;
case 'email-example':state.email={to:'pelanggan@contoh.test',subject:'Informasi Status Permintaan Pelanggan',body:'Yth. Bapak/Ibu Pelanggan,\n\nTerima kasih atas pesan yang telah disampaikan. Kami mengonfirmasi bahwa permintaan informasi Anda telah diterima dan sedang diperiksa oleh tim terkait. Kami akan mengirimkan pembaruan setelah pemeriksaan selesai.\n\nHormat kami,\nTim Layanan Pelanggan',checked:false};renderEmail();break;
case 'file-pick':{let idx=Object.keys(state.fileAnswers).length,cor=folders[+el.dataset.val]===fileCases[idx][1];state.fileAnswers[idx]=cor;showSmallFeedback(el,cor,fileCases[idx][1],()=>renderFiles());break}
case 'file-reset':state.fileAnswers={};renderFiles();break;
case 'ticket-pick':{let idx=Object.keys(state.ticketAnswers).length,cor=+el.dataset.val===ticketCases[idx].a;state.ticketAnswers[idx]=cor;showSmallFeedback(el,cor,ticketCases[idx].why,()=>renderTicket());break}
case 'ticket-reset':state.ticketAnswers={};renderTicket();break;
case 'phish-pick':{let idx=Object.keys(state.phishAnswers).length,cor=+el.dataset.val===phishCases[idx].a;state.phishAnswers[idx]=cor;showSmallFeedback(el,cor,phishCases[idx].why,()=>renderPhish());break}
case 'phish-reset':state.phishAnswers={};renderPhish();break;
case 'quiz-check':state.quizChecked=!state.quizChecked;renderResult();break;
case 'quiz-reset':state.quizAnswers={};state.quizChecked=false;renderResult();break;
case 'quiz-first':go(slides.findIndex(s=>s.mode==='quiza'));break;
case 'go-result':go(slides.findIndex(s=>s.mode==='quizresult'));break;
case 'reflect-pick':state.reflect[+el.dataset.id]=el.dataset.val;renderReflect();break;
}});
function showSmallFeedback(el,cor,explanation,cb){let list=el.closest('.choice-list');if(!list)return;list.querySelectorAll('button').forEach(b=>b.disabled=true);el.classList.add(cor?'correct':'wrong');let box=document.createElement('div');box.className='feedback '+(cor?'':'warn');box.innerHTML='<b>'+(cor?'✓ Tepat':'Perlu diperbaiki')+'</b><p>'+safe(explanation)+'</p><button class="action-btn" id="simContinue">Lanjutkan →</button>';list.parentNode.appendChild(box);box.querySelector('button').addEventListener('click',cb);}
window.addEventListener('input',e=>{let id=e.target.id;let map={docTo:'to',docSubject:'subject',docBody:'body',docSign:'sign'};if(map[id]){state.doc[map[id]]=e.target.value;state.doc.checked=false;}if(id==='emailTo')state.email.to=e.target.value;if(id==='emailSubject')state.email.subject=e.target.value;if(id==='emailBody')state.email.body=e.target.value;let r=e.target.dataset.row,col=e.target.dataset.col;if(r!==undefined&&col){state.sheet[+r][col]=Math.max(0,Math.min(1e8,Number(e.target.value)||0));let row=e.target.closest('tr');row.querySelector('td:last-child').textContent=fmtRp(state.sheet[+r].qty*state.sheet[+r].price);$('.total-figure').textContent='Total: '+fmtRp(state.sheet.reduce((s,r)=>s+r.qty*r.price,0))}});
window.addEventListener('change',e=>{let idx=e.target.dataset.question;if(idx!==undefined){state.quizAnswers[+idx]=+e.target.value;state.quizChecked=false}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#menuOverlay').classList.contains('open')){closeMenu();resetTempModal();return}let tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)||e.target.isContentEditable||$('#menuOverlay').classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}});
$('#menuOverlay').addEventListener('click',e=>{if(e.target===$('#menuOverlay')){closeMenu();resetTempModal()}});
let startTouch=null;$('#stage').addEventListener('touchstart',e=>{if(e.touches.length===1){startTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:true});$('#stage').addEventListener('touchend',e=>{if(!startTouch||e.changedTouches.length!==1)return;let dx=e.changedTouches[0].clientX-startTouch.x,dy=e.changedTouches[0].clientY-startTouch.y;startTouch=null;if(Math.abs(dx)>115&&Math.abs(dy)<35&&!e.target.closest('input,textarea,table,.workbench,.choice-list'))go(current+(dx<0?1:-1))},{passive:true});
const hash=location.hash.match(/^#slide-(\d+)$/);if(hash)current=Math.max(0,Math.min(slides.length-1,+hash[1]-1));slideRender();
window.addEventListener('hashchange',()=>{let m=location.hash.match(/^#slide-(\d+)$/);if(m&&(+m[1]-1)!==current){current=Math.max(0,Math.min(slides.length-1,+m[1]-1));slideRender()}});
</script></body></html>
