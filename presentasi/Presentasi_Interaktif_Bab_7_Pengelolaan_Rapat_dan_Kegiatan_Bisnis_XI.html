</style></head><body><div class="app" id="app"><header class="topbar"><div class="mark">MLB</div><div class="brand"><b>BAB 7 • PENGELOLAAN RAPAT & KEGIATAN BISNIS</b><span>Manajemen Layanan Bisnis · Kelas XI SMK · Presentasi Interaktif</span></div><div class="top-actions"><button class="mini-btn" data-act="home" title="Kembali ke awal">⌂ <span class="hide-phone">Beranda</span></button><button class="mini-btn" data-act="menu" title="Daftar slide">☷ <span class="hide-phone">Daftar</span></button><button class="mini-btn" data-act="speak" id="speakBtn" title="Bacakan slide">◖))</button><button class="mini-btn" data-act="full" title="Layar penuh">⛶</button></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></header><main class="stage" id="stage"><div id="slideHost"></div></main><footer class="nav"><div class="nav-side"><button class="nav-btn" data-act="prev" id="prevBtn" aria-label="Slide sebelumnya">← <span class="nav-label">Sebelumnya</span></button></div><div class="nav-mid"><div class="slide-count" id="slideCount">1 / 61</div><div class="rail"><div id="railFill"></div></div><div class="kbd-help">Gunakan tombol ← / → atau menu slide</div></div><div class="nav-side right"><button class="nav-btn primary" data-act="next" id="nextBtn" aria-label="Slide selanjutnya"><span class="nav-label">Selanjutnya</span> →</button></div></footer></div><div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Daftar slide"><div class="modal"><div class="modal-head"><b>Daftar Materi dan Slide</b><button class="mini-btn" data-act="close-menu" aria-label="Tutup">✕</button></div><div class="modal-body"><div class="sections" id="sections"></div><div class="slide-index" id="slideIndex"></div></div></div></div><script id="slide-data" type="application/json">[{"title":"Pengelolaan Rapat dan Kegiatan Bisnis","tag":"BAB 7 • MANAJEMEN LAYANAN BISNIS","body":"<div class=\"cover-intro\"><span class=\"eyebrow\">KELAS XI SMK • FASE F<\/span><h2>Rapat Terencana, Keputusan Terarah<\/h2><p>Belajar merancang rapat dan acara bisnis, menjadi panitia profesional, menyusun agenda, notula, anggaran, hingga mengevaluasi tindak lanjut melalui simulasi kantor.<\/p><div class=\"hero-pills\"><span>61 slide<\/span><span>5 simulasi<\/span><span>15 soal kuis<\/span><span>2 LKPD<\/span><\/div><\/div>","visual":"team","mode":"cover","section":"Pendahuluan"},{"title":"Tujuan Pembelajaran","tag":"CAPAIAN KEGIATAN BELAJAR","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Memahami<\/h3><p>Menjelaskan konsep, fungsi dan jenis rapat atau kegiatan bisnis.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Merencanakan<\/h3><p>Menentukan tujuan, peserta, jadwal, agenda, tempat, dan anggaran.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Melaksanakan<\/h3><p>Menerapkan tugas panitia, etika komunikasi, dan tata tertib rapat.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Mendokumentasikan<\/h3><p>Membuat undangan, daftar hadir, notula, dan laporan kegiatan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Mengevaluasi<\/h3><p>Menganalisis keberhasilan rapat dan tindak lanjut keputusan.<\/p><\/article><\/div><aside class=\"note\"><strong>Target akhir<\/strong><p>Siswa mampu menyelenggarakan simulasi rapat perusahaan dari persiapan sampai laporan dengan bukti administrasi yang lengkap.<\/p><\/aside>","visual":"slides","mode":"normal","section":"Pendahuluan"},{"title":"Peta Materi Bab 7","tag":"ALUR BELAJAR","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Dasar rapat<\/h3><p>Pengertian, tujuan, jenis dan format penyelenggaraan.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Perencanaan<\/h3><p>Agenda, undangan, peserta, sarana, jadwal, anggaran dan risiko.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Pelaksanaan<\/h3><p>Pembukaan, tata tertib, moderasi, pengambilan keputusan.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Dokumentasi<\/h3><p>Daftar hadir, notula, keputusan, arsip dan tindak lanjut.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Kegiatan bisnis<\/h3><p>Pelaksanaan acara lain, evaluasi, proyek dan kuis.<\/p><\/div><\/div><\/div>","visual":"calendar","mode":"normal","section":"Pendahuluan"},{"title":"Apa Itu Rapat Bisnis?","tag":"PENGERTIAN","body":"<p class=\"lead\">Rapat bisnis adalah pertemuan dua orang atau lebih untuk membahas informasi, menyelesaikan masalah, menyelaraskan pekerjaan, atau menetapkan keputusan yang berkaitan dengan kegiatan organisasi.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Topik<\/h3><p>Masalah atau program yang dibahas.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Peserta<\/h3><p>Pihak yang berwenang, terkait, atau memiliki informasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Proses<\/h3><p>Penyampaian informasi dan pembahasan terarah.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Hasil<\/h3><p>Kesimpulan, keputusan, penugasan dan tenggat.<\/p><\/article><\/div><aside class=\"note\"><strong>Ingat<\/strong><p>Rapat yang baik tidak hanya menghasilkan pembicaraan, tetapi juga keputusan dan tindak lanjut yang jelas.<\/p><\/aside>","visual":"team","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Tujuan dan Manfaat Rapat","tag":"MENGAPA RAPAT DIADAKAN?","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Berbagi informasi<\/h3><p>Menyampaikan perkembangan pekerjaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Koordinasi<\/h3><p>Menyelaraskan kegiatan antartim.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pemecahan masalah<\/h3><p>Mencari solusi berdasarkan fakta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Pengambilan keputusan<\/h3><p>Menetapkan pilihan dan penanggung jawab.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Evaluasi<\/h3><p>Menilai hasil dan mengidentifikasi perbaikan.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Perusahaan mengadakan rapat karena pengiriman produk sering terlambat. Tim mencari penyebab dan menyepakati tindakan perbaikan.<\/p><\/aside>","visual":"team","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Jenis Rapat Berdasarkan Tujuan","tag":"KLASIFIKASI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Jenis<\/th><th>Fokus<\/th><th>Contoh<\/th><\/tr><\/thead><tbody><tr><td>Rapat informasi<\/td><td>Menyampaikan perkembangan<\/td><td>Pengumuman SOP baru<\/td><\/tr><tr><td>Rapat koordinasi<\/td><td>Menyelaraskan tugas<\/td><td>Pembagian pekerjaan tim<\/td><\/tr><tr><td>Rapat pemecahan masalah<\/td><td>Menganalisis kendala<\/td><td>Keluhan pelanggan meningkat<\/td><\/tr><tr><td>Rapat pengambilan keputusan<\/td><td>Memilih tindakan<\/td><td>Menentukan vendor<\/td><\/tr><tr><td>Rapat evaluasi<\/td><td>Menilai hasil<\/td><td>Evaluasi program bulanan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Catatan<\/strong><p>Satu rapat dapat memiliki lebih dari satu tujuan. Agenda perlu menunjukkan hasil yang diharapkan dari setiap pembahasan.<\/p><\/aside>","visual":"slides","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Rapat Rutin dan Insidental","tag":"BERDASARKAN WAKTU","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Rapat rutin<\/h3><p>Dilaksanakan berkala, misalnya mingguan atau bulanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Rapat insidental<\/h3><p>Diadakan ketika muncul kebutuhan tertentu yang tidak terjadwal.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Rapat darurat<\/h3><p>Diperlukan segera untuk situasi mendesak, dengan undangan dan keputusan yang tetap terdokumentasi.<\/p><\/article><\/div><aside class=\"note\"><strong>Diskusi<\/strong><p>Kapan rapat darurat diperlukan? Apakah semua persoalan harus diselesaikan melalui rapat?<\/p><\/aside>","visual":"calendar","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Tatap Muka, Daring dan Hibrida","tag":"FORMAT PELAKSANAAN","body":"<div class=\"table-wrap\"><table><thead><tr><th>Format<\/th><th>Keunggulan<\/th><th>Perhatian<\/th><\/tr><\/thead><tbody><tr><td>Tatap muka<\/td><td>Diskusi langsung, koordinasi lebih mudah<\/td><td>Ruangan, perjalanan, konsumsi<\/td><\/tr><tr><td>Daring (online)<\/td><td>Menghubungkan peserta berbeda lokasi<\/td><td>Internet, audio, keamanan akses<\/td><\/tr><tr><td>Hibrida<\/td><td>Memadukan peserta di ruangan dan daring<\/td><td>Perangkat, giliran bicara, pemerataan partisipasi<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Pilihan format<\/strong><p>Sesuaikan dengan tujuan rapat, lokasi peserta, tingkat kerahasiaan, kebutuhan dokumentasi, dan fasilitas yang tersedia.<\/p><\/aside>","visual":"devices","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Ciri Rapat yang Efektif","tag":"INDIKATOR KUALITAS","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Tujuan jelas<\/h3><p>Peserta mengetahui alasan rapat dan hasil yang diharapkan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Agenda terukur<\/h3><p>Topik dan alokasi waktu disusun sebelumnya.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Peserta relevan<\/h3><p>Hadir orang yang diperlukan untuk membahas atau memutuskan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Diskusi terarah<\/h3><p>Pimpinan rapat menjaga fokus dan menghargai pendapat.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Tindak lanjut<\/h3><p>Keputusan, penanggung jawab dan tenggat dicatat.<\/p><\/article><\/div>","visual":"team","mode":"normal","section":"01 • Konsep Rapat"},{"title":"Tahapan Persiapan Rapat","tag":"ALUR PERSIAPAN","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Identifikasi kebutuhan<\/h3><p>Tentukan masalah, tujuan, dan keluaran rapat.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Susun rencana<\/h3><p>Pilih peserta, pimpinan rapat, jadwal, media, dan agenda.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Siapkan administrasi<\/h3><p>Undangan, daftar hadir, bahan rapat dan format notula.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Pastikan sarana<\/h3><p>Uji perangkat, ruang, internet, dokumen dan cadangan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Konfirmasi akhir<\/h3><p>Periksa kehadiran dan kirim pengingat sesuai kebutuhan.<\/p><\/div><\/div><\/div>","visual":"calendar","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Menentukan Kebutuhan Rapat","tag":"SEBELUM MENGUNDANG","body":"<p class=\"lead\">Tidak semua persoalan perlu dibahas melalui rapat. Pilih rapat apabila diperlukan diskusi bersama, penyelarasan antarpihak, atau keputusan kolektif.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Perlu rapat<\/h3><p>Masalah lintas divisi memerlukan pembahasan dan keputusan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Cukup memo / email<\/h3><p>Informasi sederhana cukup disampaikan tertulis tanpa diskusi panjang.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Cukup diskusi singkat<\/h3><p>Permintaan klarifikasi yang bisa diselesaikan oleh dua pihak.<\/p><\/article><\/div><aside class=\"note\"><strong>Pertanyaan pemandu<\/strong><p>Apa yang harus berubah setelah rapat selesai? Jika tidak ada hasil yang jelas, telaah kembali kebutuhan rapat.<\/p><\/aside>","visual":"mail","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Merumuskan Tujuan dengan SMART","tag":"TUJUAN YANG SPESIFIK","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Specific<\/h3><p>Menjelaskan hasil tertentu, bukan topik yang terlalu umum.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Measurable<\/h3><p>Dapat diamati atau diukur.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Achievable<\/h3><p>Mungkin dicapai dengan sumber daya yang tersedia.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Relevant<\/h3><p>Berhubungan dengan kebutuhan perusahaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Time-bound<\/h3><p>Memiliki batas waktu yang jelas.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh SMART<\/strong><p>Dalam rapat hari ini, tim menetapkan tiga tindakan untuk menurunkan keterlambatan pengiriman selama empat minggu berikutnya.<\/p><\/aside>","visual":"slides","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Menentukan Peserta dan Peran","tag":"SIAPA HARUS HADIR?","body":"<div class=\"table-wrap\"><table><thead><tr><th>Peran<\/th><th>Tugas pokok<\/th><\/tr><\/thead><tbody><tr><td>Penyelenggara / sekretariat<\/td><td>Mengurus persiapan dan administrasi<\/td><\/tr><tr><td>Pimpinan rapat<\/td><td>Memimpin pembahasan dan mengarahkan keputusan<\/td><\/tr><tr><td>Moderator (bila diperlukan)<\/td><td>Mengelola alur diskusi dan giliran bicara<\/td><\/tr><tr><td>Notulis<\/td><td>Mencatat pokok pembahasan, keputusan dan tindak lanjut<\/td><\/tr><tr><td>Peserta<\/td><td>Memberi informasi, usulan dan menjalankan keputusan terkait<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Undang pihak yang relevan. Terlalu banyak peserta dapat membuat rapat sulit fokus.<\/p><\/aside>","visual":"team","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Memilih Tempat dan Media","tag":"FASILITAS RAPAT","body":"<ul class=\"rich-list\"><li><b>Ruang:<\/b> kapasitas cukup, sirkulasi nyaman, akses mudah, dan minim gangguan.<\/li><li><b>Perangkat:<\/b> layar/proyektor, laptop, mikrofon, pengeras suara bila diperlukan.<\/li><li><b>Jaringan:<\/b> internet andal untuk rapat daring/hibrida.<\/li><li><b>Dokumen:<\/b> bahan presentasi, daftar hadir, notula, dan lembar keputusan.<\/li><li><b>Aksesibilitas:<\/b> pertimbangkan kebutuhan peserta, termasuk keterbacaan dan audio.<\/li><\/ul><aside class=\"note\"><strong>Praktik<\/strong><p>Lakukan uji suara dan tampilan minimal sebelum peserta bergabung; siapkan solusi jika koneksi terganggu.<\/p><\/aside>","visual":"devices","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Menentukan Waktu dan Durasi","tag":"MANAJEMEN WAKTU","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Menyesuaikan jadwal<\/h3><p>Pilih waktu yang memungkinkan peserta utama hadir.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Menentukan durasi<\/h3><p>Perkirakan lama tiap agenda secara realistis.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Menetapkan prioritas<\/h3><p>Topik keputusan penting dibahas lebih awal.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Menyiapkan jeda<\/h3><p>Rapat panjang dapat membutuhkan istirahat.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Rapat 60 menit: pembukaan 5 menit, laporan 15 menit, diskusi 25 menit, keputusan 10 menit, penutup 5 menit.<\/p><\/aside>","visual":"calendar","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Checklist Persiapan Rapat","tag":"KONTROL SEBELUM HARI H","body":"<div class=\"table-wrap\"><table><thead><tr><th>Periksa<\/th><th>Contoh bukti<\/th><\/tr><\/thead><tbody><tr><td>Tujuan dan agenda<\/td><td>Agenda disetujui pimpinan<\/td><\/tr><tr><td>Peserta dan undangan<\/td><td>Konfirmasi penerimaan undangan<\/td><\/tr><tr><td>Ruang / tautan rapat<\/td><td>Reservasi dan tautan berfungsi<\/td><\/tr><tr><td>Peralatan<\/td><td>Proyektor, mikrofon dan internet diuji<\/td><\/tr><tr><td>Dokumen<\/td><td>Bahan, daftar hadir dan template notula siap<\/td><\/tr><tr><td>Petugas<\/td><td>Pembawa acara, pimpinan dan notulis telah mengetahui perannya<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Kebiasaan kerja<\/strong><p>Daftar periksa membantu mencegah lupa ketika persiapan dilakukan oleh beberapa orang.<\/p><\/aside>","visual":"files","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Surat dan Email Undangan Rapat","tag":"ADMINISTRASI PRA-RAPAT","body":"<p class=\"lead\">Undangan resmi berfungsi memberi informasi yang sama kepada semua peserta sehingga mereka dapat mempersiapkan diri.<\/p><ul class=\"rich-list\"><li>Pihak pengundang dan penerima.<\/li><li>Hari, tanggal, waktu, lokasi atau tautan pertemuan.<\/li><li>Tujuan, agenda, dan bahan yang perlu dibaca.<\/li><li>Konfirmasi kehadiran serta kontak panitia.<\/li><li>Bahasa sopan, singkat, benar, dan mudah dipahami.<\/li><\/ul><aside class=\"note\"><strong>Peringatan<\/strong><p>Jangan membagikan tautan rapat yang memuat informasi sensitif secara terbuka tanpa pengendalian akses.<\/p><\/aside>","visual":"mail","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Contoh Undangan Rapat","tag":"FORMAT DOKUMEN","body":"<div class=\"sample-document\"><div class=\"sample-center\"><b>PT SENTOSA JAYA<\/b><small>Divisi Operasional • Contoh surat fiktif<\/small><\/div><hr><p><b>Perihal:<\/b> Undangan Rapat Evaluasi Pelayanan<\/p><p>Yth. Koordinator Administrasi dan Layanan Pelanggan<\/p><p>Dengan hormat,<\/p><p>Kami mengundang Bapak/Ibu mengikuti rapat evaluasi pelayanan pelanggan pada:<\/p><p><b>Hari/tanggal:<\/b> Rabu, 18 November 2026<br><b>Pukul:<\/b> 09.00–10.00 WIB<br><b>Tempat:<\/b> Ruang Rapat 2<\/p><p><b>Agenda:<\/b> Evaluasi keluhan dan penyusunan tindakan perbaikan.<\/p><p>Hormat kami,<br><b>Manajer Operasional<\/b><\/p><\/div><aside class=\"note\"><strong>Tugas siswa<\/strong><p>Periksa apakah tujuan, waktu, tempat, pihak penerima dan agenda sudah tercantum.<\/p><\/aside>","visual":"docs","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Agenda Rapat","tag":"PANDUAN JALANNYA RAPAT","body":"<p class=\"lead\">Agenda rapat adalah daftar pokok pembahasan, urutan kegiatan, dan alokasi waktu. Agenda menjaga pembahasan tetap sesuai tujuan.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Waktu<\/th><th>Agenda<\/th><th>Pemimpin<\/th><\/tr><\/thead><tbody><tr><td>09.00–09.05<\/td><td>Pembukaan<\/td><td>Pimpinan rapat<\/td><\/tr><tr><td>09.05–09.20<\/td><td>Laporan keluhan pelanggan<\/td><td>Kepala layanan<\/td><\/tr><tr><td>09.20–09.45<\/td><td>Diskusi solusi<\/td><td>Seluruh peserta<\/td><\/tr><tr><td>09.45–09.55<\/td><td>Kesepakatan dan tugas<\/td><td>Pimpinan rapat<\/td><\/tr><tr><td>09.55–10.00<\/td><td>Penutup<\/td><td>Pimpinan rapat<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Tips<\/strong><p>Letakkan topik yang paling membutuhkan keputusan pada waktu peserta masih dapat berdiskusi dengan baik.<\/p><\/aside>","visual":"calendar","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Simulasi: Susun Agenda Rapat","tag":"PRAKTIK INTERAKTIF","body":"<p class=\"lead\">Kamu berperan sebagai sekretaris perusahaan. Isi informasi rapat dan tiga agenda utama, lalu periksa dan tampilkan <b>agenda virtual<\/b>.<\/p><div id=\"sim-agenda\"><\/div>","visual":"calendar","mode":"agenda","section":"02 • Perencanaan Rapat"},{"title":"Tata Ruang dan Penataan Kursi","tag":"MENDUKUNG DISKUSI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>U-shape<\/h3><p>Mempermudah kontak mata dan diskusi kelompok kecil.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Boardroom<\/h3><p>Cocok untuk rapat keputusan dengan meja besar.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Theater<\/h3><p>Cocok untuk penyampaian informasi dengan peserta banyak.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Classroom<\/h3><p>Cocok untuk sesi dengan catatan atau perangkat peserta.<\/p><\/article><\/div><aside class=\"note\"><strong>Praktik<\/strong><p>Sesuaikan susunan dengan tujuan, jumlah orang, akses gerak, kamera, serta keselamatan ruangan.<\/p><\/aside>","visual":"team","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Perlengkapan dan Konsumsi","tag":"LOGISTIK RAPAT","body":"<div class=\"table-wrap\"><table><thead><tr><th>Kebutuhan<\/th><th>Contoh<\/th><\/tr><\/thead><tbody><tr><td>Administrasi<\/td><td>Daftar hadir, agenda, notula dan bahan paparan<\/td><\/tr><tr><td>Teknologi<\/td><td>Laptop, proyektor, kabel, internet dan mikrofon<\/td><\/tr><tr><td>Ruangan<\/td><td>Kursi, meja, pencahayaan, ventilasi<\/td><\/tr><tr><td>Konsumsi<\/td><td>Air minum dan makanan sesuai durasi atau anggaran<\/td><\/tr><tr><td>Cadangan<\/td><td>Salinan bahan, adaptor, opsi koneksi alternatif<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Efisiensi<\/strong><p>Hindari pengadaan barang yang tidak diperlukan. Prioritaskan fungsi dan anggaran yang disetujui.<\/p><\/aside>","visual":"devices","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Perencanaan Anggaran Rapat","tag":"DASAR PERHITUNGAN","body":"<p class=\"lead\">Anggaran merupakan perkiraan biaya yang dibutuhkan untuk melaksanakan rapat. Perencanaan membantu pengeluaran tetap sesuai kebutuhan dan persetujuan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Biaya tetap<\/h3><p>Misalnya sewa ruang atau perangkat dengan tarif tetap.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Biaya variabel<\/h3><p>Misalnya konsumsi berdasarkan jumlah peserta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Cadangan<\/h3><p>Dana tambahan yang proporsional untuk risiko yang dapat diperkirakan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Realisasi<\/h3><p>Pengeluaran sesungguhnya dibandingkan dengan anggaran.<\/p><\/article><\/div><aside class=\"note\"><strong>Rumus<\/strong><p>Total biaya item = jumlah × harga satuan; total anggaran = penjumlahan seluruh item, ditambah cadangan bila diperlukan.<\/p><\/aside>","visual":"sheet","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Simulasi: Hitung Anggaran","tag":"PRAKTIK INTERAKTIF","body":"<p class=\"lead\">Ubah jumlah peserta, biaya per orang, serta fasilitas tambahan. Total langsung dihitung. Cobalah mempertahankan biaya di bawah plafon Rp1.200.000.<\/p><div id=\"sim-budget\"><\/div>","visual":"sheet","mode":"budget","section":"02 • Perencanaan Rapat"},{"title":"Risiko dan Rencana Cadangan","tag":"ANTISIPASI KENDALA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Risiko<\/th><th>Pencegahan / respons<\/th><\/tr><\/thead><tbody><tr><td>Pimpinan terlambat<\/td><td>Konfirmasi jadwal; siapkan penyesuaian urutan agenda<\/td><\/tr><tr><td>Proyektor tidak menyala<\/td><td>Uji perangkat; siapkan dokumen alternatif<\/td><\/tr><tr><td>Internet terputus<\/td><td>Siapkan jaringan alternatif dan nomor kontak<\/td><\/tr><tr><td>Dokumen rahasia tersebar<\/td><td>Batasi akses dan bagikan via kanal resmi<\/td><\/tr><tr><td>Pembahasan melebar<\/td><td>Moderator mengembalikan diskusi ke agenda<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Identifikasi risiko yang paling mungkin terjadi dan yang dampaknya paling besar.<\/p><\/aside>","visual":"security","mode":"normal","section":"02 • Perencanaan Rapat"},{"title":"Alur Pelaksanaan Rapat","tag":"DARI PEMBUKAAN SAMPAI PENUTUP","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Registrasi dan pengecekan<\/h3><p>Catat kehadiran dan pastikan perangkat siap.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Pembukaan<\/h3><p>Jelaskan tujuan, agenda dan tata tertib.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Pembahasan<\/h3><p>Sampaikan data dan diskusikan topik satu per satu.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Keputusan<\/h3><p>Ringkas kesepakatan, PIC dan tenggat.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Penutup<\/h3><p>Konfirmasi tindak lanjut dan waktu penyampaian notula.<\/p><\/div><\/div><\/div>","visual":"team","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Membuka Rapat dengan Profesional","tag":"CONTOH UCAPAN","body":"<blockquote class=\"speech-example\">“Selamat pagi, Bapak/Ibu. Terima kasih atas kehadirannya. Rapat hari ini bertujuan menilai kendala pelayanan pelanggan dan menetapkan tindak lanjut. Kita mempunyai waktu 60 menit, dengan tiga agenda utama. Saya mohon seluruh peserta menyampaikan pendapat secara bergiliran.”<\/blockquote><aside class=\"note\"><strong>Analisis<\/strong><p>Apa saja unsur pembukaan yang sudah muncul dalam contoh tersebut?<\/p><\/aside>","visual":"team","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Tugas Pimpinan Rapat","tag":"KEPEMIMPINAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Memastikan arah<\/h3><p>Menegaskan tujuan, hasil dan batas pembahasan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Mendengarkan pendapat<\/h3><p>Memberi kesempatan seimbang kepada peserta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Menjaga waktu<\/h3><p>Menentukan kapan topik perlu dirangkum.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Mengelola perbedaan<\/h3><p>Mendorong penggunaan data dan alasan yang relevan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Menegaskan keputusan<\/h3><p>Menyebutkan kesimpulan, PIC, dan tenggat.<\/p><\/article><\/div>","visual":"team","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Moderator dan Notulis","tag":"DUA PERAN YANG BERBEDA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Moderator<\/th><th>Notulis<\/th><\/tr><\/thead><tbody><tr><td>Mengatur jalannya diskusi<\/td><td>Mencatat alur, pokok pembahasan, dan hasil<\/td><\/tr><tr><td>Memberi giliran bicara<\/td><td>Memastikan nama penanggung jawab tercatat<\/td><\/tr><tr><td>Mengarahkan ke agenda<\/td><td>Mencatat keputusan dan batas waktu<\/td><\/tr><tr><td>Merangkum jawaban peserta<\/td><td>Menyusun notula yang dapat ditinjau ulang<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Catatan<\/strong><p>Dalam rapat kecil, sebagian peran dapat digabung, tetapi tugas dan tanggung jawabnya tetap harus jelas.<\/p><\/aside>","visual":"docs","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Etika Berbicara dan Mendengarkan","tag":"TATA TERTIB","body":"<ul class=\"rich-list\"><li>Datang tepat waktu dan menyiapkan bahan sebelum rapat.<\/li><li>Fokus pada topik; hindari aktivitas lain yang tidak relevan.<\/li><li>Berbicara singkat, sopan, dan berdasar data.<\/li><li>Tidak memotong pembicaraan; beri kesempatan berbeda pendapat.<\/li><li>Mengkritik ide atau proses, bukan menyerang pribadi.<\/li><li>Menghormati informasi rahasia dan kebijakan dokumentasi.<\/li><\/ul><aside class=\"note\"><strong>Contoh kalimat profesional<\/strong><p>“Saya memahami usulan tersebut. Berdasarkan data pengiriman minggu lalu, ada satu risiko yang perlu kita pertimbangkan.”<\/p><\/aside>","visual":"team","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Protokol Rapat Daring dan Hibrida","tag":"KESETARAAN PARTISIPASI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Persiapan<\/h3><p>Uji mikrofon, kamera, dokumen bersama, dan koneksi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Identifikasi<\/h3><p>Gunakan nama peserta yang jelas dan lakukan konfirmasi kehadiran.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Giliran bicara<\/h3><p>Gunakan fitur angkat tangan atau giliran yang diatur moderator.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Berbagi layar<\/h3><p>Tampilkan dokumen yang relevan saja; tutup data pribadi yang tidak diperlukan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Dokumentasi<\/h3><p>Perekaman harus mengikuti kebijakan dan pemberitahuan yang berlaku.<\/p><\/article><\/div>","visual":"devices","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Menghadapi Perbedaan Pendapat","tag":"MENANGANI KONFLIK","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Dengarkan<\/h3><p>Izinkan setiap pihak menyampaikan alasan tanpa interupsi.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Perjelas masalah<\/h3><p>Pisahkan fakta, asumsi, dan opini.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Bandingkan alternatif<\/h3><p>Tinjau manfaat, risiko, biaya, dan dampak.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Tentukan metode keputusan<\/h3><p>Kesepakatan, kewenangan pimpinan, atau voting sesuai aturan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Catat hasil<\/h3><p>Pastikan keputusan, keberatan yang relevan, dan tindak lanjut terdokumentasi.<\/p><\/div><\/div><\/div>","visual":"team","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Cara Mengambil Keputusan","tag":"TEKNIK DALAM RAPAT","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Konsensus<\/h3><p>Peserta mencapai kesepakatan yang dapat diterima bersama.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Musyawarah<\/h3><p>Pendapat dikaji untuk mencapai keputusan terbaik.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pemungutan suara<\/h3><p>Pilihan dihitung apabila aturan rapat mengizinkan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Keputusan pimpinan<\/h3><p>Dilakukan ketika kewenangan memang berada pada pimpinan.<\/p><\/article><\/div><aside class=\"note\"><strong>Kualitas keputusan<\/strong><p>Gunakan data yang relevan. Catat alternatif, alasan keputusan, serta siapa yang bertanggung jawab.<\/p><\/aside>","visual":"quiz","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Simulasi: Menjadi Moderator","tag":"PILIH TINDAKAN TERBAIK","body":"<p class=\"lead\">Hadapi lima situasi nyata selama rapat. Pilih respons yang paling profesional. Setiap jawaban tepat bernilai 20 poin.<\/p><div id=\"sim-situation\"><\/div>","visual":"team","mode":"situation","section":"03 • Pelaksanaan Rapat"},{"title":"Mengendalikan Durasi Rapat","tag":"MANAJEMEN AGENDA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Situasi<\/th><th>Tindakan moderator<\/th><\/tr><\/thead><tbody><tr><td>Topik melebar<\/td><td>Kembalikan peserta ke tujuan agenda<\/td><\/tr><tr><td>Satu orang mendominasi<\/td><td>Berikan kesempatan kepada peserta lain<\/td><\/tr><tr><td>Waktu hampir habis<\/td><td>Ringkas opsi dan tetapkan langkah berikutnya<\/td><\/tr><tr><td>Data belum tersedia<\/td><td>Tetapkan PIC untuk melengkapi informasi<\/td><\/tr><tr><td>Keputusan belum tercapai<\/td><td>Catat kendala dan jadwalkan tindak lanjut<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Kalimat pemandu<\/strong><p>“Agar sesuai alokasi waktu, saya rangkum dua opsi yang sudah dibahas. Apakah ada data penting sebelum kita memutuskan?”<\/p><\/aside>","visual":"calendar","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Daftar Hadir dan Konfirmasi Peserta","tag":"BUKTI KEHADIRAN","body":"<p class=\"lead\">Daftar hadir adalah bukti administrasi yang membantu mengetahui peserta rapat, unit kerja, waktu kehadiran, dan tindak lanjut distribusi dokumen.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Kolom<\/th><th>Contoh<\/th><\/tr><\/thead><tbody><tr><td>Nama peserta<\/td><td>Rina Safitri<\/td><\/tr><tr><td>Bagian / jabatan<\/td><td>Staf Administrasi<\/td><\/tr><tr><td>Status<\/td><td>Hadir / izin / tidak hadir<\/td><\/tr><tr><td>Waktu / tanda tangan<\/td><td>Diisi sesuai mekanisme yang ditetapkan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Perhatian<\/strong><p>Catat data yang benar-benar diperlukan. Penyimpanan daftar hadir perlu memperhatikan kerahasiaan data.<\/p><\/aside>","visual":"docs","mode":"normal","section":"03 • Pelaksanaan Rapat"},{"title":"Simulasi: Rekap Daftar Hadir","tag":"PRAKTIK INTERAKTIF","body":"<p class=\"lead\">Tandai status enam pegawai. Sistem akan menghitung jumlah hadir, izin, dan tidak hadir secara otomatis.<\/p><div id=\"sim-attend\"><\/div>","visual":"docs","mode":"attend","section":"03 • Pelaksanaan Rapat"},{"title":"Apa Itu Notula Rapat?","tag":"DOKUMENTASI HASIL","body":"<p class=\"lead\">Notula adalah catatan ringkas dan sistematis tentang informasi penting, pokok pembahasan, keputusan, serta tindak lanjut yang dihasilkan selama rapat.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Identitas<\/h3><p>Tanggal, waktu, tempat, judul dan peserta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Pembahasan<\/h3><p>Poin utama yang dibahas dan data penting.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Keputusan<\/h3><p>Kesimpulan atau hasil yang disepakati.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Tindak lanjut<\/h3><p>Tugas, penanggung jawab dan batas waktu.<\/p><\/article><\/div><aside class=\"note\"><strong>Perbedaan<\/strong><p>Notula bukan transkrip setiap ucapan. Tulis pokok yang relevan dan faktual, bukan opini pribadi notulis.<\/p><\/aside>","visual":"docs","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Format Umum Notula Rapat","tag":"STRUKTUR DOKUMEN","body":"<div class=\"table-wrap\"><table><thead><tr><th>Bagian<\/th><th>Isi<\/th><\/tr><\/thead><tbody><tr><td>Judul rapat<\/td><td>Rapat Evaluasi Pelayanan<\/td><\/tr><tr><td>Hari, tanggal, waktu, tempat<\/td><td>Rabu, 18/11/2026, 09.00–10.00, Ruang Rapat 2<\/td><\/tr><tr><td>Pimpinan dan notulis<\/td><td>Nama serta jabatan<\/td><\/tr><tr><td>Peserta<\/td><td>Daftar hadir atau lampiran<\/td><\/tr><tr><td>Agenda<\/td><td>Topik yang dibahas<\/td><\/tr><tr><td>Pembahasan dan keputusan<\/td><td>Inti masalah, alternatif, kesimpulan<\/td><\/tr><tr><td>Tindak lanjut<\/td><td>Apa, siapa, kapan<\/td><\/tr><tr><td>Pengesahan / distribusi<\/td><td>Sesuai prosedur perusahaan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Sumber data<\/strong><p>Cocokkan notula dengan keputusan yang disampaikan pimpinan sebelum diedarkan.<\/p><\/aside>","visual":"docs","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Contoh Notula Hasil Rapat","tag":"ILUSTRASI KANTOR","body":"<div class=\"sample-document\"><div class=\"sample-center\"><b>NOTULA RAPAT EVALUASI PELAYANAN<\/b><small>PT Sentosa Jaya • Data fiktif<\/small><\/div><hr><p><b>Hari/tanggal:<\/b> Rabu, 18 November 2026<br><b>Waktu:<\/b> 09.00–10.00 WIB<br><b>Pimpinan:<\/b> Andi Pratama<br><b>Notulis:<\/b> Rina Safitri<\/p><p><b>Pokok pembahasan:<\/b> Keluhan pelanggan meningkat akibat keterlambatan respons.<\/p><p><b>Keputusan:<\/b> Tim layanan akan menggunakan daftar prioritas keluhan mulai 19 November 2026.<\/p><p><b>Tindak lanjut:<\/b> Rina menyusun format daftar prioritas sebelum 19 November; Andi memeriksa hasilnya pada 23 November.<\/p><p><b>Penutup:<\/b> Rapat selesai pukul 10.00 WIB.<\/p><\/div><aside class=\"note\"><strong>Coba amati<\/strong><p>Apakah keputusan, penanggung jawab, dan tenggat sudah jelas?<\/p><\/aside>","visual":"docs","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Notula, Berita Acara dan Laporan","tag":"BEDAKAN DOKUMEN","body":"<div class=\"table-wrap\"><table><thead><tr><th>Dokumen<\/th><th>Fungsi<\/th><\/tr><\/thead><tbody><tr><td>Notula<\/td><td>Meringkas jalannya pembahasan dan keputusan rapat<\/td><\/tr><tr><td>Berita acara<\/td><td>Merekam secara formal fakta atau kegiatan tertentu dan dapat memuat pengesahan pihak terkait<\/td><\/tr><tr><td>Laporan kegiatan<\/td><td>Menyajikan rencana, pelaksanaan, hasil, kendala, anggaran, dan evaluasi<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Setelah rapat, sekretariat menyusun notula. Setelah acara bisnis selesai, panitia dapat membuat laporan kegiatan untuk pimpinan.<\/p><\/aside>","visual":"files","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Simulasi: Buat Notula Digital","tag":"PRAKTIK INTERAKTIF","body":"<p class=\"lead\">Lengkapi identitas rapat, masalah, keputusan, penanggung jawab, dan tenggat. Periksa unsur, lalu tampilkan pratinjau notula di dalam simulasi—tanpa mengunduh file.<\/p><div id=\"sim-minutes\"><\/div>","visual":"docs","mode":"minutes","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Tindak Lanjut Keputusan","tag":"KEPUTUSAN MENJADI PEKERJAAN","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Tulis keputusan<\/h3><p>Gunakan kalimat konkret dan tidak ambigu.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Tetapkan PIC<\/h3><p>Satu orang bertanggung jawab utama untuk setiap tugas.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Tetapkan tenggat<\/h3><p>Tanggal penyelesaian harus jelas dan realistis.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Pantau progres<\/h3><p>Periksa status secara berkala dan dokumentasikan perubahan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Evaluasi hasil<\/h3><p>Tentukan apakah masalah sudah teratasi.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Format ringkas<\/strong><p>Tugas → PIC → Tenggat → Status → Bukti hasil<\/p><\/aside>","visual":"crm","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Contoh Matriks Tindak Lanjut","tag":"TABEL AKSI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Tugas<\/th><th>PIC<\/th><th>Tenggat<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td>Menyiapkan daftar prioritas keluhan<\/td><td>Rina<\/td><td>19 Nov 2026<\/td><td>Dalam proses<\/td><\/tr><tr><td>Meninjau ulang alur respons<\/td><td>Andi<\/td><td>23 Nov 2026<\/td><td>Belum mulai<\/td><\/tr><tr><td>Melaporkan hasil perubahan<\/td><td>Sari<\/td><td>30 Nov 2026<\/td><td>Belum mulai<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Evaluasi<\/strong><p>Tenggat tidak cukup: perlu mekanisme memantau progres dan menentukan tindakan apabila pekerjaan tertunda.<\/p><\/aside>","visual":"sheet","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Penyimpanan Dokumen Rapat","tag":"PENGARSIPAN","body":"<ul class=\"rich-list\"><li>Gunakan struktur folder yang mudah ditelusuri, misalnya <b>Rapat/2026/November/Evaluasi-Pelayanan<\/b>.<\/li><li>Simpan agenda, undangan, bahan, daftar hadir, notula, dan matriks tindak lanjut sesuai SOP.<\/li><li>Gunakan nama file yang jelas, versi konsisten, dan hak akses sesuai peran.<\/li><li>Lakukan pencadangan sesuai kebijakan perusahaan.<\/li><li>Hindari menyebarkan informasi rahasia ke grup atau akun pribadi.<\/li><\/ul><aside class=\"note\"><strong>Contoh nama file<\/strong><p>2026-11-18_Notula-Evaluasi-Pelayanan_v01.pdf<\/p><\/aside>","visual":"files","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Kerahasiaan dan Etika Dokumentasi","tag":"PENGELOLAAN INFORMASI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Akses terbatas<\/h3><p>Bagikan materi hanya kepada pihak berwenang.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Catatan faktual<\/h3><p>Hindari mengubah isi keputusan atau mencatat opini pribadi sebagai fakta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Rekaman rapat<\/h3><p>Ikuti aturan perusahaan, persetujuan dan pemberitahuan yang berlaku.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Perbaikan dokumen<\/h3><p>Revisi harus dapat ditelusuri dan dilakukan oleh penanggung jawab.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Retensi<\/h3><p>Simpan dan musnahkan dokumen sesuai kebijakan serta ketentuan yang berlaku.<\/p><\/article><\/div>","visual":"security","mode":"normal","section":"04 • Dokumentasi dan Tindak Lanjut"},{"title":"Apa Itu Kegiatan Bisnis?","tag":"LINGKUP KERJA","body":"<p class=\"lead\">Kegiatan bisnis adalah aktivitas yang diselenggarakan untuk mendukung operasional, promosi, koordinasi, hubungan pelanggan, atau pengembangan perusahaan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Pelatihan karyawan<\/h3><p>Meningkatkan kompetensi atau penguasaan prosedur.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Seminar / workshop<\/h3><p>Berbagi pengetahuan dan keterampilan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pameran produk<\/h3><p>Memperkenalkan produk atau layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Kunjungan kerja<\/h3><p>Melihat praktik dan membangun hubungan kerja.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Pertemuan mitra<\/h3><p>Koordinasi kolaborasi dan peluang kerja sama.<\/p><\/article><\/div>","visual":"team","mode":"normal","section":"05 • Kegiatan Bisnis Lain"},{"title":"Merencanakan Acara Bisnis","tag":"SOP KEGIATAN","body":"<div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Tetapkan tujuan dan sasaran<\/h3><p>Tentukan peserta dan hasil kegiatan.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Bentuk panitia<\/h3><p>Tetapkan koordinator, sekretariat, perlengkapan, konsumsi dan dokumentasi.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Susun proposal<\/h3><p>Jadwal, lokasi, susunan acara, kebutuhan dan anggaran.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Laksanakan<\/h3><p>Pastikan registrasi, acara inti, pendampingan dan keamanan berjalan.<\/p><\/div><\/div><div class=\"step\"><b>05<\/b><div><h3>Evaluasi dan laporkan<\/h3><p>Susun laporan kegiatan, realisasi anggaran dan rekomendasi.<\/p><\/div><\/div><\/div>","visual":"calendar","mode":"normal","section":"05 • Kegiatan Bisnis Lain"},{"title":"Contoh Rundown Kegiatan Bisnis","tag":"SUSUNAN ACARA","body":"<div class=\"table-wrap\"><table><thead><tr><th>Waktu<\/th><th>Kegiatan<\/th><th>Petugas<\/th><\/tr><\/thead><tbody><tr><td>08.00–08.30<\/td><td>Registrasi peserta<\/td><td>Sekretariat<\/td><\/tr><tr><td>08.30–08.40<\/td><td>Pembukaan<\/td><td>MC<\/td><\/tr><tr><td>08.40–09.00<\/td><td>Sambutan pimpinan<\/td><td>Pimpinan<\/td><\/tr><tr><td>09.00–10.00<\/td><td>Pemaparan materi produk<\/td><td>Narasumber<\/td><\/tr><tr><td>10.00–10.30<\/td><td>Diskusi dan tanya jawab<\/td><td>Moderator<\/td><\/tr><tr><td>10.30–10.45<\/td><td>Penutup dan dokumentasi<\/td><td>Panitia<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Rundown vs agenda<\/strong><p>Agenda rapat menekankan topik pembahasan; rundown merinci urutan aktivitas acara beserta waktunya.<\/p><\/aside>","visual":"calendar","mode":"normal","section":"05 • Kegiatan Bisnis Lain"},{"title":"Koordinasi Panitia dan Pelayanan Tamu","tag":"KEGIATAN PROFESIONAL","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Sebelum acara<\/h3><p>Bagikan daftar tugas dan jalur komunikasi panitia.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Saat registrasi<\/h3><p>Sapa peserta, periksa data, dan beri informasi lokasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Selama acara<\/h3><p>Pantau waktu, perangkat, bahan, konsumsi dan kebutuhan peserta.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Jika muncul kendala<\/h3><p>Laporkan kepada koordinator dan gunakan rencana cadangan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Setelah acara<\/h3><p>Kumpulkan bukti kegiatan dan tindak lanjut.<\/p><\/article><\/div>","visual":"team","mode":"normal","section":"05 • Kegiatan Bisnis Lain"},{"title":"Mengevaluasi Kualitas Rapat","tag":"INDIKATOR EVALUASI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Ketercapaian tujuan<\/h3><p>Apakah keputusan dan hasil sesuai tujuan awal?<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Ketepatan waktu<\/h3><p>Apakah kegiatan berjalan sesuai jadwal?<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Partisipasi<\/h3><p>Apakah peserta relevan berkontribusi?<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Kelengkapan administrasi<\/h3><p>Apakah dokumen lengkap dan benar?<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Efisiensi anggaran<\/h3><p>Apakah realisasi sesuai plafon dan bukti?<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">06<\/span><h3>Tindak lanjut<\/h3><p>Apakah keputusan dijalankan sesuai penanggung jawab dan tenggat?<\/p><\/article><\/div>","visual":"sheet","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Studi Kasus: Rapat Tidak Efektif","tag":"ANALISIS MASALAH","body":"<p class=\"lead\">PT Sentosa Jaya mengadakan rapat evaluasi selama dua jam. Undangan tidak menyebutkan agenda. Peserta tidak membawa data, beberapa orang membicarakan topik yang berbeda, dan rapat berakhir tanpa penanggung jawab tindakan.<\/p><ul class=\"rich-list\"><li><b>Masalah 1:<\/b> tujuan dan agenda tidak jelas.<\/li><li><b>Masalah 2:<\/b> bahan rapat tidak dipersiapkan.<\/li><li><b>Masalah 3:<\/b> moderasi dan pengendalian waktu lemah.<\/li><li><b>Masalah 4:<\/b> keputusan tidak diikuti PIC dan tenggat.<\/li><\/ul><aside class=\"note\"><strong>Diskusikan<\/strong><p>Jika kamu menjadi sekretaris perusahaan, dokumen dan tindakan apa yang perlu disiapkan sebelum rapat berikutnya?<\/p><\/aside>","visual":"team","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"LKPD 1: Proyek Simulasi Rapat","tag":"KERJA KELOMPOK","body":"<p class=\"lead\">Bentuk kelompok 5–6 siswa sebagai tim manajemen perusahaan. Selenggarakan rapat koordinasi layanan pelanggan selama 15–20 menit.<\/p><div class=\"steps\"><div class=\"step\"><b>01<\/b><div><h3>Bentuk tim<\/h3><p>Tetapkan pimpinan, moderator, notulis, peserta dan sekretariat.<\/p><\/div><\/div><div class=\"step\"><b>02<\/b><div><h3>Siapkan dokumen<\/h3><p>Buat undangan, agenda, daftar hadir dan bahan masalah.<\/p><\/div><\/div><div class=\"step\"><b>03<\/b><div><h3>Praktikkan rapat<\/h3><p>Jalankan diskusi, keputusan, dan penutup secara profesional.<\/p><\/div><\/div><div class=\"step\"><b>04<\/b><div><h3>Kumpulkan produk<\/h3><p>Serahkan notula, keputusan, PIC, tenggat dan evaluasi singkat.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Rubrik 100 poin<\/strong><p>Persiapan 25 • etika dan pelaksanaan 25 • kelengkapan dokumen 30 • tindak lanjut 20.<\/p><\/aside>","visual":"team","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"LKPD 2: Rancang Kegiatan Bisnis","tag":"PROYEK TERAPAN","body":"<p class=\"lead\">Buat rancangan kegiatan “Workshop Pelayanan Prima” untuk 20 peserta, berdurasi tiga jam. Gunakan format proposal sederhana.<\/p><ul class=\"rich-list\"><li>Tentukan tujuan, sasaran, tanggal, lokasi, dan tema kegiatan.<\/li><li>Buat struktur panitia serta pembagian tanggung jawab.<\/li><li>Susun rundown dari registrasi sampai penutup.<\/li><li>Rencanakan sarana, konsumsi, biaya, dan opsi cadangan.<\/li><li>Buat format evaluasi kegiatan dan ringkasan laporan.<\/li><\/ul><aside class=\"note\"><strong>Rubrik 100 poin<\/strong><p>Tujuan dan sasaran 20 • rundown 20 • pembagian tugas 20 • anggaran 20 • evaluasi 20.<\/p><\/aside>","visual":"slides","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Petunjuk Kuis Bab 7","tag":"ASESMEN FORMATIF","body":"<p class=\"lead\">Kuis terdiri atas 15 soal pilihan ganda yang mencakup konsep rapat, persiapan, pelaksanaan, notula, evaluasi, dan kegiatan bisnis.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>15 soal<\/h3><p>Dibagi ke dalam dua bagian sehingga nyaman dibaca di HP.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Nilai 0–100<\/h3><p>Setiap jawaban benar bernilai 100/15 poin.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pembahasan<\/h3><p>Lihat alasan jawaban yang tepat setelah mengerjakan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Boleh mengulang<\/h3><p>Gunakan tombol ulangi untuk mencoba lagi.<\/p><\/article><\/div><aside class=\"note\"><strong>Petunjuk<\/strong><p>Tekan Selanjutnya untuk menjawab soal. Semua interaksi dilakukan di browser dan tidak mengirim jawaban ke server.<\/p><\/aside>","visual":"quiz","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Kuis Bab 7 — Bagian 1","tag":"SOAL 1–8","body":"<div id=\"quiz-a\"><\/div>","visual":"quiz","mode":"quiza","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Kuis Bab 7 — Bagian 2","tag":"SOAL 9–15","body":"<div id=\"quiz-b\"><\/div>","visual":"quiz","mode":"quizb","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Hasil Kuis dan Pembahasan","tag":"PENILAIAN OTOMATIS","body":"<div id=\"quiz-result\"><\/div>","visual":"quiz","mode":"quizresult","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Refleksi Pembelajaran","tag":"EVALUASI DIRI","body":"<p class=\"lead\">Tentukan tingkat penguasaanmu untuk setiap keterampilan. Diskusikan dengan guru bagian yang masih perlu dilatih.<\/p><div id=\"sim-reflect\"><\/div>","visual":"team","mode":"reflect","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Rangkuman Bab 7","tag":"INTI MATERI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Rapat<\/h3><p>Pertemuan terarah untuk koordinasi, diskusi dan keputusan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Perencanaan<\/h3><p>Tujuan, agenda, peserta, undangan, sarana, dan anggaran.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Pelaksanaan<\/h3><p>Etika, kepemimpinan, notulis, dan pengendalian waktu.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Dokumentasi<\/h3><p>Daftar hadir, notula, keputusan, PIC, tenggat, dan arsip.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Kegiatan bisnis<\/h3><p>Rundown, panitia, logistik, evaluasi dan laporan.<\/p><\/article><\/div><aside class=\"note\"><strong>Pesan utama<\/strong><p>Rapat berhasil apabila tujuannya tercapai dan keputusan ditindaklanjuti, bukan sekadar semua peserta hadir.<\/p><\/aside>","visual":"team","mode":"normal","section":"06 • Evaluasi, Proyek dan Kuis"},{"title":"Selamat, Bab 7 Selesai!","tag":"PENUTUP","body":"<div class=\"finish\"><div class=\"finish-icon\">✓<\/div><h2>Siap Mengelola Rapat Profesional?<\/h2><p>Kamu telah mempelajari tahapan persiapan, pelaksanaan, dokumentasi, tindak lanjut, dan evaluasi rapat serta kegiatan bisnis.<\/p><p>Gunakan simulasi dan LKPD untuk membiasakan diri bekerja secara tertib dan bertanggung jawab.<\/p><div class=\"source-list\"><b>Rujukan belajar lanjutan:<\/b><a href=\"https://kurikulum.kemdikbud.go.id/\" target=\"_blank\" rel=\"noopener\">Portal Kurikulum Kementerian Pendidikan<\/a><\/div><p class=\"fineprint\">Semua nama perusahaan, pegawai, jadwal dan contoh anggaran merupakan data fiktif untuk pembelajaran.<\/p><\/div>","visual":"team","mode":"finish","section":"06 • Evaluasi, Proyek dan Kuis"}]</script><script>

case 'attend-pick':state.attend[+el.dataset.index]=el.dataset.val;renderAttend();break;case 'attend-reset':state.attend={};renderAttend();break;
case 'situation-pick':{let i=Object.keys(state.situationAnswers).length,x=situations[i],ok=+el.dataset.val===x.correct;state.situationAnswers[i]=ok;showDecision(el,ok,x.why,renderSituation);break}case 'situation-reset':state.situationAnswers={};renderSituation();break;
case 'quiz-result':navigate(slides.findIndex(x=>x.mode==='quizresult'));break;case 'quiz-review':state.showReview=!state.showReview;renderResult();break;case 'quiz-first':navigate(slides.findIndex(x=>x.mode==='quiza'));break;case 'quiz-reset':state.quizAnswers={};state.showReview=false;renderResult();break;
case 'reflect-pick':state.reflect[+el.dataset.id]=el.dataset.val;renderReflect();break;}}
);
window.addEventListener('input',e=>{let id=e.target.id;if(!id)return;let map={agTitle:'title',agDate:'date',agTime:'time',agVenue:'venue',agPeople:'people',agObjective:'objective'};if(map[id]){state.agenda[map[id]]=e.target.value;state.agenda.checked=false}let topic=id.match(/^agTopic(\d)$/),mins=id.match(/^agMins(\d)$/);if(topic){state.agenda.topics[+topic[1]].text=e.target.value;state.agenda.checked=false}if(mins){state.agenda.topics[+mins[1]].mins=Math.max(0,Math.min(999,Number(e.target.value)||0));state.agenda.checked=false}
const budgetMap={buParticipants:'participants',buSnack:'snack',buWater:'water',buRoom:'room',buTools:'tools',buReserve:'reserve'};if(budgetMap[id]){state.budget[budgetMap[id]]=Math.max(0,Math.min(1e9,Number(e.target.value)||0));updateBudget()}
const minuteMap={miTitle:'title',miDate:'date',miLeader:'leader',miScribe:'scribe',miTopic:'topic',miDecision:'decision',miOwner:'owner',miDeadline:'deadline'};if(minuteMap[id]){state.minutes[minuteMap[id]]=e.target.value;state.minutes.checked=false}
});
window.addEventListener('change',e=>{let v=e.target.dataset.question;if(v!==undefined){state.quizAnswers[+v]=+e.target.value;state.showReview=false}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#menuOverlay').classList.contains('open')){closeMenu();return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable||$('#menuOverlay').classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();navigate(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();navigate(current-1)}});
$('#menuOverlay').addEventListener('click',e=>{if(e.target===$('#menuOverlay'))closeMenu()});
let touch=null;$('#stage').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#stage').addEventListener('touchend',e=>{if(!touch||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>115&&Math.abs(dy)<35&&!e.target.closest('input,textarea,table,.workbench,.sim-choose'))navigate(current+(dx<0?1:-1))},{passive:true});
const hash=location.hash.match(/^#slide-(\d+)$/);if(hash)current=Math.max(0,Math.min(slides.length-1,Number(hash[1])-1));draw();window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m&&Number(m[1])-1!==current){current=Math.max(0,Math.min(slides.length-1,Number(m[1])-1));draw()}});
</script></body></html>
