function renderComplaint(){let s=state.complaint,el=$('#sim-keluhan');if(s.idx===cases.length){el.innerHTML=`<div class="workbench"><div class="score-hero">${s.points} / 100</div><h3>Simulasi selesai</h3><p>${s.points===100?'Seluruh respons tepat!':`Kamu membuat ${s.points/20} keputusan tepat dari 5 situasi.`} Ulangi untuk memperkuat prinsip pemulihan layanan.</p><div class="action-row"><button class="action-btn" data-act="complaint-reset">Ulangi Simulasi</button></div></div>`;return}let c=cases[s.idx];el.innerHTML=`<div class="workbench"><div class="case-progress"><span>Situasi ${s.idx+1} dari 5</span><span>Skor ${s.points}</span></div><h3>${safe(c.q)}</h3><div class="choice-list">${c.a.map((v,i)=>`<button class="choice" data-act="complaint-answer" data-val="${i}" ${s.choice!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${safe(v)}</button>`).join('')}</div>${s.choice===null?'':`<div class="feedback ${s.choice===c.correct?'':'warn'}"><b>${s.choice===c.correct?'✓ Keputusan tepat':'Perlu diperbaiki — jawaban '+String.fromCharCode(65+c.correct)}</b><p>${safe(c.reason)}</p><button class="action-btn" data-act="complaint-next">${s.idx===4?'Lihat Skor':'Situasi Berikutnya →'}</button></div>`}</div>`;if(s.choice!==null){let btns=$$('#sim-keluhan .choice');btns.forEach((b,i)=>{if(i===c.correct)b.classList.add('correct');else if(i===s.choice)b.classList.add('wrong')})}}
const pdcaKeys=['problem','evidence','why','plan','pic','deadline','metric','check'];
function renderPDCA(){const v=state.pdca;$('#sim-pdca').innerHTML=`<div class="workbench"><div class="fields">${textField('pd-problem','Masalah layanan',v.problem,'Contoh: waktu balas chat terlalu lama',true)}${textField('pd-evidence','Bukti/angka awal',v.evidence,'Contoh: 80 dari 100 tiket dijawab ≤4 jam',true)}${textField('pd-why','Dugaan akar penyebab',v.why,'Dasarkan pada hasil pemeriksaan',true)}${textField('pd-plan','PLAN & DO — tindakan uji coba',v.plan,'Contoh: atur antrean dan shift selama 30 hari',true)}${textField('pd-pic','Penanggung jawab / PIC',v.pic,'Unit atau nama peran')}${textField('pd-deadline','Tenggat',v.deadline,'Contoh: 30 hari')}${textField('pd-metric','CHECK — target dan indikator',v.metric,'Contoh: ≥90% respons ≤4 jam',true)}${textField('pd-check','ACT — keputusan tindak lanjut',v.check,'Contoh: perluas jika target tercapai',true)}</div><div class="action-row"><button class="action-btn" data-act="pd-check">Periksa Kelengkapan</button><button class="action-btn alt" data-act="pd-preview">Pratinjau Rencana</button><button class="action-btn alt" data-act="pd-example">Isi Contoh</button></div><div id="pdcaResult"></div></div>`}
function renderPDCAResult(){const v=state.pdca,filled=pdcaKeys.filter(k=>String(v[k]).trim().length>=4),el=$('#pdcaResult');if(el)el.innerHTML=`<div class="feedback"><b>Terisi: ${filled.length} dari 8 unsur</b><p>Belum lengkap: ${pdcaKeys.filter(k=>!filled.includes(k)).map(k=>({'problem':'masalah','evidence':'bukti awal','why':'akar masalah','plan':'uji coba tindakan','pic':'PIC','deadline':'tenggat','metric':'indikator/target','check':'tindak lanjut'}[k])).join(', ')||'tidak ada'}.</p><p class="mini-hint">Pemeriksaan otomatis hanya memeriksa kelengkapan, belum menilai kualitas atau kebenaran isi.</p></div>`}
function previewPDCA(){let v=state.pdca;$('#menuOverlay .modal-head b').textContent='Pratinjau Rencana Perbaikan Virtual';$('#sections').style.display='none';$('#slideIndex').style.display='block';$('#slideIndex').innerHTML=`<div class="preview-sheet"><h2>RENCANA PERBAIKAN KUALITAS LAYANAN</h2><p><b>Masalah:</b><br>${safe(v.problem)}</p><p><b>Bukti awal:</b><br>${safe(v.evidence)}</p><p><b>Dugaan akar penyebab:</b><br>${safe(v.why)}</p><hr><p><b>PLAN & DO — Tindakan uji coba:</b><br>${safe(v.plan)}</p><p><b>PIC:</b> ${safe(v.pic)}</p><p><b>Tenggat:</b> ${safe(v.deadline)}</p><p><b>CHECK — Indikator:</b><br>${safe(v.metric)}</p><p><b>ACT — Tindak lanjut:</b><br>${safe(v.check)}</p><p class="muted">Dokumen simulasi untuk pembelajaran. Guru perlu memeriksa isi dan relevansinya.</p></div>`;$('#menuOverlay').classList.add('open')}
const questions=[
['Apa tujuan utama evaluasi kualitas layanan?',['Memperbanyak formulir saja','Menemukan bukti kinerja dan merancang perbaikan','Menghapus semua keluhan','Menentukan siapa yang harus disalahkan'],1,'Evaluasi membandingkan kinerja dengan standar dan menghasilkan tindak lanjut.'],
['Fasilitas ruang tunggu dan papan informasi termasuk dimensi ...',['Tangibles','Empathy','Reliability','Assurance'],0,'Tangibles berhubungan dengan bukti fisik pelayanan.'],
['Layanan selesai tepat waktu dan hasilnya akurat terutama terkait ...',['Bukti fisik','Empati','Keandalan','Daya tarik iklan'],2,'Reliability adalah kemampuan memberikan layanan tepat dan konsisten.'],
['Petugas cepat memberikan pembaruan status menunjukkan ...',['Responsiveness','Tangibles','Rencana anggaran','Kerahasiaan arsip'],0,'Daya tanggap tampak dalam respons yang cepat dan tepat.'],
['Petugas menjaga data pribadi pelanggan menunjukkan aspek ...',['Promosi','Assurance','Biaya produksi','Penampilan ruang'],1,'Kompetensi dan rasa aman termasuk assurance.'],
['Survei memiliki 100 responden; 45 memberi nilai 4 dan 25 memberi nilai 5. CSAT adalah ...',['25%','45%','70%','100%'],2,'CSAT = (45 + 25) / 100 × 100% = 70%.'],
['NPS dengan 45% promoters dan 25% detractors adalah ...',['+20','+70','−20','+45'],0,'NPS adalah selisih 45 − 25 = +20 poin.'],
['Skor 7–8 pada NPS termasuk kelompok ...',['Detractors','Promoters','Passives','Sangat tidak puas'],2,'Passives memberi nilai 7–8 pada skala NPS 0–10.'],
['FCR 28 kasus dari 40 kasus yang memenuhi kriteria berarti ...',['28%','40%','70%','86%'],2,'FCR = 28/40 × 100% = 70%.'],
['Dari 100 kasus, 86 selesai tepat waktu. Tingkat ketepatan waktu adalah ...',['14%','70%','86%','100%'],2,'86/100 × 100% = 86%.'],
['Contoh pertanyaan survei yang netral adalah ...',['“Petugas kami hebat, setuju?”','“Apakah cepat dan ramah sekaligus?”','“Seberapa puas Anda dengan kejelasan informasi?”','“Semua pasti puas, bukan?”'],2,'Pertanyaan netral dan spesifik menghindari bias serta pertanyaan ganda.'],
['Tindakan pertama saat pelanggan mengeluh adalah ...',['Menutup tiket','Mendengarkan lalu memverifikasi fakta','Menyalahkan pelanggan','Mengumumkan data pribadinya'],1,'Tangani dengan empati, verifikasi fakta, dan jaga privasi.'],
['Tujuan teknik 5 Why adalah ...',['Mencari dugaan akar penyebab secara bertahap','Menentukan gaji pegawai','Mendesain logo','Menghitung persediaan barang'],0,'Rangkaian pertanyaan mengapa membantu menemukan akar masalah yang perlu diuji.'],
['Pada PDCA, tahap Check berarti ...',['Menetapkan dugaan masalah','Melaksanakan uji coba saja','Membandingkan hasil uji dengan target','Mengabaikan laporan'],2,'Check memeriksa dampak tindakan dengan indikator yang sama.'],
['Target “respons ≤4 jam naik dari 80% menjadi 90% dalam 30 hari” adalah contoh ...',['Target tanpa ukuran','Sasaran SMART','Hanya opini pelanggan','Rencana tanpa tenggat'],1,'Target jelas, terukur, relevan, dan memiliki tenggat.']
];
function renderQuiz(){let a=slides[current].mode==='quiza',start=a?0:8,end=a?8:15,el=$(a?'#quiz-a':'#quiz-b');el.innerHTML=questions.slice(start,end).map((q,i)=>{let k=start+i;return `<div class="q-card"><h3>${k+1}. ${safe(q[0])}</h3>${q[1].map((v,j)=>`<label class="quiz-option"><input type="radio" name="q${k}" data-question="${k}" value="${j}" ${state.quiz[k]===j?'checked':''}><span>${String.fromCharCode(65+j)}. ${safe(v)}</span></label>`).join('')}</div>`}).join('')+`<div class="action-row"><button class="action-btn" data-act="${a?'quiz-next':'quiz-result'}">${a?'Lanjut Soal 9–15 →':'Lihat Nilai dan Pembahasan →'}</button></div>`}
function renderQuizResult(){let ans=state.quiz,filled=Object.keys(ans).length,correct=questions.filter((q,i)=>q[2]===ans[i]).length,score=Math.round(correct/questions.length*100);$('#quiz-result').innerHTML=`<div class="workbench"><div class="score-hero">${score} / 100</div><h3>Benar ${correct} dari ${questions.length} · Terjawab ${filled} dari ${questions.length}</h3><p>${filled<questions.length?'Masih ada soal yang belum diisi. Silakan kembali untuk melengkapi.':score>=80?'Bagus! Lanjutkan latihan praktik untuk memperkuat keterampilan.':'Pelajari pembahasan dan ulangi kuis untuk memperdalam materi.'}</p><div class="action-row"><button class="action-btn" data-act="quiz-review">${state.review?'Tutup':'Lihat'} Pembahasan</button><button class="action-btn alt" data-act="quiz-back">Kembali ke Soal 1</button><button class="action-btn alt" data-act="quiz-reset">Ulangi Kuis</button></div></div>${state.review?`<div class="q-card"><h3>Pembahasan 15 Soal</h3>${questions.map((q,i)=>`<p><b>${i+1}. ${ans[i]===q[2]?'✓ Tepat':ans[i]===undefined?'○ Belum dijawab':'✕ Kurang tepat'} — ${safe(q[1][q[2]])}</b><br>${safe(q[3])}</p>`).join('')}</div>`:''}`}
const reflectItems=['Menjelaskan lima dimensi kualitas','Menghitung CSAT, NPS, dan KPI','Menganalisis keluhan pelanggan','Menerapkan 5 Why dan PDCA','Menyusun laporan evaluasi dan rekomendasi'];
function renderReflect(){let options=['Bisa mandiri','Perlu latihan','Butuh bantuan'];$('#sim-refleksi').innerHTML=`<div class="workbench">${reflectItems.map((v,i)=>`<div class="reflect-row"><h3>${i+1}. ${safe(v)}</h3><div class="reflect-options">${options.map(o=>`<button data-act="reflect-pick" data-i="${i}" data-val="${o}" class="${state.reflect[i]===o?'selected':''}">${o}</button>`).join('')}</div></div>`).join('')}<div class="feedback">${Object.keys(state.reflect).length} dari 5 kompetensi telah direfleksikan.</div></div>`}
window.addEventListener('click',e=>{let el=e.target.closest('[data-act], [data-slide], [data-section]');if(!el)return;if(el.dataset.slide!==undefined){navigate(+el.dataset.slide);closeMenu();return}if(el.dataset.section!==undefined){menuSection=el.dataset.section;drawMenu();return}
const act=el.dataset.act;if(!act)return;
switch(act){case 'prev':navigate(current-1);break;case 'next':navigate(current+1);break;case 'home':navigate(0);closeMenu();break;case 'menu':menu();break;case 'close-menu':closeMenu();break;case 'speak':speak();break;case 'full':if(document.fullscreenElement)document.exitFullscreen?.();else $('#app').requestFullscreen?.();break;
case 'dim-reset':state.dimensions=[4,3,2,4,3];renderDimensions();break;
case 'kpi-reset':state.kpi={...starting.kpi};renderKpi();break;
case 'cs-reset':state.csat=[...starting.csat];renderCSAT();break;
case 'np-reset':state.nps=[...starting.nps];renderNPS();break;
case 'complaint-answer':{let s=state.complaint;if(s.choice!==null)return;s.choice=+el.dataset.val;if(s.choice===cases[s.idx].correct)s.points+=20;renderComplaint();break}
case 'complaint-next':state.complaint.idx++;state.complaint.choice=null;renderComplaint();break;
case 'complaint-reset':state.complaint={idx:0,points:0,choice:null};renderComplaint();break;
case 'pd-check':renderPDCAResult();break;case 'pd-preview':previewPDCA();break;case 'pd-example':state.pdca={problem:'Respons awal pelanggan terlambat',evidence:'Hanya 80 dari 100 tiket menerima balasan ≤4 jam kerja',why:'Antrean tiket tidak terbagi ke shift petugas (perlu verifikasi)',plan:'Uji antrean bersama dan pembagian shift selama 30 hari',pic:'Koordinator layanan pelanggan',deadline:'30 hari',metric:'Minimal 90% tiket dibalas dalam ≤4 jam kerja',check:'Jika target tercapai dan mutu tetap baik, tetapkan SOP dan pantau bulan berikutnya'};renderPDCA();break;
case 'quiz-next':navigate(slides.findIndex(s=>s.mode==='quizb'));break;case 'quiz-result':navigate(slides.findIndex(s=>s.mode==='quizresult'));break;case 'quiz-review':state.review=!state.review;renderQuizResult();break;case 'quiz-back':navigate(slides.findIndex(s=>s.mode==='quiza'));break;case 'quiz-reset':state.quiz={};state.review=false;navigate(slides.findIndex(s=>s.mode==='quiza'));draw();break;
case 'reflect-pick':state.reflect[el.dataset.i]=el.dataset.val;renderReflect();break;
}}
);
window.addEventListener('input',e=>{let id=e.target.id, m;
if((m=id.match(/^dim([0-4])$/))){state.dimensions[+m[1]]=+e.target.value;updateDimensions();return}
if((m=id.match(/^kp(Tickets|Ontime|Eligible|Fcr|Docs|Corrections)$/))){const map={Tickets:'tickets',Ontime:'ontime',Eligible:'eligible',Fcr:'fcr',Docs:'documents',Corrections:'corrections'};state.kpi[map[m[1]]]=e.target.value===''?NaN:+e.target.value;updateKpi();return}
if((m=id.match(/^cs([0-4])$/))){state.csat[+m[1]]=e.target.value===''?NaN:+e.target.value;updateCSAT();return}
if((m=id.match(/^np([0-2])$/))){state.nps[+m[1]]=e.target.value===''?NaN:+e.target.value;updateNPS();return}
if((m=id.match(/^pd-(.+)$/))&&Object.hasOwn(state.pdca,m[1])){state.pdca[m[1]]=e.target.value;const result=$('#pdcaResult');if(result)result.innerHTML='';return}
});
window.addEventListener('change',e=>{if(e.target.dataset.question!==undefined){state.quiz[+e.target.dataset.question]=+e.target.value;state.review=false}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#menuOverlay').classList.contains('open')){closeMenu();return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable||$('#menuOverlay').classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();navigate(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();navigate(current-1)}});
$('#menuOverlay').addEventListener('click',e=>{if(e.target.id==='menuOverlay')closeMenu()});
let touch=null;$('#stage').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#stage').addEventListener('touchend',e=>{if(!touch||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>115&&Math.abs(dy)<35&&!e.target.closest('input,textarea,table,.workbench,.choice-list'))navigate(current+(dx<0?1:-1))},{passive:true});
const match=location.hash.match(/^#slide-(\d+)$/);if(match)current=Math.max(0,Math.min(slides.length-1,Number(match[1])-1));draw();window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m&&Number(m[1])-1!==current){current=Math.max(0,Math.min(slides.length-1,Number(m[1])-1));draw()}});
</script></body></html>
