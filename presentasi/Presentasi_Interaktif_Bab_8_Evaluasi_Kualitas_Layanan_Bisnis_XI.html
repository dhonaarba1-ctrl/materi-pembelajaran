</style></head><body><div class="app" id="app"><header class="topbar"><div class="mark">MLB</div><div class="brand"><b>BAB 8 • EVALUASI KUALITAS LAYANAN BISNIS</b><span>Manajemen Layanan Bisnis · Kelas XI SMK · Presentasi Interaktif</span></div><div class="top-actions"><button class="mini-btn" data-act="home" title="Kembali ke awal">⌂ <span class="hide-phone">Beranda</span></button><button class="mini-btn" data-act="menu" title="Daftar slide">☷ <span class="hide-phone">Daftar</span></button><button class="mini-btn" data-act="speak" id="speakBtn" title="Bacakan slide">◖))</button><button class="mini-btn" data-act="full" title="Layar penuh">⛶</button></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></header><main class="stage" id="stage"><div id="slideHost"></div></main><footer class="nav"><div class="nav-side"><button class="nav-btn" data-act="prev" id="prevBtn" aria-label="Slide sebelumnya">← <span class="nav-label">Sebelumnya</span></button></div><div class="nav-mid"><div class="slide-count" id="slideCount">1 / 60</div><div class="rail"><div id="railFill"></div></div><div class="kbd-help">Gunakan tombol ← / → atau menu slide</div></div><div class="nav-side right"><button class="nav-btn primary" data-act="next" id="nextBtn" aria-label="Slide selanjutnya"><span class="nav-label">Selanjutnya</span> →</button></div></footer></div><div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Daftar slide"><div class="modal"><div class="modal-head"><b>Daftar Materi dan Slide</b><button class="mini-btn" data-act="close-menu" aria-label="Tutup">✕</button></div><div class="modal-body"><div class="sections" id="sections"></div><div class="slide-index" id="slideIndex"></div></div></div></div><script id="slide-data" type="application/json">[{"title":"Evaluasi Kualitas Layanan Bisnis","tag":"BAB 8 • MANAJEMEN LAYANAN BISNIS","body":"<div class=\"cover-intro\"><span class=\"eyebrow\">KELAS XI SMK • FASE F<\/span><h2>Ukur Layanan, Pahami Pelanggan, Perbaiki Kualitas<\/h2><p>Pelajari cara menilai kualitas pelayanan secara objektif, membaca survei kepuasan, menyelesaikan keluhan, dan merancang perbaikan layanan melalui praktik nyata.<\/p><div class=\"hero-pills\"><span id=\"totalPill\">70 slide<\/span><span>6 simulasi<\/span><span>15 soal kuis<\/span><span>2 LKPD<\/span><\/div><\/div>","visual":"team","mode":"cover","section":"Pendahuluan"},{"title":"Tujuan Pembelajaran","tag":"TUJUAN PEMBELAJARAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Memahami<\/h3><p>Menguraikan arti, manfaat, dan dimensi kualitas layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Mengukur<\/h3><p>Menghitung indikator kepuasan, kecepatan, serta penyelesaian layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Menganalisis<\/h3><p>Menentukan akar masalah dari umpan balik dan keluhan pelanggan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Memperbaiki<\/h3><p>Menyusun rencana perbaikan dengan target, PIC, dan evaluasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Melaporkan<\/h3><p>Menyajikan temuan secara jujur, rapi, dan mudah dipahami.<\/p><\/article><\/div><aside class=\"note\"><strong>Produk akhir<\/strong><p>Laporan evaluasi kualitas layanan bisnis sederhana, lengkap dengan data, analisis, dan rencana perbaikan.<\/p><\/aside>","visual":"slides","mode":"","section":"Pendahuluan"},{"title":"Peta Pembelajaran Bab 8","tag":"ALUR MATERI","body":"<div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Konsep dasar<\/h3><p>Mengapa layanan harus dievaluasi?<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Indikator dan standar<\/h3><p>Dimensi kualitas, SOP, serta ukuran layanan.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Survei dan angka<\/h3><p>CSAT, NPS, CES, KPI, serta interpretasi data.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Analisis masalah<\/h3><p>Keluhan, akar penyebab, dan prioritas penanganan.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Perbaikan dan pelaporan<\/h3><p>PDCA, rencana aksi, laporan, kuis, dan LKPD.<\/p><\/div><\/div><\/div>","visual":"slides","mode":"","section":"Pendahuluan"},{"title":"Kasus Pemantik: Layanan Terlambat","tag":"STUDI KASUS","body":"<p class=\"lead\">Sebuah perusahaan menerima banyak keluhan bahwa pesan pelanggan baru dijawab setelah dua hari.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Gejala<\/h3><p>Pelanggan menunggu lama dan bertanya berulang kali.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Risiko<\/h3><p>Kepercayaan menurun; pekerjaan menumpuk.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Data yang dibutuhkan<\/h3><p>Waktu respons, volume pesan, dan tingkat penyelesaian.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Tindakan awal<\/h3><p>Bandingkan hasil aktual dengan target layanan.<\/p><\/article><\/div><aside class=\"note\"><strong>Diskusikan<\/strong><p>Apakah keramahan petugas saja cukup untuk menyimpulkan pelayanan sudah baik? Jelaskan.<\/p><\/aside>","visual":"crm","mode":"","section":"Pendahuluan"},{"title":"Pengertian Kualitas Layanan","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Kualitas layanan<\/b> menggambarkan seberapa baik proses dan hasil pelayanan memenuhi kebutuhan, harapan, dan standar yang relevan.<\/p><ul class=\"rich-list\"><li>Kualitas mencakup proses, bukan hanya hasil akhir.<\/li><li>Pelanggan mempertimbangkan ketepatan, kecepatan, rasa aman, dan perlakuan petugas.<\/li><li>Persepsi pelanggan dapat berbeda dengan penilaian internal perusahaan.<\/li><\/ul><aside class=\"note\"><strong>Contoh<\/strong><p>Surat selesai dibuat dengan benar, tetapi petugas tidak memberi informasi kapan surat dapat diambil. Hasilnya benar, namun pengalaman pelanggan masih perlu diperbaiki.<\/p><\/aside>","visual":"office","mode":"","section":"Konsep Dasar"},{"title":"Pengertian Evaluasi Kualitas Layanan","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Evaluasi kualitas layanan<\/b> adalah proses mengumpulkan bukti, membandingkan kinerja dengan standar, menafsirkan hasil, dan menentukan perbaikan.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Tetapkan standar<\/h3><p>Misalnya respons awal maksimal 4 jam kerja.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Kumpulkan bukti<\/h3><p>Catatan tiket, hasil survei, observasi, dan wawancara.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Analisis kesenjangan<\/h3><p>Temukan apa yang tidak sesuai dengan target.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Tindak lanjuti<\/h3><p>Perbaiki prosedur, lalu ukur ulang.<\/p><\/div><\/div><\/div>","visual":"chart","mode":"","section":"Konsep Dasar"},{"title":"Tujuan dan Manfaat Evaluasi","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Menjaga konsistensi<\/h3><p>Pelayanan memenuhi SOP di setiap petugas dan saluran.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Meningkatkan kepuasan<\/h3><p>Keluhan dan kebutuhan pelanggan lebih mudah diketahui.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Mencegah masalah berulang<\/h3><p>Akar masalah ditangani, bukan hanya gejalanya.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Mendukung keputusan<\/h3><p>Perusahaan mengambil langkah berdasarkan bukti.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Mengembangkan pegawai<\/h3><p>Hasil penilaian menjadi bahan pelatihan dan pembinaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">06<\/span><h3>Mengoptimalkan sumber daya<\/h3><p>Waktu, biaya, dan tenaga digunakan secara tepat.<\/p><\/article><\/div>","visual":"team","mode":"","section":"Konsep Dasar"},{"title":"Siapa yang Terlibat dalam Evaluasi?","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Pelanggan<\/h3><p>Memberikan penilaian pengalaman dan saran.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Frontliner<\/h3><p>Menjelaskan situasi layanan yang terjadi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Supervisor<\/h3><p>Memeriksa SOP dan menilai penyelesaian kasus.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Manajemen<\/h3><p>Memutuskan prioritas sumber daya dan perbaikan.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Evaluasi dilakukan untuk memperbaiki sistem dan perilaku kerja, bukan menyalahkan pegawai tanpa bukti.<\/p><\/aside>","visual":"team","mode":"","section":"Konsep Dasar"},{"title":"Harapan, Pengalaman, dan Kesenjangan","tag":"MATERI KELAS XI","body":"<p class=\"\">Pelanggan memiliki <b>harapan<\/b> sebelum dilayani dan menilai <b>pengalaman nyata<\/b> setelah pelayanan diterima.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Harapan<\/th><th>Pengalaman<\/th><th>Interpretasi<\/th><\/tr><\/thead><tbody><tr><td>Balasan maksimal 2 jam<\/td><td>Dibalas dalam 30 menit<\/td><td>Lebih cepat dari harapan<\/td><\/tr><tr><td>Dokumen selesai 1 hari<\/td><td>Selesai 3 hari<\/td><td>Ada kesenjangan negatif<\/td><\/tr><tr><td>Petugas memberi informasi jelas<\/td><td>Petugas menjelaskan dengan tepat<\/td><td>Sesuai harapan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Hati-hati<\/strong><p>Tidak semua pelanggan memiliki harapan yang sama. Standar resmi perusahaan tetap perlu dijelaskan secara jelas.<\/p><\/aside>","visual":"chart","mode":"","section":"Konsep Dasar"},{"title":"Customer Journey: Perjalanan Pelanggan","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Customer journey adalah rangkaian pengalaman pelanggan dari mulai mencari informasi sampai layanan selesai.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Mencari informasi<\/h3><p>Pelanggan membuka situs, bertanya, atau melihat brosur.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Menghubungi<\/h3><p>Pelanggan bertanya melalui telepon, chat, atau tatap muka.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Diproses<\/h3><p>Petugas memeriksa permintaan, identitas, dan dokumen.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Menerima hasil<\/h3><p>Pelanggan mendapat solusi dan konfirmasi.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Memberikan umpan balik<\/h3><p>Pelanggan mengisi survei atau menyampaikan saran.<\/p><\/div><\/div><\/div>","visual":"crm","mode":"","section":"Konsep Dasar"},{"title":"Titik Kontak dan Bukti Pelayanan","tag":"MATERI KELAS XI","body":"<ul class=\"rich-list\"><li><b>Touchpoint:<\/b> meja layanan, telepon, email, situs, dan aplikasi.<\/li><li><b>Bukti pelayanan:<\/b> nomor tiket, waktu respons, status permintaan, dan dokumen hasil.<\/li><li><b>Pengalaman:<\/b> mudah atau sulit diakses, jelas atau membingungkan, cepat atau lambat.<\/li><\/ul><aside class=\"note\"><strong>Praktik<\/strong><p>Amati sebuah alur layanan di sekolah: penerimaan tamu, peminjaman barang, atau surat izin. Catat titik kontak dan kemungkinan hambatannya.<\/p><\/aside>","visual":"crm","mode":"","section":"Konsep Dasar"},{"title":"Lima Dimensi Kualitas Layanan","tag":"KERANGKA PENILAIAN","body":"<p class=\"lead\">Kerangka <b>SERVQUAL<\/b> memperkenalkan lima dimensi untuk membantu mengamati aspek pelayanan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Tangibles<\/h3><p>Bukti fisik dan fasilitas.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Reliability<\/h3><p>Keandalan dan ketepatan layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Responsiveness<\/h3><p>Kesigapan merespons kebutuhan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Assurance<\/h3><p>Kompetensi dan kemampuan menumbuhkan rasa percaya.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Empathy<\/h3><p>Perhatian terhadap kebutuhan individu pelanggan.<\/p><\/article><\/div><aside class=\"note\"><strong>Pemakaian<\/strong><p>Dimensi ini membantu menyusun pertanyaan observasi atau survei, bukan skor otomatis tanpa data.<\/p><\/aside>","visual":"slides","mode":"","section":"Dimensi Layanan"},{"title":"Dimensi 1: Tangibles (Bukti Fisik)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Bukti fisik berkaitan dengan kondisi fasilitas, penampilan petugas, perlengkapan, dan media informasi.<\/p><ul class=\"rich-list\"><li>Ruang tunggu dan meja pelayanan bersih serta tertata.<\/li><li>Petugas mengenakan identitas atau atribut sesuai aturan.<\/li><li>Petunjuk layanan mudah dibaca.<\/li><li>Peralatan kantor dapat digunakan dengan baik.<\/li><\/ul><aside class=\"note\"><strong>Contoh indikator<\/strong><p>\"Ruang pelayanan bersih dan informasi alur layanan mudah ditemukan.\"<\/p><\/aside>","visual":"office","mode":"","section":"Dimensi Layanan"},{"title":"Dimensi 2: Reliability (Keandalan)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Keandalan adalah kemampuan memberikan layanan secara akurat, konsisten, dan sesuai janji.<\/p><ul class=\"rich-list\"><li>Data pelanggan dicatat tanpa kesalahan.<\/li><li>Hasil dokumen sesuai permintaan.<\/li><li>Layanan selesai pada waktu yang dijanjikan.<\/li><li>Informasi biaya atau persyaratan tidak berubah-ubah tanpa penjelasan.<\/li><\/ul><aside class=\"note\"><strong>Contoh indikator<\/strong><p>Persentase dokumen yang selesai tepat waktu dan tanpa koreksi.<\/p><\/aside>","visual":"docs","mode":"","section":"Dimensi Layanan"},{"title":"Dimensi 3: Responsiveness (Daya Tanggap)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Daya tanggap menunjukkan kesiapan petugas membantu pelanggan serta memberi respons yang tepat waktu.<\/p><ul class=\"rich-list\"><li>Menyapa pelanggan tanpa menunggu terlalu lama.<\/li><li>Memberikan informasi status permintaan.<\/li><li>Mengarahkan pertanyaan ke unit yang berwenang.<\/li><li>Memberi pembaruan jika penyelesaian terlambat.<\/li><\/ul><aside class=\"note\"><strong>Bedakan<\/strong><p>Respons awal cepat tidak selalu berarti masalah sudah selesai. Catat kedua waktu secara terpisah.<\/p><\/aside>","visual":"crm","mode":"","section":"Dimensi Layanan"},{"title":"Dimensi 4: Assurance (Jaminan)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Assurance berhubungan dengan pengetahuan petugas, kesantunan, keamanan, dan rasa percaya pelanggan.<\/p><ul class=\"rich-list\"><li>Petugas memahami prosedur dan menjawab sesuai kewenangan.<\/li><li>Data pribadi pelanggan dijaga kerahasiaannya.<\/li><li>Pelanggan mendapat informasi yang jelas, tidak menyesatkan.<\/li><li>Ketidakpastian dijelaskan secara terbuka.<\/li><\/ul><aside class=\"note\"><strong>Contoh<\/strong><p>Jika belum mengetahui jawaban, petugas tidak mengarang, melainkan memeriksa atau meneruskan ke pihak tepat.<\/p><\/aside>","visual":"security","mode":"","section":"Dimensi Layanan"},{"title":"Dimensi 5: Empathy (Empati)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Empati berarti memahami kondisi pelanggan dan memberi perhatian yang relevan tanpa mengabaikan aturan.<\/p><ul class=\"rich-list\"><li>Mendengarkan keluhan tanpa menyela.<\/li><li>Menggunakan bahasa yang mudah dipahami.<\/li><li>Memperhatikan kebutuhan aksesibilitas.<\/li><li>Memberi solusi yang layak sesuai prosedur.<\/li><\/ul><aside class=\"note\"><strong>Contoh<\/strong><p>Memberikan penjelasan tertulis bagi pelanggan yang kesulitan mengingat instruksi lisan.<\/p><\/aside>","visual":"team","mode":"","section":"Dimensi Layanan"},{"title":"Latihan: Nilai Lima Dimensi","tag":"SIMULASI 1","body":"<p class=\"lead\">Beri skor 1–5 pada contoh mutu pelayanan kantor. Temukan dimensi yang paling perlu diperbaiki.<\/p><div id=\"sim-dimensi\"><\/div>","visual":"chart","mode":"dimensions","section":"Dimensi Layanan"},{"title":"Menghubungkan Dimensi dengan SOP","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Dimensi<\/th><th>Bukti yang dapat diperiksa<\/th><\/tr><\/thead><tbody><tr><td>Bukti fisik<\/td><td>Checklist kebersihan, kelayakan komputer, petunjuk layanan.<\/td><\/tr><tr><td>Keandalan<\/td><td>Catatan kesalahan dokumen, tenggat, dan ketepatan hasil.<\/td><\/tr><tr><td>Daya tanggap<\/td><td>Waktu respons awal dan pembaruan status.<\/td><\/tr><tr><td>Jaminan<\/td><td>Hasil uji pemahaman SOP dan catatan keamanan data.<\/td><\/tr><tr><td>Empati<\/td><td>Observasi interaksi serta tanggapan pelanggan.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Catatan<\/strong><p>Satu indikator bisa berkaitan dengan lebih dari satu dimensi. Gunakan definisi operasional yang konsisten.<\/p><\/aside>","visual":"sheet","mode":"","section":"Dimensi Layanan"},{"title":"Apa Itu Indikator Kinerja Layanan?","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Indikator kinerja<\/b> adalah ukuran yang menunjukkan apakah suatu tujuan pelayanan tercapai.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Input<\/h3><p>Jumlah petugas, jam layanan, perangkat.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Proses<\/h3><p>Waktu tanggapan dan jumlah tahapan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Output<\/h3><p>Jumlah layanan selesai.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Outcome<\/h3><p>Kepuasan atau kemudahan yang dirasakan pelanggan.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Pilih indikator yang relevan, dapat diukur, dan dipahami petugas.<\/p><\/aside>","visual":"chart","mode":"","section":"Indikator & KPI"},{"title":"Contoh Indikator Operasional","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Indikator<\/th><th>Apa yang diamati<\/th><th>Contoh<\/th><\/tr><\/thead><tbody><tr><td>Waktu respons awal<\/td><td>Jarak waktu pesan masuk ke balasan pertama<\/td><td>2 jam kerja<\/td><\/tr><tr><td>Waktu penyelesaian<\/td><td>Jarak waktu tiket dibuat sampai ditutup<\/td><td>1 hari kerja<\/td><\/tr><tr><td>Ketepatan waktu<\/td><td>Layanan selesai sesuai tenggat<\/td><td>86 dari 100 kasus<\/td><\/tr><tr><td>Tingkat koreksi<\/td><td>Hasil yang harus diperbaiki<\/td><td>4 dari 80 dokumen<\/td><\/tr><tr><td>Penyelesaian pertama<\/td><td>Masalah selesai pada kontak pertama<\/td><td>28 dari 40 kasus<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Catatan<\/strong><p>Semua angka tabel adalah contoh latihan, bukan standar industri universal.<\/p><\/aside>","visual":"sheet","mode":"","section":"Indikator & KPI"},{"title":"SOP, Target, dan SLA","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>SOP<\/b> mengatur langkah kerja; <b>target<\/b> menentukan hasil yang ingin dicapai; <b>SLA<\/b> adalah komitmen tingkat layanan yang disepakati.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Istilah<\/th><th>Contoh<\/th><\/tr><\/thead><tbody><tr><td>SOP<\/td><td>Petugas mencatat nomor tiket sebelum meneruskan keluhan.<\/td><\/tr><tr><td>Target internal<\/td><td>90% pesan terjawab dalam 2 jam kerja.<\/td><\/tr><tr><td>SLA<\/td><td>Pelanggan menerima respons awal maksimal 4 jam kerja sesuai perjanjian layanan.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Penting<\/strong><p>Target dan SLA harus ditentukan berdasarkan kapasitas dan kesepakatan organisasi, bukan angka yang dibuat sembarangan.<\/p><\/aside>","visual":"docs","mode":"","section":"Indikator & KPI"},{"title":"Waktu Respons vs Waktu Penyelesaian","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Waktu respons awal<\/h3><p>Selisih antara permintaan diterima dan balasan pertama yang berarti.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Waktu penyelesaian<\/h3><p>Selisih antara tiket dibuka dan masalah selesai menurut kriteria yang disepakati.<\/p><\/article><\/div><div class=\"table-wrap\"><table><thead><tr><th>Situasi<\/th><th>Respons<\/th><th>Selesai<\/th><\/tr><\/thead><tbody><tr><td>Tiket masuk 08.00, dibalas 08.15, tuntas 14.00<\/td><td>15 menit<\/td><td>6 jam<\/td><\/tr><tr><td>Tiket masuk Senin 10.00, dibalas 11.00, tuntas Rabu 10.00<\/td><td>1 jam<\/td><td>2 hari kalender<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Perhatikan<\/strong><p>Perhitungan jam kerja atau jam kalender harus konsisten dengan kebijakan pelaporan.<\/p><\/aside>","visual":"calendar","mode":"","section":"Indikator & KPI"},{"title":"Kinerja Penyelesaian Pertama (FCR)","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>First Contact Resolution<\/b> (FCR) mengukur proporsi masalah yang tuntas pada kontak pertama, sesuai definisi perusahaan.<\/p><div class=\"task-box\"><b class=\"formula\">FCR (%) = (Masalah tuntas pada kontak pertama ÷ Total kasus yang memenuhi kriteria) × 100%<\/b><\/div><p class=\"\">Contoh: 28 dari 40 kasus tuntas saat kontak pertama. <b>FCR = 70%.<\/b><\/p><aside class=\"note\"><strong>Waspada<\/strong><p>FCR rendah tidak selalu menunjukkan petugas buruk; kasus teknis yang rumit bisa memerlukan koordinasi lintas bagian.<\/p><\/aside>","visual":"crm","mode":"","section":"Indikator & KPI"},{"title":"Tingkat Ketepatan Waktu","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Ukuran ini menunjukkan persentase kasus yang selesai dalam batas waktu yang disepakati.<\/p><div class=\"task-box\"><b class=\"formula\">Ketepatan waktu (%) = (Kasus selesai tepat waktu ÷ Total kasus relevan) × 100%<\/b><\/div><p class=\"\">Contoh: 86 dari 100 kasus selesai tepat waktu. Hasilnya <b>86%<\/b>.<\/p><aside class=\"note\"><strong>Analisis lanjut<\/strong><p>Lihat jenis kasus yang terlambat: apakah karena data kurang, petugas terbatas, atau persetujuan berjenjang?<\/p><\/aside>","visual":"calendar","mode":"","section":"Indikator & KPI"},{"title":"Simulasi Menghitung KPI Pelayanan","tag":"SIMULASI 2","body":"<p class=\"lead\">Masukkan angka laporan perusahaan. Sistem akan menghitung tingkat ketepatan waktu, penyelesaian pertama, dan tingkat koreksi.<\/p><div id=\"sim-kpi\"><\/div>","visual":"chart","mode":"kpi","section":"Indikator & KPI"},{"title":"Mengenal Suara Pelanggan (VoC)","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Voice of Customer<\/b> adalah informasi tentang pengalaman, kebutuhan, masalah, dan harapan pelanggan.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Survei<\/h3><p>Pertanyaan terstruktur tentang pengalaman.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Wawancara<\/h3><p>Pendalaman alasan di balik penilaian.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Keluhan<\/h3><p>Masukan atas masalah yang dialami.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Observasi<\/h3><p>Pengamatan langsung terhadap alur layanan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Ulasan digital<\/h3><p>Ulasan yang relevan dan dapat dipertanggungjawabkan.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Gunakan beberapa sumber agar penilaian tidak bergantung pada satu pendapat saja.<\/p><\/aside>","visual":"crm","mode":"","section":"Survei Kepuasan"},{"title":"Langkah Membuat Survei Kepuasan","tag":"MATERI KELAS XI","body":"<div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Tentukan tujuan<\/h3><p>Contoh: apakah informasi layanan cukup jelas?<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Pilih responden<\/h3><p>Pelanggan yang benar-benar menggunakan layanan.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Rancang pertanyaan<\/h3><p>Singkat, netral, dan mengukur pengalaman tertentu.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Jelaskan privasi<\/h3><p>Terangkan penggunaan data serta sifat sukarela survei.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Olah dan tindak lanjuti<\/h3><p>Hitung hasil, baca komentar, dan susun aksi perbaikan.<\/p><\/div><\/div><\/div>","visual":"docs","mode":"","section":"Survei Kepuasan"},{"title":"Contoh Skala Penilaian 1–5","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Skor<\/th><th>Arti<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Sangat tidak puas<\/td><\/tr><tr><td>2<\/td><td>Tidak puas<\/td><\/tr><tr><td>3<\/td><td>Netral / cukup<\/td><\/tr><tr><td>4<\/td><td>Puas<\/td><\/tr><tr><td>5<\/td><td>Sangat puas<\/td><\/tr><\/tbody><\/table><\/div><p class=\"\">Contoh pertanyaan: <i>“Seberapa puas Anda terhadap kejelasan informasi yang diberikan petugas?”<\/i><\/p><aside class=\"note\"><strong>Aturan<\/strong><p>Jangan mengganti arti skala di tengah pengumpulan data. Gunakan pertanyaan yang konsisten.<\/p><\/aside>","visual":"sheet","mode":"","section":"Survei Kepuasan"},{"title":"Menyusun Pertanyaan yang Baik","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Kurang tepat<\/th><th>Lebih baik<\/th><\/tr><\/thead><tbody><tr><td>“Petugas kami sangat ramah, bukan?”<\/td><td>“Bagaimana penilaian Anda tentang keramahan petugas?”<\/td><\/tr><tr><td>“Apakah layanan cepat dan jelas?”<\/td><td>Pisahkan menjadi dua pertanyaan: kecepatan dan kejelasan.<\/td><\/tr><tr><td>“Semua layanan bagus, setuju?”<\/td><td>“Seberapa puas Anda terhadap pelayanan yang diterima?”<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Pertanyaan tidak menggiring, tidak ambigu, dan tidak menggabungkan beberapa aspek dalam satu penilaian.<\/p><\/aside>","visual":"docs","mode":"","section":"Survei Kepuasan"},{"title":"Menjaga Objektivitas Survei","tag":"MATERI KELAS XI","body":"<ul class=\"rich-list\"><li>Survei sebaiknya mencakup pelanggan yang puas dan kurang puas.<\/li><li>Hindari hanya meminta penilaian dari pelanggan tertentu.<\/li><li>Jelaskan periode pengambilan data, jumlah respons, dan cara survei.<\/li><li>Pisahkan komentar pelanggan dari fakta operasional.<\/li><li>Jaga kerahasiaan identitas sesuai ketentuan.<\/li><li>Hasil dari responden sedikit tidak otomatis mewakili seluruh pelanggan.<\/li><\/ul><aside class=\"note\"><strong>Contoh<\/strong><p>20 pelanggan dari 200 transaksi memberi umpan balik. Tuliskan 20 responden, bukan menyatakan 200 pelanggan puas.<\/p><\/aside>","visual":"security","mode":"","section":"Survei Kepuasan"},{"title":"Memahami CSAT","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Customer Satisfaction Score (CSAT)<\/b> adalah ukuran kepuasan berdasarkan pertanyaan pengalaman pelanggan.<\/p><p class=\"\">Dalam contoh Bab 8, responden memberi nilai 1–5 dan kategori <b>puas<\/b> adalah nilai 4 dan 5.<\/p><div class=\"task-box\"><b class=\"formula\">CSAT (%) = (Jumlah jawaban 4 dan 5 ÷ Jumlah seluruh jawaban valid) × 100%<\/b><\/div><aside class=\"note\"><strong>Catatan<\/strong><p>Definisi “puas” dan skala dapat berbeda antarorganisasi; tuliskan aturan penghitungan di laporan.<\/p><\/aside>","visual":"chart","mode":"","section":"Survei Kepuasan"},{"title":"Contoh Perhitungan CSAT","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Penilaian<\/th><th>Jumlah responden<\/th><\/tr><\/thead><tbody><tr><td>1 — Sangat tidak puas<\/td><td>5<\/td><\/tr><tr><td>2 — Tidak puas<\/td><td>10<\/td><\/tr><tr><td>3 — Netral<\/td><td>15<\/td><\/tr><tr><td>4 — Puas<\/td><td>45<\/td><\/tr><tr><td>5 — Sangat puas<\/td><td>25<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>100<\/b><\/td><\/tr><\/tbody><\/table><\/div><p class=\"\">Jawaban 4–5 = 45 + 25 = 70 pelanggan. <b>CSAT = 70/100 × 100% = 70%<\/b>.<\/p><aside class=\"note\"><strong>Interpretasi<\/strong><p>Sebanyak 70% responden yang menjawab survei memberi nilai puas atau sangat puas; ini bukan otomatis 70% dari semua pelanggan.<\/p><\/aside>","visual":"sheet","mode":"","section":"Survei Kepuasan"},{"title":"Simulasi Kalkulator CSAT","tag":"SIMULASI 3","body":"<p class=\"lead\">Ubah jumlah jawaban pada tiap skala. Perhatikan perubahan persentase puas dan distribusi respons.<\/p><div id=\"sim-csat\"><\/div>","visual":"chart","mode":"csat","section":"Survei Kepuasan"},{"title":"Mengenal Net Promoter Score (NPS)","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>NPS<\/b> mengukur kecenderungan pelanggan merekomendasikan layanan melalui skala 0–10.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Promoters (9–10)<\/h3><p>Pelanggan yang memberi nilai 9 atau 10.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Passives (7–8)<\/h3><p>Pelanggan yang memberi nilai 7 atau 8.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Detractors (0–6)<\/h3><p>Pelanggan yang memberi nilai 0 sampai 6.<\/p><\/article><\/div><div class=\"task-box\"><b class=\"formula\">NPS = % Promoters − % Detractors<\/b><\/div><aside class=\"note\"><strong>Skala NPS<\/strong><p>Hasil berada antara −100 sampai +100. NPS adalah skor, bukan persentase kepuasan atau persentase promotor.<\/p><\/aside>","visual":"chart","mode":"","section":"Survei Kepuasan"},{"title":"Contoh Perhitungan NPS","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Kelompok<\/th><th>Jumlah<\/th><th>Persentase<\/th><\/tr><\/thead><tbody><tr><td>Promoters<\/td><td>45<\/td><td>45%<\/td><\/tr><tr><td>Passives<\/td><td>30<\/td><td>30%<\/td><\/tr><tr><td>Detractors<\/td><td>25<\/td><td>25%<\/td><\/tr><tr><td>Total<\/td><td>100<\/td><td>100%<\/td><\/tr><\/tbody><\/table><\/div><p class=\"\">NPS = 45% − 25% = <b>+20<\/b>.<\/p><aside class=\"note\"><strong>Penting<\/strong><p>NPS +20 tidak berarti 20% pelanggan puas; artinya persentase promotor melebihi persentase detraktor sebesar 20 poin persentase.<\/p><\/aside>","visual":"chart","mode":"","section":"Survei Kepuasan"},{"title":"Simulasi Kalkulator NPS","tag":"SIMULASI 4","body":"<p class=\"lead\">Masukkan banyaknya responden setiap kelompok. Lihat skor serta perbandingan responden.<\/p><div id=\"sim-nps\"><\/div>","visual":"chart","mode":"nps","section":"Survei Kepuasan"},{"title":"Customer Effort Score (CES)","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>CES<\/b> mengukur seberapa mudah atau berat usaha yang dirasakan pelanggan ketika menyelesaikan kebutuhannya.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Contoh pertanyaan<\/h3><p>“Seberapa mudah Anda menyelesaikan urusan layanan hari ini?”<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Contoh skala<\/h3><p>1 = sangat sulit, 5 = sangat mudah.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Penggunaan<\/h3><p>Mengidentifikasi langkah berulang atau prosedur membingungkan.<\/p><\/article><\/div><aside class=\"note\"><strong>Hati-hati<\/strong><p>Skala dan arah pertanyaan CES tidak selalu sama. Pastikan semakin tinggi nilainya berarti semakin mudah, jika itu desain yang dipilih.<\/p><\/aside>","visual":"crm","mode":"","section":"Survei Kepuasan"},{"title":"CSAT, NPS, dan CES: Apa Bedanya?","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Ukuran<\/th><th>Pertanyaan utama<\/th><th>Tujuan<\/th><\/tr><\/thead><tbody><tr><td>CSAT<\/td><td>Seberapa puas terhadap layanan?<\/td><td>Menilai kepuasan pengalaman tertentu.<\/td><\/tr><tr><td>NPS<\/td><td>Seberapa mungkin merekomendasikan?<\/td><td>Melihat kecenderungan rekomendasi.<\/td><\/tr><tr><td>CES<\/td><td>Seberapa mudah menyelesaikan keperluan?<\/td><td>Mencari hambatan dan usaha pelanggan.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Kesimpulan<\/strong><p>Tidak ada satu angka yang cukup untuk menilai seluruh mutu pelayanan. Gabungkan dengan data operasional dan komentar.<\/p><\/aside>","visual":"sheet","mode":"","section":"Survei Kepuasan"},{"title":"Membaca Hasil Survei dengan Hati-hati","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Jumlah responden<\/h3><p>100 responden berbeda maknanya dari 10 responden.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Periode<\/h3><p>Bandingkan waktu yang setara, misalnya bulan ke bulan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Segmentasi<\/h3><p>Bandingkan jenis layanan atau saluran jika sampel cukup.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Konteks<\/h3><p>Perubahan nilai bisa dipengaruhi kasus khusus atau faktor eksternal.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>CSAT naik dari 70% menjadi 75%, tetapi jumlah respons turun tajam. Selidiki dulu sebelum menyimpulkan seluruh layanan membaik.<\/p><\/aside>","visual":"chart","mode":"","section":"Survei Kepuasan"},{"title":"Membangun Scorecard Kualitas","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Scorecard<\/b> adalah ringkasan indikator, target, hasil aktual, dan keputusan tindak lanjut.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Indikator<\/th><th>Target latihan<\/th><th>Aktual<\/th><th>Catatan<\/th><\/tr><\/thead><tbody><tr><td>Respons ≤ 4 jam<\/td><td>≥ 90%<\/td><td>80%<\/td><td>Perlu perbaikan<\/td><\/tr><tr><td>CSAT<\/td><td>≥ 80%<\/td><td>70%<\/td><td>Perlu perbaikan<\/td><\/tr><tr><td>Tepat waktu<\/td><td>≥ 90%<\/td><td>86%<\/td><td>Perlu perbaikan<\/td><\/tr><tr><td>FCR<\/td><td>≥ 75%<\/td><td>70%<\/td><td>Perlu perbaikan<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Ilustrasi<\/strong><p>Target dan data contoh hanya dipakai untuk latihan. Setiap instansi harus menetapkan indikator serta batas berdasarkan kebutuhannya.<\/p><\/aside>","visual":"sheet","mode":"","section":"Analisis Hasil"},{"title":"Data Kuantitatif dan Kualitatif","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Kuantitatif<\/h3><p>Angka: waktu respons, jumlah keluhan, CSAT, NPS, FCR.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Kualitatif<\/h3><p>Cerita: pengalaman pelanggan, komentar, hasil observasi, alasan keluhan.<\/p><\/article><\/div><p class=\"\">Gabungkan keduanya. Angka menunjukkan <i>seberapa besar<\/i> masalah, sedangkan komentar dapat membantu menjelaskan <i>mengapa<\/i> masalah terjadi.<\/p><aside class=\"note\"><strong>Contoh<\/strong><p>Rata-rata respons lama; komentar pelanggan menjelaskan bahwa kanal chat tidak memberi nomor antrean.<\/p><\/aside>","visual":"chart","mode":"","section":"Analisis Hasil"},{"title":"Jenis Keluhan yang Sering Ditemui","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Jenis<\/th><th>Contoh<\/th><th>Bukti<\/th><\/tr><\/thead><tbody><tr><td>Keterlambatan<\/td><td>Dokumen selesai melewati janji<\/td><td>Log waktu dan tenggat<\/td><\/tr><tr><td>Ketidakjelasan<\/td><td>Persyaratan berubah tanpa informasi<\/td><td>Pengumuman dan percakapan<\/td><\/tr><tr><td>Ketidaktepatan<\/td><td>Nama pelanggan salah ketik<\/td><td>Dokumen dan data asli<\/td><\/tr><tr><td>Sikap layanan<\/td><td>Petugas memotong pembicaraan<\/td><td>Umpan balik dan observasi<\/td><\/tr><tr><td>Masalah sistem<\/td><td>Portal error saat pendaftaran<\/td><td>Tangkapan layar serta log sistem<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Keluhan harus diverifikasi dengan bukti, tetap ditanggapi dengan hormat, dan tidak diumumkan sembarangan.<\/p><\/aside>","visual":"crm","mode":"","section":"Analisis Hasil"},{"title":"Mengelompokkan dan Memprioritaskan Masalah","tag":"MATERI KELAS XI","body":"<div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Kumpulkan keluhan<\/h3><p>Catat tanggal, saluran, peristiwa, dan nomor tiket.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Kelompokkan<\/h3><p>Pisahkan waktu, informasi, kesalahan data, sikap, dan sistem.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Nilai urgensi dan dampak<\/h3><p>Prioritaskan keselamatan, keamanan data, serta layanan yang terhenti.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Tetapkan PIC<\/h3><p>Tentukan unit yang bertanggung jawab dan batas tindak lanjut.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Pantau penyelesaian<\/h3><p>Berikan pembaruan dan dokumentasi hasil.<\/p><\/div><\/div><\/div>","visual":"crm","mode":"","section":"Analisis Hasil"},{"title":"Layanan yang Pulih Setelah Kesalahan","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Service recovery<\/b> adalah upaya memulihkan pelayanan setelah pelanggan mengalami kegagalan atau ketidaknyamanan.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Dengarkan<\/h3><p>Berikan kesempatan pelanggan menjelaskan masalah.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Akui pengalaman pelanggan<\/h3><p>Sampaikan empati tanpa menyalahkan.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Verifikasi fakta<\/h3><p>Periksa data, nomor tiket, dan kewenangan.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Tawarkan solusi<\/h3><p>Jelaskan tindakan dan waktu secara realistis.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Konfirmasi<\/h3><p>Pastikan pelanggan memahami hasil dan langkah selanjutnya.<\/p><\/div><\/div><\/div>","visual":"team","mode":"","section":"Analisis Hasil"},{"title":"Contoh Respons Keluhan yang Profesional","tag":"MATERI KELAS XI","body":"<p class=\"\"><b>Situasi:<\/b> pelanggan bertanya mengapa dokumen yang dijanjikan satu hari belum selesai setelah tiga hari.<\/p><div class=\"sample-document\">“Selamat pagi. Terima kasih sudah menghubungi kami. Kami memahami keterlambatan ini merepotkan Anda. Saya akan memeriksa status dokumen dengan nomor permintaan yang Anda miliki. Setelah kami mendapat informasi yang pasti, kami akan mengabarkan langkah penyelesaiannya melalui kanal yang disepakati.”<\/div><aside class=\"note\"><strong>Yang perlu dihindari<\/strong><p>Jangan menyalahkan pelanggan, menjanjikan waktu tanpa verifikasi, atau mengungkap informasi pribadi.<\/p><\/aside>","visual":"mail","mode":"","section":"Analisis Hasil"},{"title":"Simulasi Penanganan Keluhan","tag":"SIMULASI 5","body":"<p class=\"lead\">Kamu berperan sebagai staf customer service. Tentukan tindakan paling profesional dari lima situasi.<\/p><div id=\"sim-keluhan\"><\/div>","visual":"team","mode":"complaint","section":"Analisis Hasil"},{"title":"Menghindari Kesimpulan yang Salah","tag":"MATERI KELAS XI","body":"<ul class=\"rich-list\"><li>Satu komentar negatif belum cukup membuktikan semua pelanggan tidak puas.<\/li><li>Korelasi tidak otomatis berarti sebab-akibat.<\/li><li>Pegawai dengan kasus lebih rumit tidak adil dibandingkan tanpa mempertimbangkan konteks.<\/li><li>Perubahan angka bisa terjadi karena jumlah responden atau metode pengambilan data berbeda.<\/li><li>Satu indikator tidak menggambarkan semua aspek kualitas.<\/li><\/ul><aside class=\"note\"><strong>Evaluasi adil<\/strong><p>Gunakan bukti yang dapat diverifikasi dan jelaskan keterbatasan data.<\/p><\/aside>","visual":"security","mode":"","section":"Analisis Hasil"},{"title":"Apa Itu Akar Masalah?","tag":"MATERI KELAS XI","body":"<p class=\"lead\"><b>Akar masalah<\/b> adalah penyebab mendasar yang perlu ditangani agar persoalan tidak berulang.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Gejala<\/h3><p>Pelanggan berkali-kali menanyakan status.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Penyebab langsung<\/h3><p>Tidak menerima pemberitahuan progres.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Kemungkinan akar masalah<\/h3><p>Sistem pencatatan status belum terhubung ke kanal pemberitahuan.<\/p><\/article><\/div><aside class=\"note\"><strong>Prinsip<\/strong><p>Akar masalah adalah hipotesis sampai dibuktikan dengan data atau observasi.<\/p><\/aside>","visual":"chart","mode":"","section":"Perbaikan Layanan"},{"title":"Teknik 5 Why (Lima Mengapa)","tag":"MATERI KELAS XI","body":"<div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Mengapa pelanggan menunggu?<\/h3><p>Karena tiket belum diproses.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Mengapa tiket belum diproses?<\/h3><p>Karena tidak masuk antrean petugas.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Mengapa tidak masuk antrean?<\/h3><p>Karena kategori tiket tidak terisi.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Mengapa kategori kosong?<\/h3><p>Karena formulir tidak mewajibkan kategori.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Mengapa belum diwajibkan?<\/h3><p>Karena SOP dan sistem belum diperbarui.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Hasil analisis contoh<\/strong><p>Perbaikan: perbarui SOP dan validasi formulir. Cek data nyata sebelum menetapkan ini sebagai akar masalah.<\/p><\/aside>","visual":"slides","mode":"","section":"Perbaikan Layanan"},{"title":"Diagram Sebab-Akibat (Fishbone)","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Diagram fishbone membantu mengelompokkan kemungkinan penyebab dari beberapa sisi.<\/p><div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Manusia<\/h3><p>Keterampilan, pembagian tugas, beban kerja.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Metode<\/h3><p>SOP, alur persetujuan, penjadwalan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Mesin / Teknologi<\/h3><p>Aplikasi lambat, gangguan jaringan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Material / Informasi<\/h3><p>Dokumen tidak lengkap atau informasi usang.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Lingkungan<\/h3><p>Ruang bising, antrean, akses terbatas.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">06<\/span><h3>Pengukuran<\/h3><p>Indikator tidak jelas atau salah pencatatan.<\/p><\/article><\/div><aside class=\"note\"><strong>Tugas<\/strong><p>Pilih satu keluhan layanan, lalu tuliskan sedikitnya satu kemungkinan penyebab untuk setiap kategori yang relevan.<\/p><\/aside>","visual":"chart","mode":"","section":"Perbaikan Layanan"},{"title":"Siklus PDCA untuk Perbaikan","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>P — Plan<\/h3><p>Rumusan masalah, data, akar penyebab, dan target.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>D — Do<\/h3><p>Uji solusi dalam skala terkontrol.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>C — Check<\/h3><p>Bandingkan hasil dengan indikator awal dan target.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>A — Act<\/h3><p>Tetapkan perbaikan, sesuaikan, atau ulangi siklus.<\/p><\/article><\/div><aside class=\"note\"><strong>Contoh<\/strong><p>Uji template balasan dan pembagian shift selama dua minggu; lihat perubahan waktu respons sebelum memperluas.<\/p><\/aside>","visual":"slides","mode":"","section":"Perbaikan Layanan"},{"title":"Menyusun Target SMART","tag":"MATERI KELAS XI","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Specific<\/h3><p>Target berfokus pada aspek layanan yang jelas.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Measurable<\/h3><p>Dapat dihitung dengan indikator tertentu.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Achievable<\/h3><p>Masuk akal dengan sumber daya tersedia.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Relevant<\/h3><p>Berkaitan dengan kebutuhan pelanggan dan perusahaan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Time-bound<\/h3><p>Memiliki tenggat pengukuran.<\/p><\/article><\/div><p class=\"\"><b>Contoh:<\/b> “Dalam 30 hari, persentase tiket yang mendapat respons awal ≤4 jam kerja ditingkatkan dari 80% menjadi minimal 90%.”<\/p>","visual":"calendar","mode":"","section":"Perbaikan Layanan"},{"title":"Membuat Rencana Aksi Perbaikan","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Masalah<\/th><th>Tindakan<\/th><th>PIC<\/th><th>Tenggat<\/th><th>Ukuran hasil<\/th><\/tr><\/thead><tbody><tr><td>Respons lambat<\/td><td>Buat antrean tiket dan pembagian shift<\/td><td>Koordinator CS<\/td><td>30 hari<\/td><td>≥ 90% respons ≤4 jam<\/td><\/tr><tr><td>Dokumen sering salah<\/td><td>Gunakan checklist verifikasi<\/td><td>Admin<\/td><td>14 hari<\/td><td>Kesalahan < 3%<\/td><\/tr><tr><td>Info prosedur tidak jelas<\/td><td>Perbarui FAQ layanan<\/td><td>Tim informasi<\/td><td>7 hari<\/td><td>Keluhan informasi turun<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>PIC<\/strong><p>Person in Charge adalah orang atau unit yang bertanggung jawab. Target di tabel merupakan contoh untuk pembelajaran.<\/p><\/aside>","visual":"sheet","mode":"","section":"Perbaikan Layanan"},{"title":"Simulasi Merancang PDCA","tag":"SIMULASI 6","body":"<p class=\"lead\">Susun rencana perbaikan layananmu. Isi masalah, bukti, tindakan, indikator, PIC, dan tenggat; kemudian periksa kelengkapannya.<\/p><div id=\"sim-pdca\"><\/div>","visual":"docs","mode":"pdca","section":"Perbaikan Layanan"},{"title":"Menilai Perbaikan Setelah Diterapkan","tag":"MATERI KELAS XI","body":"<div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Ambil baseline<\/h3><p>Catat angka sebelum perubahan.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Jalankan uji coba<\/h3><p>Terapkan solusi pada periode yang ditentukan.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Ukur dengan definisi sama<\/h3><p>Samakan waktu, populasi, dan cara hitung.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Bandingkan dan diskusikan<\/h3><p>Analisis apakah perubahan bermakna serta ada dampak samping.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Putuskan tindak lanjut<\/h3><p>Pertahankan, perbaiki, atau hentikan uji coba.<\/p><\/div><\/div><\/div>","visual":"chart","mode":"","section":"Perbaikan Layanan"},{"title":"Laporan Evaluasi Kualitas Layanan","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Laporan harus akurat, ringkas, terstruktur, dan memuat dasar pengambilan keputusan.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Identitas dan tujuan<\/h3><p>Unit, periode, serta tujuan evaluasi.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Metode dan sumber<\/h3><p>Survei, observasi, log, jumlah responden.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Hasil<\/h3><p>Tabel, grafik, dan perbandingan target.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Analisis<\/h3><p>Masalah dominan, dugaan penyebab, dan keterbatasan.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Rekomendasi<\/h3><p>Tindakan, penanggung jawab, jadwal, serta indikator keberhasilan.<\/p><\/div><\/div><\/div>","visual":"docs","mode":"","section":"Perbaikan Layanan"},{"title":"Contoh Dashboard Evaluasi","tag":"MATERI KELAS XI","body":"<p class=\"lead\">Laporan dashboard menyederhanakan pembacaan indikator oleh pimpinan.<\/p><div class=\"kpi-stats\"><div class=\"kpi-stat\"><b>70%<\/b><span>CSAT (100 responden)<\/span><\/div><div class=\"kpi-stat\"><b>+20<\/b><span>NPS (100 responden)<\/span><\/div><div class=\"kpi-stat\"><b>86%<\/b><span>Tepat waktu (100 kasus)<\/span><\/div><\/div><aside class=\"note\"><strong>Interpretasi<\/strong><p>Setiap angka membutuhkan sumber, rentang waktu, dan definisi yang jelas; jangan hanya menampilkan angka tanpa penjelasan.<\/p><\/aside>","visual":"chart","mode":"","section":"Perbaikan Layanan"},{"title":"Menyampaikan Hasil Secara Profesional","tag":"MATERI KELAS XI","body":"<ul class=\"rich-list\"><li>Gunakan judul yang menggambarkan hasil secara tepat.<\/li><li>Tampilkan satuan, sumber data, dan periode evaluasi.<\/li><li>Bedakan hasil, interpretasi, dan rekomendasi.<\/li><li>Tulis keberhasilan sekaligus kekurangan.<\/li><li>Jaga anonimitas pelanggan dan kerahasiaan data.<\/li><li>Sampaikan tindak lanjut yang dapat dikerjakan.<\/li><\/ul><aside class=\"note\"><strong>Presentasi bisnis<\/strong><p>Jangan memanipulasi grafik dengan mengubah skala tanpa penjelasan yang jelas.<\/p><\/aside>","visual":"slides","mode":"","section":"Perbaikan Layanan"},{"title":"LKPD 1 — Audit Pelayanan Sekolah","tag":"LEMBAR KERJA","body":"<p class=\"lead\"><b>Proyek kelompok (4–5 siswa):<\/b> audit sederhana salah satu layanan di lingkungan sekolah dengan izin guru.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Pilih proses<\/h3><p>Misalnya peminjaman buku, penerimaan tamu, atau administrasi surat.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Buat instrumen<\/h3><p>Tuliskan lima indikator yang sesuai dengan dimensi kualitas layanan.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Kumpulkan bukti<\/h3><p>Observasi prosedur; bila perlu wawancara sukarela tanpa data sensitif.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Analisis<\/h3><p>Bandingkan temuan dengan SOP dan rumuskan dua masalah prioritas.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Presentasikan<\/h3><p>Buat ringkasan satu halaman dan usulkan perbaikan realistis.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Produk<\/strong><p>Checklist observasi, tabel temuan, kesimpulan, dan dua usulan perbaikan.<\/p><\/aside>","visual":"team","mode":"","section":"Proyek & Evaluasi"},{"title":"LKPD 2 — Survei Kepuasan Simulasi","tag":"LEMBAR KERJA","body":"<p class=\"lead\"><b>Proyek praktik:<\/b> lakukan simulasi layanan kantor, kemudian kumpulkan penilaian rekan dengan skala 1–5.<\/p><div class=\"steps\"><div class=\"step\"><b>1<\/b><div><h3>Bentuk kelompok<\/h3><p>Petugas layanan, pelanggan, pengamat, dan pencatat.<\/p><\/div><\/div><div class=\"step\"><b>2<\/b><div><h3>Simulasikan layanan<\/h3><p>Penerimaan permintaan dokumen atau penyampaian informasi.<\/p><\/div><\/div><div class=\"step\"><b>3<\/b><div><h3>Bagikan survei<\/h3><p>Gunakan 3–5 pertanyaan netral dan skala yang jelas.<\/p><\/div><\/div><div class=\"step\"><b>4<\/b><div><h3>Hitung data<\/h3><p>Buat tabel dan hitung CSAT berdasarkan jawaban 4–5.<\/p><\/div><\/div><div class=\"step\"><b>5<\/b><div><h3>Rancang perbaikan<\/h3><p>Tulis masalah, dugaan penyebab, tindakan, dan indikator ukur ulang.<\/p><\/div><\/div><\/div><aside class=\"note\"><strong>Produk<\/strong><p>Rekap penilaian, hasil perhitungan CSAT, laporan mini, dan rencana PDCA.<\/p><\/aside>","visual":"sheet","mode":"","section":"Proyek & Evaluasi"},{"title":"Rubrik Penilaian Proyek","tag":"MATERI KELAS XI","body":"<div class=\"table-wrap\"><table><thead><tr><th>Aspek<\/th><th>Bobot<\/th><th>Kriteria<\/th><\/tr><\/thead><tbody><tr><td>Ketepatan indikator<\/td><td>25%<\/td><td>Sesuai tujuan layanan dan dapat diukur.<\/td><\/tr><tr><td>Kelengkapan data<\/td><td>20%<\/td><td>Sumber, jumlah sampel, dan pencatatan jelas.<\/td><\/tr><tr><td>Analisis & hitungan<\/td><td>25%<\/td><td>Perhitungan tepat dan interpretasi hati-hati.<\/td><\/tr><tr><td>Rencana aksi<\/td><td>20%<\/td><td>Solusi relevan dengan PIC dan tenggat.<\/td><\/tr><tr><td>Presentasi & kerja sama<\/td><td>10%<\/td><td>Rapi, komunikatif, dan seluruh anggota berkontribusi.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\"><strong>Guru<\/strong><p>Rubrik ini contoh; silakan disesuaikan dengan kondisi kelas dan kebutuhan pembelajaran.<\/p><\/aside>","visual":"docs","mode":"","section":"Proyek & Evaluasi"},{"title":"Studi Kasus Akhir Bab: CV Prima Solusi","tag":"STUDI KASUS","body":"<p class=\"lead\">Dalam satu bulan, CV Prima Solusi melayani <b>100 tiket<\/b>. Sebanyak 86 tiket selesai tepat waktu, 28 dari 40 tiket yang memenuhi kriteria selesai pada kontak pertama, dan 100 pelanggan mengisi survei: 5 nilai 1, 10 nilai 2, 15 nilai 3, 45 nilai 4, 25 nilai 5.<\/p><ul class=\"rich-list\"><li>Hitung tingkat ketepatan waktu dan FCR.<\/li><li>Hitung CSAT dengan ketentuan nilai 4–5 adalah puas.<\/li><li>Tentukan dua indikator yang perlu diselidiki lebih lanjut.<\/li><li>Buat satu rencana tindakan SMART dan satu cara mengukur hasilnya.<\/li><\/ul><aside class=\"note\"><strong>Data fiktif<\/strong><p>Gunakan angka pada soal dan jelaskan pembagiannya; jangan menyimpulkan penyebab tanpa bukti.<\/p><\/aside>","visual":"crm","mode":"","section":"Proyek & Evaluasi"},{"title":"Refleksi Diri","tag":"REFLEKSI","body":"<p class=\"lead\">Tandai pemahamanmu terhadap kompetensi berikut.<\/p><div id=\"sim-refleksi\"><\/div>","visual":"team","mode":"reflect","section":"Proyek & Evaluasi"},{"title":"Kuis Evaluasi Bab 8","tag":"PETUNJUK KUIS","body":"<p class=\"lead\">Uji pemahamanmu tentang indikator kualitas, survei kepuasan, penanganan keluhan, dan perbaikan layanan.<\/p><div class=\"diagram-tiles\"><div>📋<b>15 soal<\/b><small>Pilihan ganda<\/small><\/div><div>🧮<b>Perhitungan<\/b><small>CSAT dan NPS<\/small><\/div><div>🎯<b>Nilai 0–100<\/b><small>Otomatis<\/small><\/div><\/div><aside class=\"note\"><strong>Petunjuk<\/strong><p>Jawab 15 soal dalam dua bagian. Hasil dan pembahasan tersedia di akhir. Kamu bisa mengulang jika ingin latihan kembali.<\/p><\/aside>","visual":"quiz","mode":"","section":"Kuis & Penutup"},{"title":"Kuis — Soal 1 sampai 8","tag":"KUIS BAGIAN 1","body":"<div id=\"quiz-a\"><\/div>","visual":"quiz","mode":"quiza","section":"Kuis & Penutup"},{"title":"Kuis — Soal 9 sampai 15","tag":"KUIS BAGIAN 2","body":"<div id=\"quiz-b\"><\/div>","visual":"quiz","mode":"quizb","section":"Kuis & Penutup"},{"title":"Hasil dan Pembahasan Kuis","tag":"HASIL BELAJAR","body":"<div id=\"quiz-result\"><\/div>","visual":"chart","mode":"quizresult","section":"Kuis & Penutup"},{"title":"Rangkuman Bab 8","tag":"RANGKUMAN","body":"<div class=\"cards\"><article class=\"info-card\"><span class=\"card-index\">01<\/span><h3>Ukur<\/h3><p>Gunakan indikator dan data, bukan sekadar kesan.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">02<\/span><h3>Dengarkan<\/h3><p>Gabungkan survei, keluhan, dan observasi.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">03<\/span><h3>Analisis<\/h3><p>Cari akar masalah tanpa menyalahkan tanpa bukti.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">04<\/span><h3>Perbaiki<\/h3><p>Lakukan PDCA dan tentukan target SMART.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">05<\/span><h3>Pantau<\/h3><p>Ukur ulang dengan cara yang konsisten.<\/p><\/article><article class=\"info-card\"><span class=\"card-index\">06<\/span><h3>Laporkan<\/h3><p>Tampilkan hasil, keterbatasan, dan rekomendasi.<\/p><\/article><\/div><aside class=\"note\"><strong>Ingat<\/strong><p>Pelayanan yang baik tidak berhenti pada menyelesaikan permintaan. Mutu perlu terus dievaluasi dan ditingkatkan.<\/p><\/aside>","visual":"slides","mode":"","section":"Kuis & Penutup"},{"title":"Selamat! Bab 8 Selesai","tag":"PENUTUP","body":"<div class=\"finish\"><div class=\"finish-icon\">✓<\/div><h2>Siap Mengevaluasi Layanan Bisnis!<\/h2><p>Gunakan indikator yang jelas, dengarkan pelanggan, analisis bukti, dan lakukan perbaikan secara bertahap.<\/p><div class=\"chip-list\" style=\"justify-content:center\"><span>6 simulasi<\/span><span>15 soal kuis<\/span><span>2 LKPD<\/span><span>Studi kasus<\/span><\/div><p class=\"fineprint\" style=\"margin-top:20px\">Semua nama perusahaan, angka, dan contoh kasus dalam bahan ajar ini merupakan simulasi untuk pendidikan.<\/p><div class=\"action-row\" style=\"justify-content:center\"><button class=\"action-btn\" data-act=\"home\">↩ Kembali ke Beranda<\/button><button class=\"action-btn alt\" data-act=\"menu\">Pilih Slide<\/button><\/div><\/div>","visual":"team","mode":"","section":"Kuis & Penutup"}]</script><script>'use strict';

function visual(type,s){const usePhoto=s.mode==='cover'&&photos[type];return `<div class="visual-wrap ${usePhoto?'visual-photo':''}"><div class="visual-title"><b>Ilustrasi Materi</b><span>${safe(s.section)}</span></div><div class="visual-frame">${usePhoto?`<img class="photo-tile" alt="Tim kantor profesional sedang mengevaluasi pelayanan" loading="eager" src="${photos[type]}" onload="this.classList.add('loaded')" onerror="this.style.display='none'">`:''}${icoArt(type)}</div>${usePhoto?'<span class="visual-credit">Foto memerlukan internet; ilustrasi tetap tersedia offline</span>':''}</div>`;}
function draw(){const s=slides[current];$('#slideHost').innerHTML=`<article class="slide ${s.mode==='cover'?'cover':''}"><div class="slide-head"><div class="section-label">${safe(s.section)}</div><span class="tag">${safe(s.tag)}</span></div><h1 class="slide-title">${safe(s.title)}</h1><div class="slide-layout"><section class="slide-content">${s.body}</section>${visual(s.visual,s)}</div><div class="footnote">Manajemen Layanan Bisnis · Kelas XI SMK · Contoh angka dan kasus bersifat fiktif.</div></article>`;$('#slideCount').textContent=`${current+1} / ${slides.length}`;$('#progressFill').style.width=(100*(current+1)/slides.length)+'%';$('#railFill').style.width=(100*(current+1)/slides.length)+'%';$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===slides.length-1;$('#stage').scrollTop=0;({dimensions:renderDimensions,kpi:renderKpi,csat:renderCSAT,nps:renderNPS,complaint:renderComplaint,pdca:renderPDCA,quiza:renderQuiz,quizb:renderQuiz,quizresult:renderQuizResult,reflect:renderReflect})[s.mode]?.();}
function navigate(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===current)return;stopSpeech();current=n;draw();history.replaceState(null,'','#slide-'+(n+1));}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false;let b=$('#speakBtn');if(b)b.textContent='◖))'}
function speak(){if(!('speechSynthesis' in window)){alert('Pembacaan suara tidak didukung browser ini.');return}if(speaking){stopSpeech();return;}const s=slides[current];const t=s.title+'. '+$('.slide-content').innerText.replace(/\s+/g,' ').slice(0,3200);let u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.92;stopSpeech();speaking=true;$('#speakBtn').textContent='■';u.onend=()=>{speaking=false;$('#speakBtn').textContent='◖))'};u.onerror=()=>{speaking=false;$('#speakBtn').textContent='◖))'};speechSynthesis.speak(u)}
function menu(){menuSection='Semua';drawMenu();$('#menuOverlay').classList.add('open')}
function drawMenu(){let sections=['Semua',...new Set(slides.map(s=>s.section))];$('#sections').innerHTML=sections.map(s=>`<button class="section-chip ${s===menuSection?'active':''}" data-section="${safe(s)}">${safe(s)}</button>`).join('');$('#slideIndex').innerHTML=slides.map((s,i)=>({...s,i})).filter(s=>menuSection==='Semua'||s.section===menuSection).map(s=>`<button class="index-item ${s.i===current?'active':''}" data-slide="${s.i}"><small>SLIDE ${String(s.i+1).padStart(2,'0')}</small><b>${safe(s.title)}</b></button>`).join('')}
function closeMenu(){$('#menuOverlay').classList.remove('open')}
function inputField(id,label,val,type='number',min='0',max='100000'){return `<label class="field">${label}<input id="${id}" type="${type}" value="${safe(val)}" ${type==='number'?`min="${min}" max="${max}" inputmode="numeric"`:''}></label>`}
function textField(id,label,val,placeholder='',area=false){return `<label class="field ${area?'wide':''}">${label}${area?`<textarea id="${id}" placeholder="${safe(placeholder)}">${safe(val)}</textarea>`:`<input id="${id}" value="${safe(val)}" placeholder="${safe(placeholder)}">`}</label>`}
function renderDimensions(){const names=['Bukti fisik','Keandalan','Daya tanggap','Jaminan','Empati'];$('#sim-dimensi').innerHTML=`<div class="workbench"><p class="mini-hint">Geser angka ke nilai 1 (perlu perbaikan besar) hingga 5 (sangat baik), berdasarkan contoh hasil observasi.</p>${names.map((v,i)=>`<div class="range-row"><label for="dim${i}">${i+1}. ${v}</label><input type="range" min="1" max="5" step="1" value="${state.dimensions[i]}" id="dim${i}"><span class="r-val" id="dimValue${i}">${state.dimensions[i]} / 5</span></div>`).join('')}<div id="dimResult" class="feedback"></div><div class="action-row"><button class="action-btn alt" data-act="dim-reset">Atur Ulang</button></div></div>`;updateDimensions()}
function updateDimensions(){const a=state.dimensions,names=['Bukti fisik','Keandalan','Daya tanggap','Jaminan','Empati'],min=Math.min(...a),avg=a.reduce((a,b)=>a+b,0)/5;$('#dimResult').innerHTML=`<b>Rata-rata penilaian: ${avg.toFixed(1).replace('.',',')} / 5</b><p>Prioritas evaluasi: <b>${names.filter((_,i)=>a[i]===min).join(', ')}</b> (skor ${min}).</p><p class="mini-hint">Nilai terendah perlu diselidiki, bukan otomatis membuktikan penyebab masalah.</p>`;a.forEach((x,i)=>{$('#dimValue'+i).textContent=x+' / 5'})}
function renderKpi(){const k=state.kpi;$('#sim-kpi').innerHTML=`<div class="workbench"><div class="fields">${inputField('kpTickets','Jumlah tiket',k.tickets)}${inputField('kpOntime','Selesai tepat waktu',k.ontime)}${inputField('kpEligible','Kasus memenuhi kriteria FCR',k.eligible)}${inputField('kpFcr','Tuntas pada kontak pertama',k.fcr)}${inputField('kpDocs','Total dokumen diperiksa',k.documents)}${inputField('kpCorrections','Dokumen perlu koreksi',k.corrections)}</div><div id="kpiResult"></div><div class="action-row"><button class="action-btn alt" data-act="kpi-reset">Kembali ke Contoh</button></div></div>`;updateKpi()}
function updateKpi(){const k=state.kpi;if(!$('#kpiResult'))return;let nums=Object.values(k);let valid=nums.every(x=>Number.isFinite(x)&&x>=0)&&k.tickets>0&&k.eligible>0&&k.documents>0&&k.ontime<=k.tickets&&k.fcr<=k.eligible&&k.corrections<=k.documents;if(!valid){$('#kpiResult').innerHTML='<div class="feedback warn">Isi jumlah total lebih dari 0. Nilai bagian tidak boleh melebihi totalnya.</div>';return}let timely=100*k.ontime/k.tickets,fcr=100*k.fcr/k.eligible,correction=100*k.corrections/k.documents;$('#kpiResult').innerHTML=`<div class="kpi-stats"><div class="kpi-stat"><b>${pct(timely)}</b><span>Selesai tepat waktu</span></div><div class="kpi-stat"><b>${pct(fcr)}</b><span>FCR</span></div><div class="kpi-stat"><b>${pct(correction)}</b><span>Perlu koreksi</span></div></div><p class="mini-hint">Semakin tinggi ketepatan waktu dan FCR umumnya semakin baik; untuk tingkat koreksi, semakin rendah umumnya semakin baik. Analisis konteks dan definisi datanya.</p>`}
function renderCSAT(){const labels=['1 — Sangat tidak puas','2 — Tidak puas','3 — Netral','4 — Puas','5 — Sangat puas'];$('#sim-csat').innerHTML=`<div class="workbench"><div class="fields">${labels.map((v,i)=>inputField('cs'+i,v,state.csat[i])).join('')}</div><div id="csatResult"></div><div class="action-row"><button class="action-btn alt" data-act="cs-reset">Gunakan Data Contoh</button></div></div>`;updateCSAT()}
function updateCSAT(){let d=state.csat,total=d.reduce((a,b)=>a+b,0),good=d[3]+d[4],el=$('#csatResult');if(!el)return;if(!total||d.some(x=>!Number.isFinite(x)||x<0)){el.innerHTML='<div class="feedback warn">Isi jumlah jawaban valid pada skala 1–5; total harus lebih dari 0.</div>';return}let cp=100*good/total;el.innerHTML=`<div class="kpi-stats"><div class="kpi-stat"><b>${pct(cp)}</b><span>CSAT: nilai 4 dan 5</span></div><div class="kpi-stat"><b>${fNum(total)}</b><span>Total jawaban valid</span></div><div class="kpi-stat"><b>${fNum(good)}</b><span>Responden puas</span></div></div><div class="mini-chart">${d.map((v,i)=>`<div><b>${fNum(v)}</b><span class="bar" style="height:${Math.max(3,100*v/Math.max(...d,1))}%"></span><label>Nilai ${i+1}</label></div>`).join('')}</div><p class="mini-hint">Interpretasi: ${pct(cp)} dari ${fNum(total)} responden yang menjawab memberi nilai 4 atau 5, bukan otomatis seluruh pelanggan.</p>`}
function renderNPS(){const labels=['Promoters (9–10)','Passives (7–8)','Detractors (0–6)'];$('#sim-nps').innerHTML=`<div class="workbench"><div class="fields">${labels.map((v,i)=>inputField('np'+i,v,state.nps[i])).join('')}</div><div id="npsResult"></div><div class="action-row"><button class="action-btn alt" data-act="np-reset">Gunakan Data Contoh</button></div></div>`;updateNPS()}
function updateNPS(){let d=state.nps,total=d.reduce((a,b)=>a+b,0),el=$('#npsResult');if(!el)return;if(!total||d.some(x=>!Number.isFinite(x)||x<0)){el.innerHTML='<div class="feedback warn">Total responden harus lebih dari 0 dan semua jumlah tidak negatif.</div>';return}let nps=100*(d[0]-d[2])/total;let sign=nps>0?'+':'';el.innerHTML=`<div class="kpi-stats"><div class="kpi-stat"><b>${sign}${nps.toLocaleString('id-ID',{maximumFractionDigits:1})}</b><span>Skor NPS (−100 sampai +100)</span></div><div class="kpi-stat"><b>${pct(100*d[0]/total)}</b><span>Promoters</span></div><div class="kpi-stat"><b>${pct(100*d[2]/total)}</b><span>Detractors</span></div></div><div class="mini-chart">${d.map((v,i)=>`<div><b>${fNum(v)}</b><span class="bar" style="height:${Math.max(3,100*v/Math.max(...d,1))}%"></span><label>${['Promoters','Passives','Detractors'][i]}</label></div>`).join('')}</div><p class="mini-hint">NPS merupakan selisih poin persentase promotor dan detraktor, bukan persentase kepuasan.</p>`}
